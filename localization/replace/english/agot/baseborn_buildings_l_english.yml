l_english:
 building_baseborn_shell_01:0 "The Shell"
 building_type_baseborn_shell_01:0 "Middlefort"
 building_baseborn_shell_01_desc:0 "A circular fortification around Middlefort. It may not be the sturdiest defense, but it's better than nothing."

 building_baseborn_pepperwood_01:0 "Pepperwood"
 building_type_baseborn_pepperwood_01:0 "Pepperwood"
 building_baseborn_pepperwood_01_desc:0 "These woods are the main source of black pepper for all of Westeros. Though black pepper is not a precious resource, one can make a modest living from it... and good food."
 building_baseborn_pepperwood_02:0 "Pepper Market"
 building_type_baseborn_pepperwood_02:0 "Pepperwood"
 building_baseborn_pepperwood_02_desc:0 "This market eases the sale black pepper and is a stop for many merchants along the way to Maidenpool and King's Landing."
 building_baseborn_pepperwood_03:0 "Labor from Crackclaw"
 building_type_baseborn_pepperwood_03:0 "Pepperwood"
 building_baseborn_pepperwood_03_desc:0 "While the Clawmen may not like it, forcing them to harvest the black pepper frees up our manpower to be used elsewhere, and greatly increases the amount of pepper produced."
 building_baseborn_pepperwood_04:0 "Peppercorn Plantation"
 building_type_baseborn_pepperwood_04:0 "Pepperwood"
 building_baseborn_pepperwood_04_desc:0 "With much of the forest cut down and what's left of it organized into rows for the Clawmen to harvest, black pepper is now harvested and exported with the upmost efficiency."

 building_baseborn_arbor_01:0 "Port of Wine"
 building_type_baseborn_arbor_01:0 "Wynegarde"
 building_baseborn_arbor_01_desc:0 "These massive docks themselves must house both the dozens of merchants who come to purchase Arbor gold each day and the Redwyne fleet. The docks are so large that there are many gaps and weak points in it's defenses that seaborne raiders could use to pillage the region quite easily."

 building_baseborn_nutt_grinder_01:0 "Nutt Grinder"
 building_type_baseborn_nutt_grinder_01:0 "Riverbend"
 building_baseborn_nutt_grinder_01_desc:0 "Long has House Nutt utilized the Trident's power to mill acorns into flour and supply the burgeoning local area where roads converge. It became known as the Nutt Grinder as a crass joke that never seems to get old."
