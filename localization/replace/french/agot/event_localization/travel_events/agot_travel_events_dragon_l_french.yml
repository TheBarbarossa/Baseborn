l_french:
 agot_travel_events_dragon.9000.t:0 "À tire-d’aile"
 agot_travel_events_dragon.9000.desc:0 "[awkward_entourage_member.GetName] s'approche de moi, nerveu[awkward_entourage_member.Custom('FR_XSe')], alors que j'enfourche [dragon.GetFirstName] en prévision du voyage qui m'attends.\n\n« Malheureusement, puisque nous n'avons pas tous la bonne fortune d'être dragonniers, nous ne pouvons vous accompagner à travers les cieux. Il ne me reste donc qu'à vous souhaiter bonne route… enfin, bonne… bon vent ? »"
 agot_travel_events_dragon.9000.a:0 "Quel dommage."
 agot_travel_events_dragon.9000.tt:0 "[entourage_member.GetFirstName] quitte la suite"