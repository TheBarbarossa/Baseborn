l_french:
 agot_bastard_event.reveal_tt:0 "Vous allez révéler à [reveal_scope.GetName] la vérité sur sa parenté."
 agot_bastard_event.reveal_warning:0 "@warning_icon! #warning Cela pourrait avoir des implications majeures pour vous tout autant que pour le royaume.#!"
 agot_bastard_event.reveal_warning_letter:0 "Vous allez envoyer des missives aux quatre coins de Westeros.\n@warning_icon! #warning Cela pourrait avoir des répercussions majeures sur vous tout autant que sur le royaume.#!"
 agot_bastard_event.host_response_choice:0 "Il appartiendra à [reveal_employer.GetName] de répondre à votre exigence."
 agot_bastard_event.personal_response_choice:0 "Il appartiendra à [reveal_scope.GetName] de répondre à votre exigence."
 agot_bastard_event.demand_reject_harsh:0 "C'est un outrage ! Cela signifie la guerre !"
 agot_bastard_event.demand_reject_light:0 "C'est le châtiment pour être né. Je ne le supporterai pas."
 agot_bastard_event.demand_reject_flavor:0 "Vous allez rejeter l'exigence [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]."
 agot_bastard_event.demand_reject_tt:0 "@warning_icon! #warning Cela signifiera la guerre contre le Trône de fer, et il n'y aura alors plus aucun demi-tour possible.#!"
 agot_bastard_event.demand_accept_harsh:0 "Bien que cela me soit douloureux, je vais accepter pour maintenir la paix."
 agot_bastard_event.demand_accept_light:0 "Je vais accepter la pitié de [ruler_scope.GetName]."
 agot_bastard_event.demand_accept_flavor:0 "Je vais accepter l'exigence de [ruler_scope.GetName]."
 agot_bastard_event.unjust_warning_tt:0 "Le royaume pourrait ne pas apprécier les exigences jugées injustes."
 agot_bastard_event.no_demand_acknowledge:0 "Quel soulagement."
 agot_bastard_event.0901.t:0 "Réflexions sur la parenté"
 agot_bastard_event.0901.desc:0 "Chaque fois que mon regard se porte sur [reveal_scope.GetFirstName], je ne peux m'empêcher de songer à la vérité qui coule dans ses veines, ainsi qu'au danger que cela représente. Même si je lui souhaite une vie longue et heureuse, je ne peux oublier le fait que sa vie repose sur un mensonge. Cela ne serait pas juste qu'[reveal_scope.Custom('FR_IlElle')] vive et meurt sans jamais connaître la vérité sur son sang royal. Je ne veux plus prendre part à cette duperie une journée de plus."
 agot_bastard_event.0901.desc.jon:0 "Chaque fois que mon regard se porte sur [reveal_scope.GetFirstName], je ne cesse de revoir la promesse faite et le danger qui rôde, mais surtout, je vois un[reveal_scope.Custom('FR_E')] enfant dont toute la vie repose sur un mensonge. « Promets le moi Ned… »\n\nNon. Ce n'est pas juste qu'[reveal_scope.Custom('FR_IlElle')] vive et meurt sans connaître la vérité. J'aimais ma sœur, et j'aime son enfant comme si [reveal_scope.Custom('FR_IlElle')] était mie[reveal_scope.Custom('FR_NNne')]. Lyanna n'aurait pas voulu que son enfant grandisse dans le mensonge. Même si cela me sera douloureux, à moi et peut-être plus encore au royaume, je refuse de prendre part à cette duperie une journée de plus."
 agot_bastard_event.0901.a:0 "[reveal_scope.GetFirstNameNoTooltip], tu dois savoir. Tes vrais parents sont en réalité..."
 agot_bastard_event.0901.a.jon:0 "[reveal_scope.GetFirstNameNoTooltip], il est temps de connaître la vérité. Je ne suis pas ton père..."
 agot_bastard_event.0901.b:0 "Non, le moment n’est pas encore venu pour cela."
 agot_bastard_event.0902.t:0 "Une terrible vérité"
 agot_bastard_event.0902.desc.jon:0 "Père m'a demandé de l'accompagner pour une promenade dans les bois. Après un petit moment, nous descendons de cheval et il me fait signe de m'asseoir. Je ne l'avais jamais vu afficher une telle anxiété. Je remarque même qu'il a du mal à me regarder dans les yeux.\n\nSon histoire commence par le tournoi d'Harrenhal, puis il mentionne ma tante, pour en venir à la rébellion de Robert. D'abord, j'en viens à me demander pourquoi me raconter une histoire que je connais depuis si longtemps, mais à mesure qu'elle se poursuit, j'en découvre un peu plus. Beaucoup plus.\n\n« Je ne saurais comment le dire, mais je le dois. [ROOT.Char.GetFirstNameNoTooltip], je t'ai menti. Je ne suis pas ton père. Ton véritable père était [real_father.GetName], et tu es né[reveal_scope.Custom('FR_E')] parmi les roses d'hiver sur le lit de mort de ma sœur, Lyanna. J'avais juré de garder intact ce secret, mais je n'ai pas pu me résoudre à entretenir davantage ce mensonge. Je crains de n'avoir échangé un fardeau contre un bien plus pesant encore, mais désormais tu seras libre de choisir quoi faire de cette vérité. »\n\nJ'aurais voulu rejeter cette vérité, j'aurais voulu hurler que c'était cela le mensonge, mais au fond, je savais qu'il ne pouvait en être autrement. Il me fallait maintenant décider quoi faire."
 agot_bastard_event.0902.desc.father:0 "Père m'a demandé de l'accompagner pour une promenade dans les bois. \"Nul ne doit entendre ce que j'ai à te dire\" me dit-il sèchement. Après un petit moment, nous descendons de cheval et il me fait signe de m'asseoir. Je ne l'avais jamais vu afficher une telle anxiété. Je remarque même qu'il a du mal à me regarder dans les yeux.\n\n« Je ne saurais comment le dire, mais je le dois. [ROOT.Char.GetFirstNameNoTooltip], tes vrais parents sont [real_mother.GetName] et [real_father.GetName]. J'avais juré de garder intact ce secret, mais je n'ai pas pu me résoudre à entretenir davantage ce mensonge. Je crains de n'avoir échangé un fardeau contre un bien plus pesant encore, mais désormais tu seras libre de choisir quoi faire de cette vérité. »\n\nLes mots se turent, laissant le vent faire frémir les feuilles. J'aurais voulu rejeter cette vérité, hurler au vent que c'était cela le mensonge, mais au fond, je savais qu'il ne pouvait en être autrement. La seule question désormais, était de savoir ce que j'allais faire de cette vérité."
 agot_bastard_event.0902.desc.mother:0 "Mère m'a demandé de la rejoindre dans le salon. Elle me prends alors les mains tout en chassant les domestiques. Je ne l'avais jamais vu afficher une telle anxiété. Je remarque même qu'elle a du mal à me regarder dans les yeux.\n\n« Il n'y a pas de façon simple de le dire, alors je vais juste le dire. [ROOT.Char.GetFirstNameNoTooltip]. Tes vrais parents sont [real_mother.GetName] et [real_father.GetName]. J'avais juré de garder le secret, mais je n'ai pas pu m'y résoudre. Je crains de n'avoir échangé un fardeau contre un bien plus pesant encore, mais désormais tu seras libre de choisir quoi faire de cette vérité. »\n\nJ'aurais voulu rejeter cette vérité, j'aurais voulu hurler que c'était cela le mensonge, mais au fond, je savais qu'il ne pouvait en être autrement. Il me faudrait tôt ou tard prendre une décision à propos de tout ça."
 agot_bastard_event.0902.a:0 "Je ne vais rien cacher. Tous sauront !"
 agot_bastard_event.0902.b:0 "J'ai besoin de temps pour réfléchir."
 agot_bastard_event.0902.b.flavor:0 "Vous pourrez révéler vous-même la vérité ultérieurement si vous le désirez."
 agot_bastard_event.0903.t:0 "Réflexions sur la parenté"
 agot_bastard_event.0903.desc:0 "Chaque fois que je pense à [reveal_scope.GetFirstName], je ne peux m'empêcher de songer à la vérité qui coule dans ses veines, ainsi qu'au danger que cela représente. Même si je lui souhaite une vie longue et heureuse, je ne peux oublier le fait que sa vie repose sur un mensonge. Cela ne serait pas juste qu'[reveal_scope.Custom('FR_IlElle')] vive et meurt sans jamais connaître la vérité sur son sang royal. Je ne veux plus prendre part à cette duperie une journée de plus."
 agot_bastard_event.0903.desc.jon:0 "Je me souviens des promesses faites à Lady Lyanna et des serments prêtés aux Stark avant même que la rébellion n'éclate. Peut-être n'est-ce pas à moi de prendre une telle décision, mais je ne peux m'empêcher de penser à l'enfant dont la vie repose sur un mensonge.\n\nNon. Ce n'est pas juste que [reveal_scope.GetFirstName] vive et meurt sans jamais connaître la vérité. Même si tous n'approuveraient pas mon choix, je dois faire savoir la vérité. Même si cela me sera douloureux, et plus encore pour le royaume, je ne veux plus participer à cette duperie."
 agot_bastard_event.0903.a:0 "Je vais envoyer directement un corbeau à [reveal_scope.GetFirstNameNoTooltip]."
 agot_bastard_event.0903.b:0 "Le royaume tout entier doit connaître la vérité !"
 agot_bastard_event.0903.c:0 "Non. Mieux vaut continuer de taire la vérité pour le moment."
 agot_bastard_event.0904.t:0 "Une terrible vérité"
 agot_bastard_event.0904.desc:0 "J'ouvre la lettre marquée du sceau de la Maison [sharer.GetHouse.GetBaseName] et promptement je commence la lecture, tandis que mes yeux s'écarquillent à mesure que les mots s'enchaînent.\n\nAprès les formalités d'usage [sharer.GetName] en vient à la raison du pourquoi de cette lettre. « Il n'est pas facile pour moi de dire cela. [ROOT.Char.GetFirstName]. On vous a menti. Vos vrais parents sont [real_mother.GetName] et [real_father.GetName]. J'avais juré de protéger ce secret, mais je ne peux plus me résoudre à continuer. Je crains de n'avoir échangé un fardeau contre un bien plus pesant encore, mais désormais vous êtes libre de choisir quoi faire de cette vérité. »\n\nLa lettre glisse de mes mots. J'aurais voulu rejeter cette vérité, crier à moi-même que ce n'était rien d'autre qu'un mensonge, mais au fond de moi, je savais qu'il ne pouvait en être autrement. Tout ce qui importe désormais c'est quoi faire de cette vérité."
 agot_bastard_event.0904.desc.blind:0 "Je demande à [courtier.GetFirstName] de me lire la lettre marquée du sceau de la Maison [sharer.GetHouse.GetBaseName]. Si mes yeux sont incapable de lire, je sais que [courtier.GetFirstNameNoTooltip] n'aurait aucun mal à lire l'étonnement dans mes yeux alors qu'[courtier.Custom('FR_IlElle')] était déjà en pleine lecture de la lettre.\n\n« Il n'est pas facile pour moi de dire cela. [ROOT.Char.GetFirstNameNoTooltip]. On vous a menti. Vos vrais parents sont [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. J'avais juré de protéger ce secret, mais je ne peux plus me résoudre à continuer. Je crains de n'avoir échangé un fardeau contre un bien plus pesant encore, mais désormais vous êtes libre de choisir quoi faire de cette vérité. »\n\nAlors que [courtier.GetFirstNameNoTooltip] se confonds dans des formules de soutien à mon égard, mon esprit s'égare. J'aurais voulu rejeter cette vérité, mais elle se tient là, devant moi. Mon cœur le sait, et mes yeux la voit. La seule chose qui importe désormais c'est de savoir quoi faire d'elle."
 agot_bastard_event.0904.a:0 "Je ne vais rien cacher. Tous sauront !"
 agot_bastard_event.0904.b:0 "Je dois le dire à père ! Ou plutôt à... [father.GetFirstNameNoTooltip], devrais-je dire."
 agot_bastard_event.0904.b.flavor:0 "Vous allez décider quoi faire, ensemble."
 agot_bastard_event.0904.c:0 "J'ai besoin de temps pour réfléchir."
 agot_bastard_event.0904.c.flavor:0 "Vous pourrez révéler vous-même la vérité ultérieurement si vous le désirez."
 agot_bastard_event.0904.d:0 "Je ne dirais rien de tout cela, mais je dois en informer [sharer.GetFirstNameNoTooltip]."
 agot_bastard_event.0904.d.flavor:0 "Vous allez répondre en demandant à [sharer.GetFirstName] de garder votre secret."
 agot_bastard_event.0905.t:0 "Un secret pas si secret ?"
 agot_bastard_event.0905.desc:0 "Je m'étais préparé pour l'une des conversations les plus difficiles de toute ma vie. J'avais répété, encore et encore, j'avais préparé jusqu'au regard même qu'il me fallait prendre. J'avais choisis un lieu tranquille, où nous pourrions discuter sans risquer d'être entendu.\n\nJ'en vins à commencer mon histoire, mais c'est alors que [reveal_scope.GetFirstName] leva la main pour m'arrêter. \"[ROOT.Char.GetFirstName]\" me dit-[reveal_scope.Custom('FR_IlElle')], s'adressant à moi en m'appelant par mon prénom. \"Je suis déjà au courant. Depuis un moment déjà. Je n'ai rien révélé, mais... je sais.\" [reveal_scope.Custom('FR_IlElle')] laisse échapper un soupir.\n\nJe suis rongé par ce secret depuis si longtemps, et [reveal_scope.Custom('FR_IlElle')] était déjà au courant ?"
 agot_bastard_event.0905.desc.actually_parent:0 "Je m'étais préparé pour l'une des conversations les plus difficiles de toute ma vie. J'avais répété, encore et encore, j'avais préparé jusqu'au regard même qu'il me fallait prendre. J'avais choisis un lieu tranquille, où nous pourrions discuter sans risquer d'être entendu.\n\nJ'en vins à commencer mon histoire, mais c'est alors que [reveal_scope.GetFirstName] leva la main pour m'arrêter. \"Merci\" commença-t-[reveal_scope.Custom('FR_IlElle')] \"Merci, mais je suis déjà au courant depuis un moment. Je n'ai rien révélé, mais... je sais.\" [reveal_scope.Custom('FR_IlElle')|L] laisse échapper un soupir.\n\nJe suis rongé par ce secret depuis si longtemps, et [reveal_scope.Custom('FR_IlElle')] était déjà au courant ?"
 agot_bastard_event.0905.a:0 "Je vais vous offrir des terres afin que vous puissiez régner en mon nom et comme mon enfant."
 agot_bastard_event.0905.a.flavor:0 "[reveal_scope.GetFirstName] pourrait décider de révéler la vérité ultérieurement..."
 agot_bastard_event.0905.b:0 "Le royaume saura la vérité !"
 agot_bastard_event.0905.c:0 "Alors vous savez que la Garde de Nuit est le seul lieu sûr pour vous."
 agot_bastard_event.0905.d:0 "Vous en savez assez, c'est à vous de décider quoi faire."
 agot_bastard_event.0906.t:0 "Un héritage secret"
 agot_bastard_event.0906.a:0 "Je vais te donner des terres que tu dirigeras en mon nom, comme mon propre enfant."
 agot_bastard_event.0906.a.flavor:0 "[reveal_scope.GetFirstName] pourrait décider de révéler la vérité ultérieurement..."
 agot_bastard_event.0906.b:0 "Nous #bold devons#! le dire au royaume !"
 agot_bastard_event.0906.c:0 "Tu dois savoir que la Garde de Nuit est le seul lieu sûr pour vous."
 agot_bastard_event.0906.d:0 "Vous en savez assez, c'est à vous de décider quoi faire."
 agot_bastard_event.0907.t:0 "Mon secret est connu"
 agot_bastard_event.0907.desc:0 "J'ouvre la lettre marquée du sceau de la Maison [sharer.GetHouse.GetBaseName] et promptement je commence la lecture, tandis que mes yeux s'écarquillent à mesure que les mots s'enchaînent.\n\nAprès les formalités d'usage, [sharer.GetName] en vient à la raison du pourquoi de cette lettre. « Il n'est pas facile pour moi de dire cela. [ROOT.Char.GetFirstName]. On vous a menti. Vos vrais parents sont [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. J'avais juré de protéger ce secret, mais je ne peux plus me résoudre à continuer. » La suite contient excuses et conseils, mais je ne prends même pas la peine d'en atteindre le bout. Je lâche un soupir. Quelqu'un d'autre sait.\n\nJe me hâte de détruire la lettre, et tandis que les braises crépitent sous mes yeux, je réfléchis à la meilleure chose à faire. Comment dois-je composer avec le fait que quelqu'un d'autre connait mon secret ?"
 agot_bastard_event.0907.desc.blind:0 "Je demande à [courtier.GetFirstName] de me lire la lettre marquée du sceau de la maison [sharer.GetHouse.GetBaseName]. Si mes yeux sont incapable de lire, je sais que [courtier.GetFirstNameNoTooltip] n'aurait aucun mal à lire l'étonnement dans mes yeux alors qu'[courtier.Custom('FR_IlElle')] était déjà en pleine lecture.\n\n« Il n'est pas facile pour moi de dire cela. [ROOT.Char.GetFirstNameNoTooltip], on vous a menti. Vos vrais parents sont [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. J'avais juré de protéger ce secret, mais… » J'interromps subitement [courtier.GetFirstNameNoTooltip]. Nul besoin de continuer.\n\nA ma réaction, [courtier.Custom('FR_IlElle')] comprend que j'étais déjà au courant. Il semblerait que non pas une, mais deux autres personnes le savent désormais. Je dois décider quoi faire."
 agot_bastard_event.0907.a:0 "La situation devient hors de contrôle. Si le monde doit savoir, autant que ce soit moi qui le lui apprends."
 agot_bastard_event.0907.b:0 "Au vu de l'évolution de la situation, je dois m'entretenir avec [father.GetFirstNameNoTooltip]."
 agot_bastard_event.0907.b.flavor:0 "Vous allez décider quoi faire, ensemble."
 agot_bastard_event.0907.c:0 "J'ai besoin de temps pour réfléchir."
 agot_bastard_event.0907.c.flavor:0 "Vous pourriez choisir de révéler la vérité ultérieurement, mais [sharer.GetName] pourrait choisir de prendre les choses en main de son côté."
 agot_bastard_event.0907.d:0 "Je vais envoyer un message à [sharer.GetFirstNameNoTooltip] pour lui demander de garder mon secret."
 agot_bastard_event.0908.t:0 "Discrétion requise"
 agot_bastard_event.0908.desc:0 "Chaque jour qui passe j'attends la réponse de [reveal_scope.GetFirstName]. Chaque jour je demande si une lettre est arrivée, et chaque jour la réponse reste inchangée.\n\nFinalement, après tant de jours que j'ai cessé de les compter, un page m'annonce l'arrivée d'une lettre. Mais pas celle que j'aurais espéré.\n« [Select_CString(ROOT.Char.IsFemale,'Chère','Cher')] [ROOT.Char.GetFullName],\nJe vous remercie pour la lettre à propos de ce que vous savez, » [reveal_scope.GetFirstName] reste volontairement vague, une précaution au cas où la lettre serait tombé entre de mauvaises mains. « Bien que j'apprécie votre honnêteté, je dois vous demander humblement de garder tout ceci pour vous. C'est à moi, et moi seul, de décider de faire connaître ou non ces faits, et je vous demanderai de respecter ma vie privée. Cordialement. »\n\n[reveal_scope.GetName] semble avoir fait son choix, du moins pour le moment. Maintenant, c'est à moi de faire le mien."
 agot_bastard_event.0908.a:0 "Non, le royaume #bold doit#! le savoir !"
 agot_bastard_event.0908.b:0 "Je vais respecter sa demande."
 agot_bastard_event.0909.t:0 "Révélations sans réponse"
 agot_bastard_event.0909.desc:0 "Chaque jour qui passe j'attends la réponse de [reveal_scope.GetFirstName]. Chaque jour je demande si une lettre est arrivée, et chaque jour la réponse reste inchangée.\n\nFinalement, après tant de jours que j'ai cessé de les compter et une seconde lettre envoyée pour m'assurer qu'il n'y ait aucun doute, je dois me rendre à l'évidence. [reveal_scope.GetFirstNameNoTooltip] n'a pas daigné me répondre. Qu'il s'agisse d'une démarche visant à préparer un complot, ou simplement de la peur, je dois décider quoi faire de mon côté."
 agot_bastard_event.0909.a:0 "Le royaume #bold doit#! en être informé !"
 agot_bastard_event.0909.b:0 "C'est son choix après tout. Il ne m'appartient pas de m'en mêler davantage."
 agot_bastard_event.0910.t:0 "Discussions sur la parenté"
 agot_bastard_event.0910.desc:0 "« Père… [ROOT.Char.GetFirstName] » [reveal_scope.GetFirstName] s'arrête un instant, puis reprends. « [sharer.Custom('FR_le_Char_P')|U][sharer.GetFullName] m'a envoyé une lettre disant que je serais l'enfant de [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. J'ai besoin de vos conseils. Que dois-je faire ? » [reveal_scope.Custom('FR_IlElle')|U] semble totalement perdu[reveal_scope.Custom('FR_E')].\n\nUn secret qui m'a rongé de l'intérieur depuis si longtemps… et voilà que [sharer.GetFirstNameNoTooltip] dévoile tout, juste comme ça ? Désormais nous devons nous préparer aux conséquences qu'il pourrait y avoir."
 agot_bastard_event.0910.a:0 "Vous devez lui envoyer une lettre demandant à ce qu'[sharer.Custom('FR_IlElle')] garde le silence."
 agot_bastard_event.0910.a.flavor:0 "Vous allez aider [reveal_scope.GetFirstNameNoTooltip] en envoyant une réponse à [sharer.GetFirstNameNoTooltip] pour lui demander de ne rien ébruiter."
 agot_bastard_event.0910.b:0 "Le temps est venu de le dire au royaume."
 agot_bastard_event.0910.c:0 "La Garde de Nuit est le seul lieu sûr pour toi désormais."
 agot_bastard_event.0911.t:0 "Mensonges dans le mariage"
 agot_bastard_event.0911.desc:0 "Je redoutais ce moment depuis le jour où j'avais fais cette promesse à Lyanna. « Menteur ! » c'est ainsi que ma bien-aimée Cat m'appelle, et je ne peux faire autrement que de baisser la tête tant la honte est pesante. « Voilà donc l'honneur de Lord Eddard Stark ! » Une voix submergée par la colère. « Honorable envers tout le monde, excepté sa propre femme semble-t-il ! Je suis supposée être ta confidente Ned ! » La colère est teinté de tristesse. « Non… » La tristesse laisse place à l'euphorie. « Tu es plus honorable dans tes vœux envers moi que le monde ne le pensait apparemment. » Elle n'ajoute rien de plus. Son excès d'émotion, que je comprends parfaitement, semble s'être calmé. Mais je ne trouve rien à répondre à tout ceci.\n\nElle me regarde, les larmes aux yeux. « Famille, Devoir, Honneur ».  Sa façon de le dire, on dirait presque une incantation. « Je sais pourquoi tu as fait ça Ned. Une partie de moi est soulagée. Mais bon sang, je suis ta famille moi aussi ! Tu aurais dû être honnête avec moi. Ce n'était pas juste. Ce que le monde pensait de nous, de toi. Ce que je pensais de… » A son tour elle sent le poids de la honte. Puis elle termine… « Ce n'était pas juste. »"
 agot_bastard_event.0911.a:0 "« Je suis désolé Cat... »"
 agot_bastard_event.0912.t:0 "Discussions sur la parenté"
 agot_bastard_event.0912.desc:0 "Chaque fois que mon regard se porte sur [reveal_scope.GetFirstName], je songe à la vérité qui coule dans ses veines, ainsi qu'au danger que cela représente. Il est possible qu'[reveal_scope.Custom('FR_IlElle')] jouisse d'une vie longue et heureuse sans jamais savoir que sa vie repose sur un mensonge. Mais serait-ce juste qu'[reveal_scope.Custom('FR_IlElle')] vive et meurt sans jamais rien savoir de la vérité sur son sang royal ? Peut-être devrais-je le lui dire. Je pourrais même en tirer avantage..."
 agot_bastard_event.0912.a:0 "[reveal_scope.GetFirstNameNoTooltip], tes vrais parents sont…"
 agot_bastard_event.0912.b:0 "Non. L'heure n'est pas encore venu."
 agot_bastard_event.0913.t:0 "Une vérité choquante"
 agot_bastard_event.0913.desc:0 "[employer.GetFullName] m'a demandé de [employer.Custom('FR_LeLa')] rejoindre dans son bureau dans la nuit. Même si nous avons déjà eu plusieurs occasions de converser tous les deux, je ne peux cacher ma nervosité lorsque j'ouvre la porte. [employer.Custom('FR_IlElle')|L] semble particulièrement gêné[employer.Custom('FR_E')] tandis que j'entre dans la pièce. Rien ne m'avait préparé à ce que j'allais entendre par la suite.\n\n\"[ROOT.Char.GetFirstName], il est temps pour vous de connaître la vérité. Vos vrais parents sont [real_mother.GetName] et [real_father.GetName]. Cela vous a été caché depuis trop longtemps.\"\n\nJ'aurais voulu rejeter cette vérité, j'aurais voulu crier que rien de tout ceci n'était vrai. Mais au fond, je savais ce qu'il en était. Maintenant la vraie question était de savoir ce que j'allais décider de faire."
 agot_bastard_event.0913.a:0 "Je ne vais rien cacher. Tous sauront !"
 agot_bastard_event.0913.b:0 "J'ai besoin de temps pour réfléchir."
 agot_bastard_event.0913.b.flavor:0 "Vous pourrez révéler vous-même la vérité ultérieurement si vous le désirez."
 agot_bastard_event.0914.t:0 "Une vérité...connu ?"
 agot_bastard_event.0914.desc:0 "J'ai invité[ROOT.Char.Custom('FR_E')] [reveal_scope.GetFirstName] à me rejoindre dans mon bureau dans la nuit. Nous avons déjà eu quelques occasions de converser auparavant, mais jamais nous n'avons eu une conversation de cette nature, et c'est pourquoi une certaine appréhension s'est emparé de moi. J'ouvre la porte et l'invite à rentrer.\n\nJ'ai pris les dispositions nécessaires afin que nous ne soyons ni entendu, ni interrompu, mais alors même que je m'étais lancé dans mon histoire, [reveal_scope.GetFirstNameNoTooltip] lève une main pour me faire comprendre que ce n'était pas nécessaire. Subitement, [reveal_scope.Custom('FR_IlElle')] s'adresse à moi en m'appelant par mon prénom « [ROOT.Char.GetFirstName], je sais déjà tout. Je le sais depuis quelques temps. Je n'en ai rien dis, mais je sais. » [reveal_scope.Custom('FR_IlElle')|U] lâche un soupir."
 agot_bastard_event.0914.a:0 "Quoi qu'il en soit, je vais vous offrir des terres, en l'honneur de notre parenté."
 agot_bastard_event.0914.a.flavor:0 "[reveal_scope.GetFirstName] pourrait décider de révéler la vérité ultérieurement..."
 agot_bastard_event.0914.b:0 "Le royaume doit savoir la vérité !"
 agot_bastard_event.0914.c:0 "Alors vous savez que la Garde de Nuit est le seul lieu sûr pour vous."
 agot_bastard_event.0914.d:0 "Vous en savez assez, c'est à vous de décider quoi faire."
 agot_bastard_event.0915.t:0 "Une vérité révélée"
 agot_bastard_event.0915.desc:0 "[reveal_scope.Custom('FR_le_Char_Pi')|U][reveal_scope.GetName] garde le silence depuis un long moment. Confusion, bonheur, peur, les émotions ne cessent de danser sur son visage. « Alors… » [reveal_scope.Custom('FR_IlElle')] expire, mais ne cesse d'avoir les yeux rivés au sol.\n\nLonguement, je tente de décrypter son visage, au point que j'aurais juré qu'une journée entière s'était écoulé. Puis finalement [reveal_scope.Custom('FR_IlElle')] lève la tête pour me regarder. « Cela va tout changer, n'est-ce pas ? »\n\nIl y a tant à faire. [reveal_scope.GetFirstNameNoTooltip] a prit sa décision. Le royaume doit savoir, et nous allons devoir faire face aux conséquences."
 agot_bastard_event.0916.t:0 "Une requête des moindres"
 agot_bastard_event.0916.desc:0 "[reveal_scope.Custom('FR_le_Char_Pi')|U][reveal_scope.GetName] garde le silence depuis un long moment. Confusion, bonheur, peur, les émotions ne cessent de danser sur son visage. « Alors... » [reveal_scope.Custom('FR_IlElle')] expire, mais ne cesse d'avoir les yeux rivés au sol.\n\nLonguement, je tente de décrypter son visage, au point que j'aurais juré qu'une journée entière s'était écoulé. Puis finalement [reveal_scope.Custom('FR_IlElle')] lève la tête pour me regarder. « Cela ne change rien. Je suis [reveal_scope.Custom('FR_le_Char_Pi')][reveal_scope.GetNameNoTooltip] tout simplement, et ce peu importe ma naissance. »\n\nJe scrute son visage et remarque qu'il en émane une détermination. Fascinant. Néanmoins, je reste son hôte et je connais son secret. Si je le souhaite, je peux choisir la réponse a donner."
 agot_bastard_event.0916.a:0 "Quoi qu'il en soit, je vais vous offrir des terres, en l'honneur de notre parenté."
 agot_bastard_event.0916.a.flavor:0 "[reveal_scope.GetFirstName] pourrait décider de révéler la vérité ultérieurement..."
 agot_bastard_event.0916.b:0 "Le royaume doit savoir la vérité !"
 agot_bastard_event.0916.c:0 "La Garde de Nuit est le seul lieu sûr désormais. Vous partirez dès demain."
 agot_bastard_event.0916.d:0 "Vous en savez assez, c'est à vous de décider quoi faire."
 agot_bastard_event.0917.t:0 "Réflexions sur la parenté"
 agot_bastard_event.0917.desc:0 "En toute honnêteté, je ne pense que rarement à la lignée de [reveal_scope.GetFirstName]. Mais maintenant que nous sommes tous deux ici, à [ROOT.Char.GetCurrentLocation.GetCounty.GetName], et que je [reveal_scope.Custom('FR_LeLa')] regarde en personne, c'est bien la seule chose qui accapare mon esprit.\n\n[reveal_scope.Custom('FR_IlElle')|U] lui ressemble c'est vrai. Est-ce juste qu'[reveal_scope.Custom('FR_IlElle')] vive et meurt sans jamais connaître la vérité à propos de son sang royal ? Peut-être devrais-je lui dire la vérité. De plus, il y a peut-être une occasion d'en tirer avantage..."
 agot_bastard_event.0917.a:0 "[reveal_scope.GetFirstName], je dois vous parler."
 agot_bastard_event.0917.a_tt:0 "Vous allez dire à [reveal_scope.GetName] la vérité à propos de son héritage. En tant qu'invité, vous ne pourrez pas l'influencer sur la manière d'utiliser ces informations."
 agot_bastard_event.0917.b:0 "Non. L'heure n'est pas encore venu."
 agot_bastard_event.0918.t:0 "Une vérité choquante"
 agot_bastard_event.0918.desc:0 "En visite à [ROOT.Char.GetCurrentLocation.GetCounty.GetName], [sharer.GetFullName] me demande discrètement de [sharer.Custom('FR_LeLa')] rejoindre pour une promenade le soir venu. N'ayant aucune raison de décliner j'accepte sa proposition.\n\nAlors que je [sharer.Custom('FR_LeLa')] regarde s'approcher, je constate qu'[sharer.Custom('FR_IlElle')] manifeste de la nervosité. Dans un premier temps, notre conversation semble n'avoir aucun but en particulier, mais tandis que nous continuons notre marche et qu'il n'y a plus que le son de notre voix qui est perceptible, la conversation prend une toute autre tournure.\n\n« [ROOT.Char.GetFirstName], il est temps de connaître la vérité. Vos véritables parents sont [real_mother.GetName] et [real_father.GetName]. Je ne saurais dire combien d'autres personnes sont au courant, mais lorsque je vous ai vu, j'ai su que je devais vous le dire. »\n\nJ'aurais voulu rejeter cette vérité, j'aurais voulu hurler que c'était cela le mensonge, mais au fond, je savais qu'il ne pouvait en être autrement. Il me faudrait tôt ou tard prendre une décision à propos de tout ça."
 agot_bastard_event.0918.a:0 "Je ne vais rien cacher. Tous sauront !"
 agot_bastard_event.0918.b:0 "J'ai besoin de temps pour réfléchir."
 agot_bastard_event.0918.b.flavor:0 "Vous pourrez révéler vous-même la vérité ultérieurement si vous le désirez."
 agot_bastard_event.0919.t:0 "Une vérité...connu ?"
 agot_bastard_event.0919.desc:0 "J'invite [reveal_scope.GetFirstName] à me rejoindre pour une promenade plus tard dans la soirée. J'appréhende ce qu'il va se passer, car ce sera, sans aucun doute, un grand choc pour [reveal_scope.Custom('FR_LuiElle')].\n\nJetant un coup d'œil aux alentours, je voulais m'assurer que tout ceci resterait entre nous, mais alors que je commença mon récit, [reveal_scope.Custom('FR_IlElle')] se mit à lever une main pour me couper dans mon élan. « [ROOT.Char.GetFirstName], je sais déjà tout. Je le sais depuis longtemps. Je n'en avais rien dis jusque là mais... je sais. » Un soupir se fit entendre. « Je vous demanderais de bien vouloir garder tout ceci pour vous. »"
 agot_bastard_event.0919.a:0 "Impossible. Le royaume doit savoir la vérité."
 agot_bastard_event.0919.a.flavor:0 "Vous vous esquivez afin d'envoyer des missives à toutes les Cours de Westeros.\n@warning_icon!#warning Cela pourrait avoir des répercussions majeures sur vous tout autant que sur le royaume.#!."
 agot_bastard_event.0919.b:0 "Vous en savez assez, c'est à vous de décider quoi faire."
 agot_bastard_event.0920.t:0 "Une vérité choquante"
 agot_bastard_event.0920.desc:0 "Mon travail s'est prolongé plus tard qu'à l'accoutumée lorsque j'entends un bref coup à la porte de mon bureau. Je me contente d'un bref « Entrez », pensant voir les domestiques, mais au lieu de cela c'est [learned_person.GetFirstName] qui franchit la porte. [learned_person.Custom('FR_IlElle')] commence par s'excuser de me déranger de la sorte, puis poursuit. « Je voulais vous voir à une heure où nous ne serions pas dérangés. » J'aurais eu beaucoup de mal à ne pas remarquer la nervosité dans sa posture et son langage. Je pose alors ma plume pour lui accorder toute mon attention.\n\nSon récit est précédé d'un soupir. « J'ai mené[learned_person.Custom('FR_E')] maintes recherches, et fais tout autant de découvertes. Celles-ci ont des implications assez… drastiques vous concernant. Vous, ainsi que le royaume. » [learned_person.Custom('FR_IlElle')|L] continue ainsi, et moi je me retrouve ici, assaillis de mots et incapable de réagir. Peu importe ce qui m'avait contraint à veiller tard cette nuit, je l'avais déjà oublié. Tout ce qui accaparait mon attention était l'existence de documents qui révélaient que mes véritables parents étaient en fait [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName].\n\nJe ne voulais y croire, je ne pouvais y croire, mais lorsque [learned_person.GetFirstNameNoTooltip] exposa ces documents devant moi, je ne pouvais faire autrement que d'y croire."
 agot_bastard_event.0920.a:0 "Si telle est la vérité, alors le royaume doit le savoir."
 agot_bastard_event.0920.b:0 "Je n'en veux pas. Cette vérité doit rester secrète."
 agot_bastard_event.0951.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0951.first_person:0 "Je m'adresse à tous les seigneurs de Westeros pour leur faire savoir la vérité qui est resté enfoui depuis trop longtemps. Malgré ce que vous avez pu penser, il s'avère que je suis né[ROOT.Char.Custom('FR_E')] de l'union entre [real_mother.GetName] et [real_father.GetName]. Je vous demande à vous, ainsi qu'au reste du royaume, d'accepter cette nouvelle réalité ainsi que tout ce que cela implique."
 agot_bastard_event.0951.third_person:0 "Je m'adresse à tous les seigneurs de Westeros pour leur faire savoir la vérité qui est resté enfoui depuis trop longtemps. Malgré ce que vous avez pu penser, [reveal_scope.GetName] est né[reveal_scope.Custom('FR_E')] de l'union entre [real_mother.GetName] et [real_father.GetName]. Je vous demande à vous, ainsi qu'au reste du royaume, d'accepter cette nouvelle réalité ainsi que tout ce que cela implique."
 agot_bastard_event.0951.a:0 "Ma foi, c'est certainement intéressant."
 agot_bastard_event.0951.b:0 "Je n'arrive pas à y croire."
 agot_bastard_event.0952.t:0 "Une vérité révélée"
 agot_bastard_event.0952.desc:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName] garde le silence depuis un long moment. Confusion, bonheur, peur, les émotions ne cessent de danser sur son visage. « Alors… » [reveal_scope.Custom('FR_IlElle')] expire, mais ne cesse d'avoir les yeux rivés au sol.\n\nLonguement, je tente de décrypter son visage, au point que j'aurais juré qu'une journée entière s'était écoulé. Puis finalement [reveal_scope.Custom('FR_IlElle')] lève la tête pour me regarder. « Cela va tout changer, n'est-ce pas ? »\n\nLe temps des larmes et des embrassades était terminé. [reveal_scope.GetFirstNameNoTooltip] avait prit sa décision. Et cette décision fut que le royaume entier devait le savoir."
 agot_bastard_event.0952.desc.jon:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName] garde le silence depuis un long moment. Confusion, bonheur, peur, les émotions ne cessent de danser sur son visage. « Lyanna...» [reveal_scope.Custom('FR_IlElle')] expire, mais ne cesse d'avoir les yeux rivés au sol.\n\nLonguement, je tente de décrypter son visage, au point que j'aurais juré qu'une journée entière s'était écoulé. Puis finalement [reveal_scope.Custom('FR_IlElle')] lève la tête pour me regarder. « Cela va tout changer, n'est-ce pas ? »\n\nLe temps des larmes et des embrassades était terminé. [reveal_scope.GetFirstNameNoTooltip] avait prit sa décision. Et cette décision fut que le royaume entier devait le savoir."
 agot_bastard_event.0953.t:0 "Une vérité révélée"
 agot_bastard_event.0953.desc:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName] resta bouche cousue pendant un long moment après m'avoir remis la lettre de [sharer.GetFullName]. Une lettre sur laquelle figurait la vérité. [reveal_scope.GetFirstNameNoTooltip] est l'enfant [real_mother.Custom('FR_du_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. Un secret que j'avais gardé enfoui depuis si longtemps, et que je n'ai jamais pu me résoudre à révéler.\n\nLe temps des larmes et des embrassades était terminé. [reveal_scope.GetFirstNameNoTooltip] avait prit sa décision. Et cette décision fut que le royaume entier devait le savoir."
 agot_bastard_event.0954.t:0 "Une vérité révélée"
 agot_bastard_event.0954.desc:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName] resta bouche cousue pendant un long moment après m'avoir remis la lettre de [sharer.GetFullName]. Une lettre sur laquelle figurait la vérité. [reveal_scope.GetFirstNameNoTooltip] est l'enfant [real_mother.Custom('FR_du_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName]. Le pire étant que, des copies de cette lettre avaient été envoyé à tout le royaume.\n\nUn secret que j'avais gardé enfoui depuis si longtemps, et que je n'ai jamais pu me résoudre à révéler.\n\nCela aurait dû être sa décision, mais ce fut celle de [sharer.GetFirstNameNoTooltip]. Et cette décision fut que le royaume entier devait le savoir."
 agot_bastard_event.0955.t:0 "Une vérité révélée"
 agot_bastard_event.0955.desc:0 "Chaque jour qui passe j'attends la réponse de [reveal_scope.GetFirstName]. Chaque jour je demande si une lettre est arrivée, et chaque jour la réponse reste inchangée.\n\nFinalement, après tant de jours que j'ai cessé de les compter, un page m'annonce l'arrivée d'une lettre.\n\nJe passe brièvement les formules d'usages. « Je vous remercie pour votre honnêteté et je vous écris à l'avance pour vous faire savoir que je vais informer le royaume entier de la vérité que vous m'avez révélé. »\n\n[reveal_scope.Custom('FR_le_Char_Pi')|U][reveal_scope.GetNameNoTooltip] a fait son choix, et me voilà enfin libéré d'un pesant fardeau."
 agot_bastard_event.0955.a:0 "Voyons comment les choses vont évoluer."
 agot_bastard_event.0956.t:0 "Une vérité révélée"
 agot_bastard_event.0956.desc:0 "Dès lors que j'ai reçu la lettre de [revealer.GetFirstName], j'ai su que ma vie en serait à jamais bouleversé. Plus aucun mot ne pouvait sortir de ma bouche. J'avais du mal à réaliser ce que j'avais sous les yeux, non, ce que le royaume entier avait sous les yeux, car des copies de cette lettre avait été envoyé aux quatre coins de Westeros. Une lettre où la vérité apparaissait noir sur blanc. Mes véritables parents étaient [real_mother.Custom('FR_le_Char')][real_mother.GetName] et [real_father.Custom('FR_le_Char')][real_father.GetName].\n\nUn secret que j'avais gardé enfoui depuis si longtemps, et que je n'ai jamais pu me résoudre à révéler.\n\nCela aurait du être ma décision, mais ce fut celle de [sharer.GetFirstNameNoTooltip]. Dans tous les cas, ce qui est fait, est fait. Désormais, le royaume le sait."
 agot_bastard_event.0956.a:0 "Voyons comment les choses vont évoluer."
 agot_bastard_event.0957.t:0 "Une vérité révélée"
 agot_bastard_event.0957.desc:0 "Mes mains tremblent, ma gorge se noue, mes yeux se voilent. Je peine à comprendre ce que j'ai devant moi. Quelqu'un se chose s'est fracturé en moi.\n\nDans cette lettre réside la vérité. Mes véritables parents sont [real_mother.GetName] et [real_father.GetName]. Et des copies de cette lettre ont étaient expédiés aux quatre coins du royaume.\n\nMa vie entière a reposé sur un mensonge. Personne ne m'en a jamais rien dit. Ce n'est pas juste."
 agot_bastard_event.0957.a:0 "Voyons comment les choses vont évoluer."
 agot_bastard_event.0958.t:0 "Une vérité révélée"
 agot_bastard_event.0958.desc.bastard:0 "Les corbeaux se sont envolés, les lettres ont été envoyés. La vérité est désormais connue.\n\nCertains me maudiront pour avoir révélé un si lourd secret, mais au moins maintenant, pour le meilleur comme pour le pire, la vérité est révélée. Peut-être aurais-je un grand rôle à jouer dans les jours à venir. Peut-être que tout ceci n'aboutira à rien finalement. Dans tous les cas, ma véritable parenté est désormais connu de tous. Que cela soit un bien ou un mal."
 agot_bastard_event.0958.desc.host:0 "Les corbeaux se sont envolés, les lettres ont été envoyés. La vérité est désormais connue.\n\nCertains me maudiront pour avoir révélé un si lourd secret, mais au moins maintenant, pour le meilleur comme pour le pire, la vérité est révélée. Peut-être aurais-je un grand rôle à jouer dans les jours à venir. Peut-être que tout ceci n'aboutira à rien finalement. Dans tous les cas, la véritable parenté de [reveal_scope.GetFirstName] est désormais connu de tous. Que cela soit un bien ou un mal."
 agot_bastard_event.0958.desc.else:0 "Les corbeaux se sont envolés, les lettres ont été envoyés. La vérité est désormais connue.\n\nCertains me maudiront pour avoir révélé un si lourd secret, mais au moins maintenant, pour le meilleur comme pour le pire, la vérité est révélée. Peut-être aurais-je un grand rôle à jouer dans les jours à venir. Ou peut-être est-ce ici que mon rôle dans cette histoire se termine. Dans tous les cas, la véritable parenté de [reveal_scope.GetFirstName] est désormais connu de tous. Que cela soit un bien ou un mal."
 agot_bastard_event.0959.t:0 "De sang royal"
 agot_bastard_event.0959.desc.landed:0 "Le Grand Mestre en lit le contenu, et que je le veuille ou non, je ne parviens pas à voiler ma surprise. [reveal_scope.Custom('FR_le_Char_P')|U][reveal_scope.GetFullName] est en réalité [reveal_scope.Custom('FR_LeLa')] [reveal_scope.Custom('GetDaughterSon')] de [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et de [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName] ! Et des copies de cette lettre ont étaient expédiés aux quatre coins du royaume."
 agot_bastard_event.0959.desc.courtier:0 "Le Grand Mestre en lit le contenu, et que je le veuille ou non, je ne parviens pas à voiler ma surprise. [reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName], actuellement à la Cour [reveal_employer.Custom('FR_du_Char_Pi')][reveal_employer.GetTitledFirstName], est en réalité [reveal_scope.Custom('FR_LeLa')] [reveal_scope.Custom('GetDaughterSon')] de [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et de [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName] ! Et des copies de cette lettre ont étaient expédiés aux quatre coins du royaume."
 agot_bastard_event.0959.desc.robert:0 "Le Grand Mestre en lit le contenu, et que je le veuille ou non, je ne parviens pas à voiler ma surprise. [reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName], actuellement à la Cour [reveal_employer.Custom('FR_du_Char_Pi')][reveal_employer.GetTitledFirstName], est en réalité [reveal_scope.Custom('FR_LeLa')] [reveal_scope.Custom('GetDaughterSon')] de [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et de [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName] ! Et des copies de cette lettre ont étaient expédiés aux quatre coins du royaume.\n\n« Ce n'est pas tout Votre Majesté ! » s'exclame [courtier.GetFirstNameNoTooltip], comme si n'importe quelle autre nouvelle pouvait bien avoir de l'importance comparée à celle que je viens d'apprendre. [courtier.Custom('FR_IlElle')|U] tend un second parchemin : « Cela vient de Lord Eddard Stark. »"
 agot_bastard_event.0959.desc.ned_revealer:0 "Le Grand Mestre en lit le contenu, et que je le veuille ou non, je ne parviens pas à voiler ma surprise. [reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetName], actuellement à la Cour [reveal_employer.Custom('FR_du_Char_Pi')][reveal_employer.GetTitledFirstName], est en réalité [reveal_scope.Custom('FR_LeLa')] [reveal_scope.Custom('GetDaughterSon')] de [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et de [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName] ! Et des copies de cette lettre ont étaient expédiés aux quatre coins du royaume.\n\n« Ce n'est pas tout Votre Majesté ! » s'exclame [courtier.GetFirstNameNoTooltip], comme si n'importe quelle autre nouvelle pouvait bien avoir de l'importance comparée à celle que je viens d'apprendre. [courtier.Custom('FR_IlElle')|U] tend un second parchemin : « Cela vous est adressé spécifiquement. »"
 agot_bastard_event.0959.desc.king_revealer:0 "Les corbeaux ayant accomplis leur devoir, le royaume en a été informé, et c'est bien entendu la première chose que je dois traiter lorsque je m'assois sur le Trône de fer ce matin. Je suis à l'origine de la révélation selon laquelle [reveal_scope.GetName] serait en fait l'enfant de [real_father.GetFullName] et [real_mother.GetFullName], et tous attendent de savoir quelle sera ma prochaine action.\n\nAutrement dit, quelle est ma décision à ce sujet ?"
 agot_bastard_event.0959.robert:0 "Amenez-le moi !"
 agot_bastard_event.0959.a:0 "Je dois répondre avec force face à ce prétendant."
 agot_bastard_event.0959.a.flavor:0 "Vous allez faire preuve de fermeté."
 agot_bastard_event.0959.b:0 "Il me faut agir, mais ne faisons rien de stupide."
 agot_bastard_event.0959.b.flavor:0 "Vous allez rester mesuré dans vos actes."
 agot_bastard_event.0959.c:0 "Aucune importance. Je ne donnerais pas suite à cette affaire."
 agot_bastard_event.0959.c.flavor:0 "Vous resterez passif à propos de tout ceci."
 agot_bastard_event.0960.t:0 "Une plaidoirie pour un ami"
 agot_bastard_event.0960.desc.ned_revealer:0 "Une émotion forte m'envahit dans la poitrine lorsque j'ouvre la lettre, marquée du sceau de la Maison Stark. L'émotion se prolonge jusqu'au bout de mes doigts, qui se mettent alors à trembler. « Mon plus vieil ami ». Ma gorge se serre.\n\n« Je te connais mieux que quiconque, mais je ne puis qu'imaginer la rage et le chagrin qui t'on envahi lorsque tu as appris la nouvelle. La trahison que tu as du ressentir. Pour cela mon ami, je suis désolé, bien plus qu'aucun mot ne saurait en témoigner. Depuis longtemps j'avais souhaité te l'annoncer dans de meilleures circonstances, mais mon fardeau était devenu trop pesant. » Mes poings se serrent à mesure que les mots défilent. J'aurais aimé que nul ne puisse voir les émotions qui m'habitaient à ce moment-là, mais elles étaient trop fortes pour être contenues.\n\n« En dépit de tout ceci, j'ai l'espoir que nous pourrons toujours rester ami, toi et moi. Je te connais Robert, et je connais la fureur dont tu es capable. Peut-être que je ne mérite ni ton amitié, ni même ta pitié, mais pour l'amour que je vous porte, à toi et à l'enfant de ma bien-aimée sœur, je me dois de le faire. Je t'en prie, je t'en supplie. Si ce n'est pour moi, fais le donc pour ma sœur. Au nom de Lyanna, je demande ta miséricorde. Ce n'est pas l'engeance d'un dragon, c'est simplement l'enfant de la femme que nous aimions tous deux. En sa mémoire, épargne lui la vie.\nÀ jamais ton ami, Eddard Stark. »\n\nJe cligne des yeux afin de balayer toutes larmes qui pourraient se former. De chagrin ou de fureur, à ce moment là moi-même je ne sais pas. Tous attendent ma réponse."
 agot_bastard_event.0960.desc:0 "Une émotion forte m'envahit dans la poitrine lorsque j'ouvre la lettre, marquée du sceau de la Maison Stark. L'émotion se prolonge jusqu'au bout de mes doigts, qui se mettent alors à trembler. « Mon plus vieil ami ». Ma gorge se serre.\n\n« Je te connais mieux que quiconque, mais je ne puis qu'imaginer la rage et le chagrin qui t'on envahi lorsque tu as appris la nouvelle. La trahison que tu as du ressentir. Pour cela mon ami, je suis désolé, bien plus qu'aucun mot ne saurait en témoigner. Depuis longtemps j'avais souhaité te l'annoncer dans de meilleures circonstances, mais les choses ont échappés à mon contrôle. » Mes poings se serrent à mesure que les mots défilent. J'aurais aimé que nul ne puisse voir les émotions qui m'habitaient à ce moment-là, mais elles étaient trop fortes pour être contenues.\n\n« En dépit de tout ceci, j'ai l'espoir que nous pourrons toujours rester ami, toi et moi. Je te connais Robert, et je connais la fureur dont tu es capable. Peut-être que je ne mérite ni ton amitié, ni même ta pitié, mais pour l'amour que je vous porte, à toi et à l'enfant de ma bien-aimée sœur, je me dois de le faire. Je t'en prie, je t'en supplie. Si ce n'est pour moi, fais le donc pour ma sœur. Au nom de Lyanna, je demande ta miséricorde. Ce n'est pas l'engeance d'un dragon, c'est simplement l'enfant de la femme que nous aimions tous deux. En sa mémoire, épargne lui la vie.\nÀ jamais ton ami, Eddard Stark. »\n\nJe cligne des yeux afin de balayer toutes larmes qui pourraient se former. De chagrin ou de fureur, à ce moment là moi-même je ne sais pas. Tous attendent ma réponse."
 agot_bastard_event.0960.a:0 "Nul homme n'a jamais souffert d'une pareille trahison !"
 agot_bastard_event.0960.b.son:0 "Immense est ma rage, mais je ne massacrerais point l'enfant de Lyanna."
 agot_bastard_event.0960.b.daughter:0 "Immense est ma rage, mais je ne massacrerais pas la fille de Lyanna."
 agot_bastard_event.0960.c:0 "Cela remonte à tellement d'années... Je refuse d'œuvrer contre ceux que j'aime."
 agot_bastard_event.0960.c.flavor:0 "Vous resterez passif à propos de tout ceci."
 agot_bastard_event.0961.t:0 "Une réponse rude"
 agot_bastard_event.0961.desc:0 "Mes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir ma réaction. Une affirmation aussi flagrante d'une prétention sur le Trône justifierait une réponse, même de la part des dirigeants les plus modérés — ce que je ne suis pas.\n\nQuelle est va être ma réponse à ce défi implicite ?"
 agot_bastard_event.0961.a:0 "Je ficherais leurs deux têtes sur une pique !"
 agot_bastard_event.0961.a.flavor:0 "Vous allez exiger les têtes de [reveal_scope.GetFirstName] et [reveal_employer.GetFirstName] !"
 agot_bastard_event.0961.b:0 "J'aurais sa tête !"
 agot_bastard_event.0961.c.nw:0 "Il devra rejoindre la Garde de Nuit ! C'est à cette condition qu'il pourra garder sa tête !"
 agot_bastard_event.0961.c.ss:0 "Elle devra rejoindre les Soeurs du Silence ! C'est à cette condition qu'elle pourra garder sa tête !"
 agot_bastard_event.0961.d:0 "Le seul lieu sûr pour un tel sang ce sont les cachots !"
 agot_bastard_event.0962.t:0 "Une réponse modérée"
 agot_bastard_event.0962.desc:0 "Mes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir ma réaction. Bien qu'une telle affirmation représente un certain danger, [reveal_scope.GetName] n'a pour le moment commis aucun forfait à mon encontre, et ne mérite donc aucun châtiment. Il me faut néanmoins décider de ce que je dois faire."
 agot_bastard_event.0962.a.nw:0 "Il sera autorisé à passer le reste de sa vie au Mur."
 agot_bastard_event.0962.a.ss:0 "Elle sera autorisée à passer le reste de sa vie parmi les Sœurs du Silence."
 agot_bastard_event.0962.b:0 "[reveal_scope.Custom('FR_IlElle')|U] doit être placé[reveal_scope.Custom('FR_E')] en état d'arrestation."
 agot_bastard_event.0962.c:0 "[reveal_scope.GetName] pourrait rejoindre la Cour."
 agot_bastard_event.0962.d:0 "[reveal_scope.GetName] doit renoncer à ses revendications."
 agot_bastard_event.0963.t:0 "Un[reveal_scope.Custom('FR_E')] nouv[reveal_scope.Custom('FR_EauElle')] [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] ?"
 agot_bastard_event.0963.desc.jon:0 "Assis sur le Trône, j'exerce mon pouvoir comme il se doit, lorsqu'on m'apporte une missive portant le sceau de la Maison [revealer.GetHouse.GetBaseName]. Tandis que je débute la lecture, mes yeux témoignent de mon étonnement.\n\nStupéfait, j'apprends que [reveal_scope.Custom('FR_le_Char_P')][reveal_scope.GetFullName] serait en fait, comme moi, un [reveal_scope.GetDynasty.GetBaseName]. Né[reveal_scope.Custom('FR_E')] de l'union entre [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName] durant la guerre de l'Usurpateur. [reveal_scope.Custom('FR_IlElle')|U] est maintenant connu[reveal_scope.Custom('FR_E')] pour être de descendance royale.\n\nMes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir la suite de ce drame familial. Bien qu'une telle affirmation représente un certain danger, [reveal_scope.GetFirstNameNoTooltip] n'a pour le moment commis aucun forfait à mon encontre. Et je ne peux ignorer le fait que nous soyons parent, qu'importe sa naissance. Il me faut donc décider de ce que je dois faire."
 agot_bastard_event.0963.desc.my_son:0 "Je siège sur le Trône, exerçant mon pouvoir comme il se doit, lorsqu'on m'apporte une missive marquée du sceau de la Maison [revealer.GetHouse.GetBaseName]. Je peine à lire ce que je vois, et à croire ce que je lis.\n\n[reveal_scope.Custom('FR_le_Char_P')|U][reveal_scope.GetFullName] est mon enfant ! Né[reveal_scope.Custom('FR_E')] de mon union avec [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName], et [reveal_scope.Custom('FR_IlElle')] est désormais connu[reveal_scope.Custom('FR_E')] comme étant de descendance royale par tout le royaume.\n\nMes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir la suite de ce drame familial. Bien que l'existence soudaine d'un fils peut représenter une menace pour moi, [reveal_scope.GetFirstNameNoTooltip] n'a commis aucun forfait à mon encontre. Il me faut donc décider de ce que je dois faire."
 agot_bastard_event.0963.desc.my_daughter:0 "Je siège sur le Trône, exerçant mon pouvoir comme il se doit, lorsqu'on m'apporte une missive marquée du sceau de la Maison [revealer.GetHouse.GetBaseName]. Je peine à lire ce que je vois, et à croire ce que je lis.\n\n[reveal_scope.Custom('FR_le_Char_P')|U][reveal_scope.GetFullName] est mon enfant ! Né[reveal_scope.Custom('FR_E')] de mon union avec [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName], et [reveal_scope.Custom('FR_IlElle')] est désormais connu[reveal_scope.Custom('FR_E')] comme étant de descendance royale par tout le royaume.\n\nMes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir la suite de ce drame familial. Bien que l'existence soudaine d'une fille peut représenter une menace pour moi, [reveal_scope.GetFirstNameNoTooltip] n'a commis aucun forfait à mon encontre. Il me faut donc décider de ce que je dois faire."
 agot_bastard_event.0963.desc:0 "Assis[ROOT.Char.Custom('FR_E')] sur le Trône, j'exerce mon pouvoir comme il se doit, lorsqu'on m'apporte une missive portant le sceau de la Maison [revealer.GetHouse.GetBaseName]. Tandis que je débute la lecture, mes yeux témoignent de mon étonnement.\n\nStupéfait, j'apprends que [reveal_scope.Custom('FR_le_Char_P')][reveal_scope.GetFullName] serait en fait, comme moi, un[reveal_scope.Custom('FR_E')] [reveal_scope.GetDynasty.GetBaseName]. Né[reveal_scope.Custom('FR_E')] de l'union entre [real_father.Custom('FR_le_Char_P')][real_father.GetFullName] et [real_mother.Custom('FR_le_Char_P')][real_mother.GetFullName]. [reveal_scope.Custom('FR_IlElle')|U] est maintenant connu[reveal_scope.Custom('FR_E')] pour être de descendance royale.\n\nMes yeux passent du parchemin qu'on m'a remis à la mer d'yeux impatients qui se tient devant moi. Tous attendent de voir la suite de ce drame familial. Bien qu'une telle affirmation représente un certain danger, [reveal_scope.GetFirstNameNoTooltip] n'a commis aucun forfait à mon encontre. Et je ne peux ignorer le fait que nous soyons parent, qu'importe sa naissance. Il me faut donc décider de ce que je dois faire."
 agot_bastard_event.0963.a.nw:0 "Il sera autorisé à passer le reste de sa vie au Mur."
 agot_bastard_event.0963.a.ss:0 "Elle sera autorisée à passer le reste de sa vie parmi les Sœurs du Silence."
 agot_bastard_event.0963.b:0 "[reveal_scope.Custom('FR_IlElle')|U] doit être placé[reveal_scope.Custom('FR_E')] en état d'arrestation."
 agot_bastard_event.0963.c:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetNameNoTooltip] pourrait rejoindre la Cour."
 agot_bastard_event.0963.c.flavor:0 "Vous pourrez lui accorder des privilèges supplémentaires."
 agot_bastard_event.0963.d:0 "[reveal_scope.Custom('FR_le_Char')|U][reveal_scope.GetNameNoTooltip] doit renoncer à ses revendications."
 agot_bastard_event.0980.desc:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] et [reveal_employer.Custom('FR_le_Char')][reveal_employer.GetName], pour leur refus de se présenter devant le trône après avoir prit connaissance de l'héritage de [reveal_scope.GetFirstNameNoTooltip], se sont [Select_CString(And(reveal_scope.IsFemale, reveal_employer.IsFemale), 'rendues', 'rendus')] coupables de trahisons envers la Couronne, et ont été [Select_CString(And(reveal_scope.IsFemale, reveal_employer.IsFemale), 'condamnées', 'condamnés')] à mort.\n\nQuiconque leur apporterait de l'aide, sous quelque forme que ce soit, subira le même sort."
 agot_bastard_event.0981.desc:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName], pour son refus de se présenter devant le trône après avoir prit connaissance de son héritage, s'est rendu[reveal_scope.Custom('FR_E')] coupable de trahison envers la Couronne, et a été condamné[reveal_scope.Custom('FR_E')] à mort.\n\nQuiconque lui apporterait de l'aide, sous quelque forme que ce soit, subira le même sort."
 agot_bastard_event.0983.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0983.desc:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été sommé[reveal_scope.Custom('FR_E')] de se rendre à la Cour royale pour y être incarcéré[reveal_scope.Custom('FR_E')], et ce jusqu'à qu'il aura été certifié que son héritage ne représente pas un danger pour le royaume. Toute personne qui agirait dans le but de l'aider à se soustraire à cette convocation sera considérée comme un traître à la Couronne et jugée en conséquence."
 agot_bastard_event.0983.a:0 "La simple naissance justifierait donc l'emprisonnement ? Ce n'est pas juste."
 agot_bastard_event.0984.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0984.desc:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été sommé[reveal_scope.Custom('FR_E')] de se rendre à la Cour royale pour y être placé[reveal_scope.Custom('FR_E')] sous la protection de Sa Majesté, et ce jusqu'à qu'il aura été certifié que son héritage ne représente pas un danger pour le royaume. Toute personne qui agirait dans le but de l'aider à se soustraire à cette convocation sera considérée comme un traître à la Couronne et jugée en conséquence."
 agot_bastard_event.0985.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0985.a:0 "Cela semble être juste."
 agot_bastard_event.0990.t:0 "Alliances par le mariage"
 agot_bastard_event.0990.desc.landed:0 "C'est chose courante, et ce depuis longtemps, que les maisons de Westeros scellent des alliances par le biais du mariage durant les temps de crises. En tant que prétendant[ROOT.Char.Custom('FR_E')] célibataire de [ruler_scope.GetPrimaryTitle.GetName], je représente désormais un moyen d'accession à la maison royale.\n\nEn prévision des nombreuses péripéties qui m'attendent, j'ai laissé des ouvertures subtiles aux maisons les plus ambitieuses du royaume qui pourraient être intéressé par une offre de mariage. Compte tenu des dangers qui guettent et de l'opportunité que pourrait représenter une alliance, il m'est fortement recommandé de l'envisager."
 agot_bastard_event.0990.desc.landed_singular:0 "C'est chose courante, et ce depuis longtemps, que les maisons de Westeros scellent des alliances par le biais du mariage durant les temps de crises. En tant que prétendant[ROOT.Char.Custom('FR_E')] célibataire de [ruler_scope.GetPrimaryTitle.GetName], je représente désormais un moyen d'accession à la maison royale.\n\nUne telle offre m'a déjà été envoyée par la Maison [potential_spouse_1.GetHouse.GetBaseName], promettant leur soutien dans la guerre à venir. Compte tenu des dangers qui guettent et de l'opportunité que pourrait représenter une alliance, accepter serait probablement la meilleure chose à faire."
 agot_bastard_event.0990.desc.courtier:0 "C'est chose courante, et ce depuis longtemps, que les maisons de Westeros scellent des alliances par le biais du mariage durant les temps de crises. En tant que prétendant[reveal_scope.Custom('FR_E')] célibataire de [ruler_scope.GetPrimaryTitle.GetName], [reveal_scope.GetName] représente désormais un moyen d'accession au pouvoir royal.\n\nEn prévision des nombreuses péripéties qui nous attendent, j'ai laissé des ouvertures subtiles aux maisons les plus ambitieuses du royaume qui pourraient être intéressé par une offre de mariage. Compte tenu des dangers qui guettent et de l'opportunité que pourrait représenter une alliance, il serait fortement recommandé de l'envisager."
 agot_bastard_event.0990.desc.courtier_singular:0 "C'est chose courante, et ce depuis longtemps, que les maisons de Westeros scellent des alliances par le biais du mariage durant les temps de crises. En tant que prétendant[reveal_scope.Custom('FR_E')] célibataire de [ruler_scope.GetPrimaryTitle.GetName], [reveal_scope.GetName] représente désormais un moyen d'accession au pouvoir royal.\n\nUne telle offre m'a déjà été envoyée par la Maison [potential_spouse_1.GetHouse.GetBaseName], promettant leur soutien dans la guerre à venir. Compte tenu des dangers qui guettent et de l'opportunité que pourrait représenter une alliance, accepter serait probablement la meilleure chose à faire."
 agot_bastard_event.0990.a:0 "Je vais épouser [potential_spouse_1.GetName] !"
 agot_bastard_event.0990.b:0 "Je vais épouser [potential_spouse_2.GetName] !"
 agot_bastard_event.0990.c:0 "Je vais épouser [potential_spouse_3.GetName] !"
 agot_bastard_event.0990.d:0 "Je trouverais du soutien autrement."
 agot_bastard_event.0990.a.they:0 "[reveal_scope.GetName] va épouser [potential_spouse_1.GetName] !"
 agot_bastard_event.0990.b.they:0 "[reveal_scope.GetName] va épouser [potential_spouse_2.GetName] !"
 agot_bastard_event.0990.c.they:0 "[reveal_scope.GetName] va épouser [potential_spouse_3.GetName] !"
 agot_bastard_event.0990.d.they:0 "Nous trouverons du soutien autrement."
 agot_bastard_event.0992.t:0 "La ligne est franchie"
 agot_bastard_event.0992.desc:0 "Voilà donc où nous en sommes.\n\nTrop de temps s'est écoulé pour feindre l'ignorance. Les corbeaux se sont envolés et le ban a été convoqué. La ligne est franchie. Les dés sont jetés. La guerre gronde. Qui de la maison [reveal_scope.GetHouse.GetBaseName] ou [ruler_scope.GetHouse.GetBaseName] ressortira vainqueur ?\n\nJ'examine les bannières rassemblés devant moi. J'y vois tout autant de maisons qui se sont unis pour mettre à bas la tyrannie [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]."
 agot_bastard_event.0992.desc.ned:0 "Voilà donc où nous en sommes.\n\nTrop de temps s'est écoulé pour feindre l'ignorance. Les corbeaux se sont envolés et le ban a été convoqué. La ligne est franchie. Les dés sont jetés. La guerre gronde. Qui de la maison [reveal_scope.GetHouse.GetBaseName] ou [ruler_scope.GetHouse.GetBaseName] ressortira vainqueur ?\n\nJ'examine les bannières rassemblés devant moi. Mon cœur saigne à l'idée de marcher vers le sud, de marcher contre mon ancien ami... mon meilleur ami. Mais je le dois. Pour Lyanna. Pour [reveal_scope.GetFirstName]. Je fais ce que je pense être juste. Je prie de tout mon cœur, pour mes hommes et pour moi-même. Je prie que cette guerre soit brève."
 agot_bastard_event.0992.a:0 "Ensemble, marchons au nom de la justice !"
 agot_bastard_event.0993.t:0 "Exigences rejetées"
 agot_bastard_event.0993.desc:0 "Voilà donc où nous en sommes.\n\nRejetant mes conditions, [reveal_scope.Custom('FR_LeLa')] bâtard[reveal_scope.Custom('FR_E')] [reveal_scope.GetFirstName] a déclaré son intention de diriger [ruler_scope.GetPrimaryTitle.GetName] et a appelé ses alliés à faire valoir ses revendications. Je ne sais pas ce qui a été promit pour qu'un pareil ost soit rassemblé, mais désormais la ligne est franchie. Les dés sont jetés. La guerre gronde. Qui de la maison [reveal_scope.GetHouse.GetBaseName] ou [ruler_scope.GetHouse.GetBaseName] ressortira vainqueur ?\n\nJ'examine les bannières rassemblés devant moi. J'y vois tout autant de maisons qui se sont unis pour mettre à bas la rébellion de [reveal_scope.GetFirstNameNoTooltip]."
 agot_bastard_event.0993.desc.robert:0 "Les dernières semaines ont été éprouvantes.\n\nMon vieil ami Eddard Stark a jugé mes exigences injustes et a brandi ses bannières pour installer [reveal_scope.GetName] à la tête de [ruler_scope.GetPrimaryTitle.GetName]. Il a rassemblé alliés et vassaux pour l'aider dans cette entreprise, et il est allé jusqu'à affirmer que je ne valais pas mieux que le Roi Fou, que nous avions combattu ensemble.\n\nNotre amitié n'est désormais plus qu'un lointain souvenir. La ligne est franchie. Les dés sont jetés. La guerre gronde. Qui de la maison Stark ou Baratheon ressortira vainqueur ?\n\nJ'écraserais ces rebelles, j'écraserais les Stark, et j'écraserais l'engeance du dragon, comme je le fis avec le père ainsi que le grand-père !"
 agot_bastard_event.0993.a:0 "Je vais réduire en poussière cette prétendue rébellion !"
 agot_bastard_event.0994.t:0 "L'ordre restaurée"
 agot_bastard_event.0994.desc:0 "La rébellion a été écrasée !\n\n[claimant.GetName] croupit dans mes cachots, ainsi que ses traîtres d'alliés. Les historiens se demanderont probablement si cela aurait pu être évité, ou si un tel secret ne pouvait conduire qu'à l'échec, mais qu'importe.\n\nLa maison [ROOT.Char.GetHouse.GetBaseName] perdurera, tout comme mon règne !"
 agot_bastard_event.0994.a:0 "À nouveau en paix."
 agot_bastard_event.0995.t:0 "Proclamer votre droit de naissance"
 agot_bastard_event.0995.desc:0 "Les grandes portes s'ouvrent et devant moi se dévoile l'imposante salle du trône. Je l'aperçois, ce pour quoi je me suis battu. Le Trône de fer. Imposant, menaçant, il domine la Cour qui s'est rassemblé de chaque côté. Je le sens m'appeler, et d'un pas déterminé, je réponds à son invitation.\n\nChaque pas que je fais assure un peu plus ma domination. Quelques mois auparavant j'étais encore discrédité par ceux là même qui m'offrent désormais sourires et courbettes. Nul n'ose plus me défier, dans le geste ou la parole. Ma légitimité est enfin reconnue.\n\nAlors que je gravis une à une les marches du trône, je sens le fardeau de ma naissance lâcher prise, et lorsque j'atteins le sommet, ma force ainsi libérée me permet de brandir bien haut mon épée. Un nouvel âge vient de débuter !"
 agot_bastard_event.0995.a.king:0 "Ainsi débute le règne [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip] !"
 agot_bastard_event.0995.b.king:0 "Ainsi débute le règne [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitleAsNameNoTooltip|l]  [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip] !"
 agot_bastard_event.0995.a.queen:0 "Ainsi débute le règne [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip] !"
 agot_bastard_event.0995.b.queen:0 "Ainsi débute le règne [ROOT.Char.Custom('FR_du_Char_Pi')][ROOT.Char.GetTitleAsNameNoTooltip|l] [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip] !"
 agot_bastard_event.0995.flavor:0 "Que votre règne soit long et prospère !"
 agot_bastard_event.0996.t:0 "Un nouveau jour se lève"
 agot_bastard_event.0996.desc:0 "Je regarde [claimant.GetFirstName] franchir les portes de la salle du trône, arborant une couronne sur sa tête. Tous observent la venu d'un nouvel âge, le genou au sol, la tête baissée.\n\nUne part de moi-même redoute toujours qu'il ne s'agit là que d'un songe éveillé. Il n'y a pas si longtemps, [claimant.Custom('FR_IlElle')] ne connaissait rien de la vérité sur sa parenté. Pourtant, aujourd'hui, [claimant.Custom('FR_LeLa')] voilà siégeant sur le Trône, tandis qu'un jour nouveau se lève sur les Sept Couronnes."
 agot_bastard_event.0996.a:0 "Je me demande ce qu'[claimant.Custom('FR_IlElle')] doit ressentir..."
 agot_bastard_event.0996.b:0 "Long soit son règne !"
 agot_bastard_event.1001.t:0 "Exigences acceptées"
 agot_bastard_event.1001.desc.jon:0 "Je regarde [reveal_scope.GetFirstName] et Eddard tandis que l'on me les amène. Le couard n'a même pas la décence de me regarder dans les yeux alors qu'il est jeté aux pieds du Trône, aux côtés de cette engeance.\n\n« Pour les crimes d'avoir héberger un Targaryen... » alors que les accusations sont listées les unes après les autres, mon esprit s'égare. Je sens chacune des pulsations de mon cœur résonner dans ma tête. La fureur bouillonne tout le long de mes veines. Mon corps tout entier est ainsi transformé en un immense palais de rage, de haine et de colère. Je remarque tardivement que je suis descendu du trône, pour me retrouver juste devant... lui.\n\nJe n'ai pas la patience d'attendre. J'empoigne l'une des épées de la Garde Royale et la sors de son fourreau. D'un mouvement ample auquel s'accompagne un cri furieux, la tête d'Eddard Stark se détache de son corps. La pointe de la lame n'a pas épargné la pierre qui se trouvait en-dessous. [reveal_scope.GetFirstNameNoTooltip] laisse échapper un cri d'effroi, avant que je ne rétablisse le silence d'un second coup, aussi parfaitement exécuté que le premier. Le sang et la pierre s'unissent après que la tête et le corps se soit séparé.\n\nAujourd'hui encore, le sang Targaryen recouvre le sol de la salle du trône. En scrutant les yeux désormais sans vie de mon ancien ami, je ne trouve ni paix, ni réconfort. La colère demeure, tandis que le souvenir de Lyanna continue de s'estomper. Les yeux plein de vie et d'effrois qui se tiennent tout autour de moi me rappellent ceux que je vis à la cour du Roi Fou. Une question effleure alors mon esprit. « Comment en sommes nous arrivés là ? »"
 agot_bastard_event.1001.desc:0 "Je regarde [reveal_scope.GetFirstName] et [reveal_employer.GetFirstName] tandis que l'on me les amène. Alors que les crimes dont on les accuse sont listés les uns après les autres, j'en viens à me demander pourquoi ils ont accepté cela, compte tenu du sort qui les attends.\n\n« Pour les crimes d'avoir hébergé une menace pour le royaume et d'avoir proclamer de fausses revendications... » les accusations s'enchaînent, et je ne les écoute même plus. Tout un tas de question me traverse l'esprit. Est-ce vraiment cela la justice du royaume ? Qu'est-ce qui leur traverse l'esprit en ce moment même ? J'y réfléchis, encore et encore, je ne tranche aucune de ces questions, au contraire du bourreau qui le fait adroitement avec chacune de leur tête. Si j'avais encore des doutes, maintenant mieux valait les enfouir."
 agot_bastard_event.1001.a:0 "Qu'importe, tout ceci est terminé."
 agot_bastard_event.1002.t:0 "Exigences acceptées"
 agot_bastard_event.1002.desc.jon:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. L'engeance du dragon me fixe droit dans les yeux, dans l'intention peut être d'y trouver quelque chose. Alors que nos yeux se croisent, j'en viens à me demander comment je n'ai pas pu reconnaître les traits de Rhaegar dans ce visage. Peut-être est-ce parce que je connais la vérité, mais tout me rappelle lui désormais.\n\n« Pour les crimes d'avoir proclamé de fausses revendications sur le Trône... » les accusations sont listées les unes après les autres, mais je n'y prête déjà plus attention. Je sens chacune des pulsations de mon cœur résonner dans ma tête. La fureur bouillonne tout le long de mes veines. Mon corps tout entier est ainsi transformé en un immense palais de rage, de haine et de colère. Je remarque tardivement que je suis descendu du Trône, pour me retrouver devant... l'engeance.\n\nJe n'ai pas la patience d'attendre. J'empoigne l'une des épées de la Garde Royale et la sors de son fourreau. D'un mouvement ample auquel s'accompagne un cri furieux, la tête de ce substitut de Rhaegar se détache de son corps. La pointe de la lame n'a pas épargné la pierre qui se trouvait en-dessous.\n\nAujourd'hui encore, le sang Targaryen recouvre le sol de la salle du trône. En scrutant les yeux de [reveal_scope.GetFirstNameNoTooltip] désormais sans vie, je ne trouve ni paix, ni réconfort. La colère demeure, tandis que le souvenir de Lyanna continue de s'estomper. Les yeux plein de vie et d'effrois qui se tiennent tout autour de moi me rappellent ceux que je vis à la Cour du Roi Fou. Une question effleure alors mon esprit. « Comment en sommes nous arrivés là ? »"
 agot_bastard_event.1002.desc:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. Alors que les crimes dont on l'accuse sont listés les uns après les autres, j'en viens à me demander pourquoi [reveal_scope.Custom('FR_IlElle')] a accepté[reveal_scope.Custom('FR_E')] cela, compte tenu du sort qui l'attends.\n\n« Pour les crimes d'avoir proclamé de fausses revendications sur le Trône... » Les accusations s'enchaînent, et je ne les écoute même plus. Tout un tas de question me traverse l'esprit. Est-ce vraiment cela la justice du royaume ? Qu'est-ce qui lui traverse l'esprit en ce moment même ? J'y réfléchis, encore et encore, je ne tranche aucune de ces questions, au contraire du bourreau qui le fait adroitement avec sa tête. Si j'avais encore des doutes, maintenant mieux valait les enfouir."
 agot_bastard_event.1002.a:0 "Qu'importe, tout ceci est terminé."
 agot_bastard_event.1003.t:0 "Exigences acceptées"
 agot_bastard_event.1003.desc.male:0 "Noires ailles, noires nouvelles. Un dicton populaire, mais qui s'est avéré faux cette fois. Un corbeau ayant fait le trajet depuis Château Noir m'a informé que [reveal_scope.GetFullName] s'est présenté à la Garde de Nuit, pour y prononcer les vœux sacrés et respecter ses engagements. Il ne possédera pas de terres, ni n'engendrera d'enfants.\n\nJe lâche un soupir de soulagement. Le sang ne sera pas versé, et loin dans le Nord gelé, il ne sera plus un problème pour qui que ce soit. Le royaume peut dormir paisiblement, [reveal_scope.GetFirstName] peut mener une vie loin de la crainte de mon ombre, et mon règne perdurera sans avoir cette épine dans le pied."
 agot_bastard_event.1003.desc.female:0 "Noires ailles, noires nouvelles. Un dicton populaire, mais qui s'est avéré faux cette fois. Un corbeau ayant fait le trajet depuis la Matristère de Villevieille m'a informé que [reveal_scope.GetFullName] s'est présentée auprès des Sœurs du Silence et a juré de respecter ses nouveaux devoirs sacrés. Elle conservera le silence et ne prendra aucun époux.\n\nJe lâche un soupir de soulagement. Le sang ne sera pas versé, et dans les bras de l'Étranger, elle ne sera plus un problème pour qui que ce soit. Le royaume peut dormir paisiblement, [reveal_scope.GetFirstName] peut mener une vie loin de la crainte de mon ombre, et mon règne perdurera sans avoir cette épine dans le pied."
 agot_bastard_event.1003.a:0 "Tout ceci est enfin terminé."
 agot_bastard_event.1004.t:0 "Exigences acceptées"
 agot_bastard_event.1004.desc.jon:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. L'engeance du dragon me fixe droit dans les yeux, dans l'intention peut être d'y trouver quelque chose. Alors que nos yeux se croisent, j'en viens à me demander comment je n'ai pas pu reconnaître les traits de Rhaegar dans ce visage. Peut-être est-ce parce que je connais la vérité, mais tout me rappelle lui désormais.\n\n« Pour les crimes d'avoir proclamé de fausses revendications sur le Trône... » les accusations sont listées les unes après les autres, mais je n'y prête déjà plus attention. Je ne peux penser à rien d'autres que... ces yeux. Un bref instant, j'ai cru apercevoir le regard de Lyanna. Avec le temps, son souvenir s'estompe de plus en plus, pourtant, j'arrive maintenant à me refigurer comment elle était. Je sens chacune des pulsations de mon cœur résonner dans ma tête. Et c'est lorsque je constate qu'un long silence s'est installé, que je comprends que la proclamation est terminée.\n\nSans un mot de ma part, les gardes conduisent [reveal_scope.GetFirstName] vers le donjon. Tandis qu'[reveal_scope.Custom('FR_IlElle')] se lève, ma mémoire s'estompe de nouveau. Les yeux de Lyanna, mais l'attitude d'un Targaryen. Son sort est entre mes mains désormais."
 agot_bastard_event.1004.desc:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. Alors que les crimes dont on l'accuse sont listés les uns après les autres, j'en viens à me demander pourquoi [reveal_scope.Custom('FR_IlElle')] a accepté[reveal_scope.Custom('FR_E')] cela.\n\n« Pour les crimes d'avoir proclamé de fausses revendications sur le Trône... » les accusations s'enchaînent, et je ne les écoute même plus. Je scrute ses yeux pour essayer d'y trouver la raison de sa reddition. Est-ce de la simple couardise, ou au contraire de la bravoure pour maintenir la paix du royaume ? Serait-ce une ruse visant à soutenir un complot plus vaste ? C'est lorsque je constate qu'un long silence s'est installé, que je comprends que la proclamation est terminée.\n\nSans un mot de ma part, les gardes conduisent [reveal_scope.GetFirstName] vers le donjon. Tandis qu'[reveal_scope.Custom('FR_IlElle')] se lève, je me retrouve à réfléchir à des questions plus pragmatiques. Son sort est entre mes mains désormais."
 agot_bastard_event.1004.a:0 "Au moins je sais maintenant ce qu'[reveal_scope.Custom('FR_IlElle')] fait."
 agot_bastard_event.1005.t:0 "Exigences acceptées"
 agot_bastard_event.1005.desc.jon:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. La progéniture de ma bien-aimée Lyanna et de mon ennemi Rhaegar se met à prononcer les vœux. J'en viens à me demander comment je n'ai pas pu reconnaître les traits de Rhaegar dans ce visage. Peut-être est-ce parce que je connais la vérité, mais tout me rappelle lui désormais.\n\n« Je vous jure fidélité, à vous et à vos héritiers. » Le serment est terminé, et lorsqu'[reveal_scope.Custom('FR_IlElle')] se relève, une étrange sensation m'habite. Ces yeux. Je les reconnais. C'est ceux de Lyanna. Avec le temps, son souvenir s'estompe de plus en plus, pourtant, j'arrive maintenant à me refigurer comment elle était.\n\nSans un mot de ma part, les gardes raccompagnent [reveal_scope.GetFirstName] parmi les autres courtisans. Les yeux de Lyanna, mais l'attitude d'un Targaryen. Son sort est entre mes mains désormais."
 agot_bastard_event.1005.desc:0 "Je regarde [reveal_scope.GetFirstName] tandis qu'on l'amène devant moi. Toute la Cour rassemblée ici l'écoute prononcer son serment.\n\n« Je vous jure fidélité, à vous et à vos héritiers. » Le serment est terminé, et lorsqu'[reveal_scope.Custom('FR_IlElle')] se relève, je scrute ses yeux pour essayer d'y trouver la raison de sa reddition. Est-ce de la simple couardise, ou au contraire de la bravoure pour maintenir la paix du royaume ? Serait-ce une ruse visant à soutenir un complot plus vaste ? C'est lorsque je constate qu'un long silence s'est installé, que je comprends que tout ceci est enfin terminé.\n\nSans un mot de ma part, les gardes raccompagnent [reveal_scope.GetFirstName] parmi les autres courtisans."
 agot_bastard_event.1005.a:0 "Je ferais comme bon me semble."
 agot_bastard_event.1005.b:0 "[reveal_scope.GetFirstNameNoTooltip] est un[reveal_scope.Custom('FR_E')] combattant[reveal_scope.Custom('FR_E')] de renom, pourquoi ne pas l'inviter à ma Garde Royale ?"
 agot_bastard_event.1005.c:0 "Au donjon !"
 agot_bastard_event.1005.d:0 "Je vais l'accueillir comme un[reveal_scope.Custom('FR_E')] véritable membre de la Maison [reveal_scope.GetHouse.GetBaseName]."
 agot_bastard_event.1006.opening:0 "À tout les seigneurs et nobles dames de Westeros,"
 agot_bastard_event.1006.desc:0 "Moi, [reveal_scope.GetFullName], devant les Anciens dieux et les Nouveaux, je renonce à toute revendication sur le [ruler_scope.GetPrimaryTitle.GetName] et tous les titres afférant. Ma naissance est peut-être un fait, mais elle ne me donne aucun droit. A compté de ce jour, je serais un[reveal_scope.Custom('FR_E')] loyal sujet de Sa Majesté [ruler_scope.GetFullName]."
 agot_bastard_event.1006.a:0 "Profitons de la paix."
 agot_bastard_event.realm_ruler_react_wait:0 "Voyons comment les choses vont évoluer."
 agot_bastard_event.0901.b.jon:0 "Et pourtant je le dois. La promesse qui fut faite est plus importante que ma culpabilité."
 agot_bastard_event.0906.desc.open:0 "Au fil de mon récit, le visage de [reveal_scope.GetFirstName] s'est peu à peu changé, et il n'affiche désormais plus que de l'angoisse. Un long et pesant silence s'est installé, qui fini par être rompu. « Cela ne change rien, » dit-[reveal_scope.Custom('FR_IlElle')]. « Je suis et resterais un[reveal_scope.Custom('FR_E')] [reveal_scope.GetHouse.GetBaseNameNoTooltip]. »\n\nJe suis surpris[ROOT.Char.Custom('FR_E')] par une telle assurance."
 agot_bastard_event.0906.desc.fake:0 " Surpris[ROOT.Char.Custom('FR_E')] et touché[ROOT.Char.Custom('FR_E')]."
 agot_bastard_event.0906.desc.close:0 " Mais cela ne change rien à la menace qui plane sur cette vérité.\n\nEn plus de l'aspect pragmatique de la chose, j'en viens à me demander si [reveal_scope.Custom('FR_IlElle')] a décidé[reveal_scope.Custom('FR_E')] cela dans le seul but de se préserver du danger. Peut-être serait-il plus judicieux de laisser éclater la vérité à la face du monde."
 agot_bastard_event.0992.desc.same:0 "Voilà donc où nous en sommes.\n\nTrop de temps s'est écoulé pour feindre l'ignorance. Les corbeaux se sont envolés et le ban a été convoqué. La ligne est franchie. Les dés sont jetés. La guerre gronde. Une guerre entre membres de la maison [ruler_scope.GetHouse.GetBaseName]. Une guerre qui trouvera son issue dans le sang.\n\nJ'examine les bannières rassemblés devant moi. J'y vois tout autant de maisons qui se sont unis pour mettre à bas la tyrannie [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetNameNoTooltip]."
 agot_bastard_event.0993.desc.same:0 "Voilà donc où nous en sommes.\n\nRejetant mes conditions, [reveal_scope.Custom('FR_LeLa')] bâtard[reveal_scope.Custom('FR_E')] [reveal_scope.GetFirstName] a déclaré son intention de diriger [ruler_scope.GetPrimaryTitle.GetName] et a appelé ses alliés à faire valoir ses revendications. Je ne sais pas ce qui a été promit pour qu'un pareil ost soit rassemblé, mais désormais la ligne est franchie. Les dés sont jetés. La guerre gronde. Une guerre entre deux [reveal_scope.GetHouse.GetBaseName], mais qui ne peut avoir qu'un seul vainqueur.\n\nJ'examine les bannières rassemblés devant moi. J'y vois tout autant de maisons qui se sont unis pour mettre à bas la rébellion de [reveal_scope.GetFirstNameNoTooltip]."
 agot_bastard_event.0959.desc_opening:0 "Assis[ROOT.Char.Custom('FR_E')] sur le Trône de Fer, je préside une Cour qui doit statuer sur un différent des plus insignifiants entre des seigneurs mineurs, quand soudainement [courtier.Custom('FR_le_Char_P')][courtier.GetFullName] fait irruption. « Votre Majesté ! » Sa voix résonne dans toute la salle.\n\n« Quelle est la raison de cette brusque interruption ?! »"
 agot_bastard_event.0959.desc_opening_wrathful:0 "Ma voix résonne à son tour alors que la Cour a les yeux rivés sur [courtier.GetFirstNameNoTooltip], qui s'avance prestement et s'agenouille aux pieds du trône.\n\n"
 agot_bastard_event.0959.desc_opening_not_wrathful:0 "La voix de [council.Custom('FR_du_Char')][council.GetName] résonne à son tour alors que la Cour a les yeux rivés sur [courtier.GetFirstNameNoTooltip], qui s'avance prestement et s'agenouille aux pieds du trône.\n\n"
 agot_bastard_event.0959.desc_opening_end:0 "« Mes excuses pour cette interruption, Votre Majesté, mais j'ai ici une lettre de la plus haute importance ! » [courtier.Custom('FR_IlElle')|U] tend une missive avec le sceau de la Maison [revealer.GetHouse.GetBaseName].\n\n"
 agot_bastard_event.0970.t_execution_both:0 "Une requête tyrannique"
 agot_bastard_event.0970.t_execution_bastard:0 "Une requête mortelle"
 agot_bastard_event.0970.t_send_to_order:0 "Une requête sévère"
 agot_bastard_event.0970.t_imprison:0 "Une sombre requête"
 agot_bastard_event.0970.t_bring_to_court:0 "Une requête de captivité"
 agot_bastard_event.0970.t_give_up_claims:0 "Une requête claire"
 agot_bastard_event.0970.t_nothing:0 "Pas de nouvelles, bonne nouvelles ?"
 agot_bastard_event.0970.desc_execution_both:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige ma tête, ainsi que celle de [reveal_scope.GetFirstName].\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains affirmant qu'il s'agit d'une preuve que [ruler_scope.GetTitledFirstNameNoTooltip] est un[ruler_scope.Custom('FR_E')] tyra[ruler_scope.Custom('FR_NNne')]. Que ce soit le cas ou non, reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Je ne peux quand même pas accéder à sa requête ? Mais si je ne le fais pas, le royaume va saigner, et des têtes vont tomber.\n\n#italic Or donc, deux têtes… ou des milliers ?#!"
 agot_bastard_event.0970.desc_execution_bastard:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige la tête de [reveal_scope.GetFirstName].\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme outrancière. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Je ne peux quand même pas accéder à sa requête ? Mais si je ne le fais pas, le royaume va saigner, et des têtes vont tomber.\n\n#italic Or donc, une tête… ou des milliers ?#!"
 agot_bastard_event.0970.desc_send_to_nw:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que [reveal_scope.GetFirstName] parte pour la Garde de Nuit afin d'y écouler les jours qui lui restent dans le Nord gelé.\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme abusive. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, une vie… ou des milliers ?#!"
 agot_bastard_event.0970.desc_send_to_ss:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que [reveal_scope.GetFirstName] soit envoyée auprès des Sœurs du Silence pour y écouler les jours qui lui restent auprès de l'Étranger.\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme abusive. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, une vie… ou des milliers ?#!"
 agot_bastard_event.0970.desc_imprison:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que [reveal_scope.GetFirstName] soit mis[reveal_scope.Custom('FR_E')] aux fers afin de croupir dans ses cachots jusqu'au jour où [ruler_scope.Custom('FR_IlElle')] en décidera autrement.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Reste qu'il s'agit là d'un décret royal. Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, une vie… ou des milliers ?#!"
 agot_bastard_event.0970.desc_bring_to_court:0 "Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre que j'ai reçu, envoyée par [ruler_scope.Custom('FR_le_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que [reveal_scope.GetFirstName] soit envoyé[reveal_scope.Custom('FR_E')] à la capitale pour y vivre sous surveillance en tant que courtisan[reveal_scope.Custom('FR_E')] de la Cour royale.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Reste qu'il s'agit là d'un décret royal. Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner.\n\n#italic Or donc, une vie de captivité contre une paix ?#!"
 agot_bastard_event.0970.desc_give_up_claims:0 "Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre que j'ai reçu, envoyée par [ruler_scope.Custom('FR_le_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. Dans un acte de mansuétude, [ruler_scope.Custom('FR_IlElle')] exige que [reveal_scope.GetFirstName] fasse une déclaration publique afin d'abandonner toutes revendications que son héritage pourrait lui donner.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Beaucoup pensent qu'il s'agit là d'une requête tout à fait juste. Néanmoins, renoncer à ses revendications peut représenter un camouflet infligé à l'honneur. Tandis qu'un refus amènera le royaume à saigner.\n\n#italic Or donc, la fierté ou la paix ?#!"
 agot_bastard_event.0970.desc_nothing:0 "Jours et nuits je suis rongé[ROOT.Char.Custom('FR_E')] par mes pensées. M'imaginer quelle pourrait être la réponse [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName] suite aux révélations sur la naissance [reveal_scope.Custom('FR_du_Char')][reveal_scope.GetName] accapare toute mon attention. Plusieurs semaines se sont écoulés, impossible qu'[ruler_scope.Custom('FR_IlElle')] n'en ai pas eu vent depuis lors.\n\nJe ne peux faire autrement qu'arriver à la conclusion qu'[ruler_scope.Custom('FR_IlElle')] a simplement laissé cette affaire en suspens. Quelle qu'en soit la raison, simple dédain ou désintérêt total, il semble qu'il n'y aura aucune exigence qui nous parviendra de Port-Réal."
 agot_bastard_event.0971.t_execution_bastard:0 "$agot_bastard_event.0970.t_execution_bastard$"
 agot_bastard_event.0971.t_send_to_order:0 "$agot_bastard_event.0970.t_send_to_order$"
 agot_bastard_event.0971.t_imprison:0 "$agot_bastard_event.0970.t_imprison$"
 agot_bastard_event.0971.t_bring_to_court:0 "$agot_bastard_event.0970.t_bring_to_court$"
 agot_bastard_event.0971.t_give_up_claims:0 "$agot_bastard_event.0970.t_give_up_claims$"
 agot_bastard_event.0971.t_nothing:0 "$agot_bastard_event.0970.t_nothing$"
 agot_bastard_event.0971.desc_execution_bastard:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige ma tête.\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme outrancière. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Je ne peux quand même pas accéder à sa requête ? Sacrifier ma propre vie ? Mais si je ne le fais pas, le royaume va saigner, et je sacrifierais ainsi la vie de bien d'autres.\n\n#italic Or donc, ma vie… ou celle de milliers d'autres ?#!"
 agot_bastard_event.0971.desc_send_to_nw:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que je parte pour la Garde de Nuit pour y écouler les jours qu'il me reste dans le Nord gelé.\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme abusive. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, ma vie… ou des milliers d'autres ?#!"
 agot_bastard_event.0971.desc_send_to_ss:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que je rejoigne les Soeurs du Silence pour y écouler les jours qu'il me reste dans le Nord gelé.\n\nUne telle exigence a bien évidemment eu de nombreux échos dans tout le royaume. Certains jugeant la sévérité de [ruler_scope.GetFirstNameNoTooltip] comme abusive. Mais reste qu'il s'agit là d'un décret royal. #bold Que faire ?#! Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, ma vie… ou des milliers d'autres ?#!"
 agot_bastard_event.0971.desc_imprison:0 "Noires ailes, noires nouvelles. Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que je sois mis[ROOT.Char.Custom('FR_E')] aux fers afin de croupir dans ses cachots jusqu'au jour où [ruler_scope.Custom('FR_IlElle')] en décidera autrement.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Reste qu'il s'agit là d'un décret royal. Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner, et des vies seront perdus.\n\n#italic Or donc, ma liberté contre la paix ?#!"
 agot_bastard_event.0971.desc_bring_to_court:0 "Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre que j'ai reçu, envoyée par [ruler_scope.Custom('FR_le_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. [ruler_scope.Custom('FR_IlElle')|U] exige que je sois envoyé[ROOT.Char.Custom('FR_E')] à la capitale pour vivre à la Cour royale sous haute surveillance.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Bien que cela signifie que ma vie sera épargné, je serais dépossédé de mes titres et de mes terres. Reste qu'il s'agit là d'un décret royal. Dois-je accéder à sa requête ? Si je ne le fais pas, le royaume va saigner.\n\n#italic Or donc, mes possessions contre la paix ?#!"
 agot_bastard_event.0971.desc_give_up_claims:0 "Le sceau de la Maison [ruler_scope.GetHouse.GetBaseName] figure sur la lettre que j'ai reçu, envoyée par [ruler_scope.Custom('FR_le_Char')][ruler_scope.GetName]. Il n'y a aucun doute, aucun quiproquo ou interprétation erronée possible. Dans un acte de mansuétude, [ruler_scope.Custom('FR_IlElle')] exige que je fasse une déclaration publique afin d'abandonner toutes revendications que mon héritage pourrait me donner.\n\nUne telle exigence a eu de nombreux échos dans tout le royaume. Beaucoup pensent qu'il s'agit là d'une requête tout à fait juste. Néanmoins, renoncer à mes revendications peut représenter un camouflet infligé à mon honneur. Tandis qu'un refus amènera le royaume à saigner.\n\n#italic Or donc, ma fierté ou la paix ?#!"
 agot_bastard_event.0971.desc_nothing:0 "Jours et nuits je suis rongé[ROOT.Char.Custom('FR_E')] par mes pensées. M'imaginer quelle pourrait être la réponse [ruler_scope.Custom('FR_du_Char')][ruler_scope.GetName] suite aux révélations sur ma naissance accapare toute mon attention. Plusieurs semaines se sont écoulés, impossible qu'[ruler_scope.Custom('FR_IlElle')] n'en ai pas eu vent depuis lors.\n\nJe ne peux faire autrement qu'arriver à la conclusion qu'[ruler_scope.Custom('FR_IlElle')] a simplement laissé cette affaire en suspens. Quelle qu'en soit la raison, simple dédain ou désintérêt total, il semble qu'il n'y aura aucune exigence qui me parviendra de Port-Réal."
 agot_bastard_event.0980.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0980.a:0 "Une bien vicieuse requête !"
 agot_bastard_event.0981.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0981.a:0 "Une si sévère décision !"
 agot_bastard_event.0982.opening:0 "[ROOT.Char.Custom('FR_au_Char_P')|U][ROOT.Char.GetFullNameNoTooltip],"
 agot_bastard_event.0982.desc.male:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été sommé de revêtir l'habit noir en raison de la menace que son héritage peut représenter pour le royaume."
 agot_bastard_event.0982.desc.female:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été sommé de rejoindre les Sœurs du Silence en raison de la menace que son héritage peut représenter pour le royaume."
 agot_bastard_event.0982.a:0 "La simple naissance justifierait donc l'emprisonnement ? Ce n'est pas juste."
 agot_bastard_event.0984.a.courtier:0 "Cela semble être juste."
 agot_bastard_event.0984.a.landed:0 "Contraint[reveal_scope.Custom('FR_E')] de renoncer à ses possessions ? Fichtre."
 agot_bastard_event.0971.nw_army_for_claim:0 "Les hommes du Commandant"
 agot_bastard_event.0981.desc_resolved:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName], à la lumière des récentes informations, est désormais jugée comme une menace pour la Couronne et a été condamné[reveal_scope.Custom('FR_E')] à mort.\n\nTous ceux qui menaceront la sécurité du royaume partageront le même sort."
 agot_bastard_event.0982.desc_pending:0 "Tout seigneur et noble dame qui irait à l'encontre de cet ordre sera jugé coupable de trahison et puni en conséquence."
 agot_bastard_event.0982.desc_resolved:0 "La Couronne lui témoigne sa gratitude pour les services rendus et espère qu'[reveal_scope.Custom('FR_IlElle')] continuera à servir honorablement le royaume dans sa nouvelle affectation."
 agot_bastard_event.0983.desc_resolved:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été emprisonné[reveal_scope.Custom('FR_E')], et ce jusqu'à qu'il aura été certifié que son héritage ne représente pas un danger pour le royaume. Toute personne qui agirait dans le but de l'aider à s'évader sera considérée comme un traître à la Couronne et jugée en conséquence."
 agot_bastard_event.0985.desc_pending:0 "Tout seigneur et noble dame qui irait à l'encontre de cet ordre sera jugé coupable de trahison et puni en conséquence."
 agot_bastard_event.0985.desc_resolved:0 "Je m'engage à ce que cette menace soit résolue sans effusion de sang."
 agot_bastard_event.0985.desc:0 "Par la présente, vous êtes informé[ROOT.Char.Custom('FR_E')] que [reveal_scope.Custom('FR_le_Char')][reveal_scope.GetName] a été sommé de faire une déclaration publique afin de renoncer à toute revendication sur le trône et tout titre s'y afférant."
 agot_events_bastard.reveal_tt:0 "You will tell [reveal_scope.GetName] the truth about [reveal_scope.GetHerHis] heritage."
 agot_events_bastard.reveal_warning:0 "@warning_icon! #warning Cela pourrait avoir des implications majeures pour vous tout autant que pour le royaume.#!"
 agot_events_bastard.reveal_warning_letter:0 "Vous allez envoyer des missives aux quatre coins de Westeros.\n@warning_icon! #warning Cela pourrait avoir des répercussions majeures sur vous tout autant que sur le royaume.#!"
 agot_events_bastard.realm_ruler_react_wait:0 "Now to see how the realm, and [ruler_scope.GetFirstNameOrMe], react..."
 agot_events_bastard.host_response_choice:0 "It will be up to [reveal_employer.GetNameNoTooltip] to respond to your demand."
 agot_events_bastard.personal_response_choice:0 "It will be up to [reveal_scope.GetNameNoTooltip] to respond to your demand."
 agot_events_bastard.demand_reject_harsh:0 "This is an outrageous demand! This means war!"
 agot_events_bastard.demand_reject_light:0 "This is punishment for being born. I'll not stand for it."
 agot_events_bastard.demand_reject_flavor:0 "You will reject [ruler_scope.GetNamePossessiveNoTooltip] demand."
 agot_events_bastard.demand_reject_tt:0 "@warning_icon! #warning This will irrevocably put you on a path to war with the Iron Throne.#!"
 agot_events_bastard.demand_accept_harsh:0 "Though it pains me, I will accept for the sake of peace."
 agot_events_bastard.demand_accept_light:0 "I will accept [ruler_scope.GetNamePossessiveNoTooltip] relative mercy."
 agot_events_bastard.demand_accept_flavor:0 "You will accept [ruler_scope.GetNamePossessiveNoTooltip] demand."
 agot_events_bastard.unjust_warning_tt:0 "The realm may dislike demands deemed unjust."
 agot_events_bastard.no_demand_acknowledge:0 "A relief, to be sure."
 agot_events_bastard.0901.t:0 "Questions of Parentage"
 agot_events_bastard.0901.desc:0 "Every time I look at [reveal_scope.GetFirstName], I cannot help but think of the truth of [reveal_scope.GetHerHis] blood, and also the dangers present in such truths. Though I want [reveal_scope.GetHerHim] to live a long and carefree life, I must also acknowledge [reveal_scope.GetHerHis] whole life is built upon a lie. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood. I cannot be the author of this injustice any longer."
 agot_events_bastard.0901.desc.jon:0 "Every time I look at [reveal_scope.GetFirstName], I remember promises made and dangers long dormant, but I also see a child whose whole life is built upon a lie. \"Promise me Ned...\"\n\nNo. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth. I loved my sister, and I love her child as my own. She would not want [reveal_scope.GetHerHim] to have grown up not knowing the truth. Though it pains me, and may pain the realm moreso, I cannot be the author of this injustice any longer."
 agot_events_bastard.0901.a:0 "[reveal_scope.GetFirstNameNoTooltip], I must tell you, your true parents are..."
 agot_events_bastard.0901.a.jon:0 "[reveal_scope.GetFirstNameNoTooltip], the time has come for the truth. I am not your father..."
 agot_events_bastard.0901.b:0 "No, the time is not yet right for this."
 agot_events_bastard.0901.b.jon:0 "And yet I must. My guilt cannot outweigh the promise I made."
 agot_events_bastard.0902.t:0 "A Shocking Truth"
 agot_events_bastard.0902.desc.jon:0 "My father asks that I join him for a ride outside the castle, taking me to a grove of oaks where we dismount and sit. I have never seen him so anxious — he struggles to even look me in the eye.\n\nHe begins by telling me of the tourney at Harrenhal, of his sister, and of Robert's rebellion all those years ago. I start to wonder why he is telling me a story I have known for so long, yet as the extra details are added I cannot believe where this seems to be heading.\n\n\"There is no easy way to say this, so I will say it bluntly. [ROOT.Char.GetFirstNameNoTooltip], I have lied to you. I am not your father. Your true father was [real_father.GetName], and you were born in a bed of winter roses to my sister, Lyanna Stark. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth.\"\n\nThe oak leaves rustle in the wind. I want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0902.desc.father:0 "My father asks that I join him for a ride outside the castle, taking me to a grove deep in the forest. \"To not be overheard,\" he says sternly.\n\nWe dismount and sit. I have never seen him so anxious — he struggles to even look me in the eye.\"There is no easy way to say this, so I will say it bluntly. [ROOT.Char.GetFirstNameNoTooltip], your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth.\"\n\nThe leaves rustle in the wind. I want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0902.desc.mother:0 "My mother asks that I join her in the sitting room, taking me by the hand and shoeing the servants away. I have never seen her so anxious — she struggles to even look me in the eye.\n\n\"There is no easy way to say this, so I will say it bluntly. [ROOT.Char.GetFirstNameNoTooltip], your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth.\"\n\nI want to reject this revelation, scream into the sky that it isn't true, but in my heart I know it is. Either now, or into the future, I must decide what to do with it."
 agot_events_bastard.0902.a:0 "I will not hide from it. The whole world must know."
 agot_events_bastard.0902.b:0 "This is all too much! I need time to think."
 agot_events_bastard.0902.b.flavor:0 "You will be able to reveal the truth yourself later if you wish."
 agot_events_bastard.0903.t:0 "Questions of Parentage"
 agot_events_bastard.0903.desc:0 "Every time I think of [reveal_scope.GetFirstName], I cannot help but remember the truth of [reveal_scope.GetHerHis] blood, and also the dangers present in such truths. Though I want [reveal_scope.GetHerHim] to live a long and carefree life, I must also acknowledge [reveal_scope.GetHerHis] whole life is built upon a lie. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood. I cannot be the author of this injustice any longer."
 agot_events_bastard.0903.desc.jon:0 "I remember well the promises I made to Lady Lyanna and the oaths I swore to the Starks even before the rebellion. Perhaps this is not my decision to make, but I cannot help but think of the child whose whole life is built upon a lie.\n\nNo. It is not fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth. Though doubtless many will think it unfair of me, I must let the truth out. Though it pains me, and may pain the realm moreso, I cannot be the author of this injustice any longer."
 agot_events_bastard.0903.a:0 "I shall send a raven to [reveal_scope.GetFirstNameNoTooltip] directly."
 agot_events_bastard.0903.b:0 "The whole realm must know the truth of it!"
 agot_events_bastard.0903.c:0 "No. The truth must remain hidden for now."
 agot_events_bastard.0904.t:0 "A Shocking Truth"
 agot_events_bastard.0904.desc:0 "I open the letter with the seal of House [sharer.GetHouse.GetBaseName] without ceremony, but as I read the words enclosed my eyes widen in shock.\n\n\"There is no easy way to say this, so I will say it bluntly,\" [sharer.GetName] begins after the usual formalities, \"[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth.\"\n\nI drop the parchment onto the group in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0904.desc.blind:0 "I ask [courtier.GetFirstName] to read me the letter with the seal of House [sharer.GetHouse.GetBaseName] on it, but I may regret that, for as [courtier.GetSheHe] reads the words on the page my blind eyes widen in shock.\n\n\"There is no easy way to say this, so I will say it bluntly.\" [courtier.GetFirstNameNoTooltip] begins to read [sharer.GetNamePossessive] words after the usual formalities. \"[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception. I fear I have only made you trade one burden for a heavier one, but at least you can decide for yourself what to do with this truth.\"\n\n\"M-my [ROOT.Char.GetLadyLord] I...don't know what to say!\" [courtier.GetFirstNameNoTooltip] exclaims as I am stuck in shock. I want to reject this revelation, scream that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0904.a:0 "I will not hide from it. The whole world must know."
 agot_events_bastard.0904.b:0 "I must tell father! Or..[father.GetFirstNameNoTooltip]."
 agot_events_bastard.0904.b.flavor:0 "You will decide what to do together."
 agot_events_bastard.0904.c:0 "This is all too much! I need time to think."
 agot_events_bastard.0904.c.flavor:0 "You will be able to reveal the truth yourself later if you wish."
 agot_events_bastard.0904.d:0 "I shall not reveal this. I must let [sharer.GetFirstNameNoTooltip] know."
 agot_events_bastard.0904.d.flavor:0 "You will write back asking [sharer.GetFirstName] to keep your secret."
 agot_events_bastard.0905.t:0 "A Secret Kept...Known?"
 agot_events_bastard.0905.desc:0 "I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me. \"[ROOT.Char.GetFirstName]\" [reveal_scope.GetSheHe] begins to say, addressing me by my first name \"I already know. I've known for some time. I haven't yet revealed it but...I know.\" [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"
 agot_events_bastard.0905.desc.actually_parent:0 "I had been prepared for one of the most difficult conversations of my life. Practicing what I would say, the look I would give. I confirmed that the location would be secret and ensured that we wouldn't be overheard.\n\nYet as I begin to weave my tale [reveal_scope.GetFirstName] puts a hand up to stop me. \"Thank you\" [reveal_scope.GetSheHe] begins to say \"Thank you for telling me but...I already know. I've known for some time. I haven't yet revealed it but...I know.\" [reveal_scope.GetSheHe] says with a sigh.\n\nSuch a secret kept eating at me for such a long time, and [reveal_scope.GetSheHe] already knew?!"
 agot_events_bastard.0905.a:0 "I shall give you land then, to rule in my name as my child."
 agot_events_bastard.0905.a.flavor:0 "[reveal_scope.GetFirstName] may decide to reveal themselves at a later date..."
 agot_events_bastard.0905.b:0 "Then we must tell the realm!"
 agot_events_bastard.0905.c:0 "Then you know that the Night's Watch is the only safe place for you."
 agot_events_bastard.0905.d:0 "It is enough that you know. What to do with it is up to you."
 agot_events_bastard.0906.t:0 "Hidden Heritage"
 agot_events_bastard.0906.desc.open:0 "I see the anguished look across [reveal_scope.GetFirstNamePossessive] face as I reach the end of my tale, a long silence passing before [reveal_scope.GetSheHe] gives me a worded response. \"This changes nothing\" [reveal_scope.GetSheHe] says decidedly. \"I shall remain as I always have. I am simply [reveal_scope.GetNameNoTooltip].\"\n\nI am taken aback by [reveal_scope.GetHerHis] certainty"
 agot_events_bastard.0906.desc.fake:0 ", and somewhat touched that [reveal_scope.GetSheHe] would choose to keep me as [reveal_scope.GetHerHis] parent, and "
 agot_events_bastard.0906.desc.close:0 "yet...the threat remains.\n\nOn top of the pragmatic question, I cannot help but wonder if this is all a coping mechanism, and [reveal_scope.GetSheHe] would be better served by letting the truth out to the world."
 agot_events_bastard.0906.a:0 "I shall give you land, regardless, to rule in my name as my child."
 agot_events_bastard.0906.a.flavor:0 "[reveal_scope.GetFirstName] may decide to reveal themselves at a later date..."
 agot_events_bastard.0906.b:0 "We #bold must #!tell the realm!"
 agot_events_bastard.0906.c:0 "You must know that the Night's Watch is the only safe place for you."
 agot_events_bastard.0906.d:0 "It is enough that you know. What to do with it is up to you."
 agot_events_bastard.0907.t:0 "My Secret is Known"
 agot_events_bastard.0907.desc:0 "I open the letter with the seal of House [sharer.GetHouse.GetBaseName] without ceremony, but as I read the words enclosed my eyes widen in shock.\n\n\"There is no easy way to say this, so I will say it bluntly,\" [sharer.GetName] begins after the usual formalities, \"[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but I could not bring myself to continue the deception.\" They continue on with apologies and guidance, but I do not bother to finish. I let out a sigh. So someone else knows.\n\nI quickly burn the parchment in a nearby brazier while I ponder what to do with this. How should I deal with someone else knowing my secret?"
 agot_events_bastard.0907.desc.blind:0 "I ask [courtier.GetFirstName] to read me the letter with the seal of House [sharer.GetHouse.GetBaseName] on it, but I may regret that, for as [courtier.GetSheHe] reads the words on the page my blind eyes widen in shock.\n\n\"There is no easy way to say this, so I will say it bluntly.\" [courtier.GetFirstNameNoTooltip] begins to read [sharer.GetNamePossessive] words after the usual formalities. \"[ROOT.Char.GetFirstName], you have been lied to. Your true parents are [real_mother.GetName] and [real_father.GetName]. I was sworn to keep this secret, but-\" I hold up my hand to cut [courtier.GetFirstNameNoTooltip] off before [courtier.GetSheHe] is finished.\n\n\"M-my [ROOT.Char.GetLadyLord] you...you knew!\" [courtier.GetSheHe] exclaims, and I let out a sigh. Now it seems that not one, but two more people know. I must decide how to handle this."
 agot_events_bastard.0907.a:0 "This is getting out of hand. If the world must know, I shall tell them."
 agot_events_bastard.0907.b:0 "I must discuss these developments with [father.GetFirstNameNoTooltip]."
 agot_events_bastard.0907.b.flavor:0 "You will decide what to do together."
 agot_events_bastard.0907.c:0 "Hardly ideal...I need time to think."
 agot_events_bastard.0907.c.flavor:0 "You will be able to reveal the truth yourself later if you wish, but [sharer.GetName] may take matters into their own hands..."
 agot_events_bastard.0907.d:0 "I will write back asking [sharer.GetFirstNameNoTooltip] to keep my secret."
 agot_events_bastard.0908.t:0 "Requests for Discretion"
 agot_events_bastard.0908.desc:0 "It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply. It is not, though, the one I expect.\n\"Dear [ROOT.Char.GetFullName],\nThank you for your letter sharing what you know,\" [reveal_scope.GetSheHe] begins with indirect language, likely to avoid any incidents should the message be intercepted. \"While I thank you for your candor, I must humbly ask that you keep this information to yourself. It is for me to decide when, and if, I shall let these facts be known, and I would ask you to respect my privacy in this regard.\"\n\n[reveal_scope.GetName] has made [reveal_scope.GetHerHis] choice, at least for now. It is now for me to decide if I shall respect it."
 agot_events_bastard.0908.a:0 "No, the realm #bold must #!be told!"
 agot_events_bastard.0908.b:0 "I shall respect [reveal_scope.GetHerHis] wishes."
 agot_events_bastard.0909.t:0 "Revelations Unreplied"
 agot_events_bastard.0909.desc:0 "It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after months of waiting and a second letter sent to ensure delivery, I must face the fact that [reveal_scope.GetFirstNameNoTooltip] has not deigned to reply. Whether to support their own machinations or simply out of fear, I must now decide if I shall share what I know regardless."
 agot_events_bastard.0909.a:0 "The realm #bold must #!be told!"
 agot_events_bastard.0909.b:0 "It is [reveal_scope.GetHerHis] choice to do with as [reveal_scope.GetSheHe] wishes."
 agot_events_bastard.0910.t:0 "Consultations of Parentage."
 agot_events_bastard.0910.desc:0 "\"Father... [ROOT.Char.GetFirstName]\" [reveal_scope.GetFirstName] begins to say \"I have received a letter from [sharer.GetFullName]. It says that I am the offspring of [real_mother.GetName] and [real_father.GetName]. I need your guidance now. What should we do?\" [reveal_scope.GetSheHe] says, looking truly lost.\n\nSuch a secret kept eating at me for such a long time, and now [sharer.GetFirstNameNoTooltip] would tell [reveal_scope.GetFirstNameNoTooltip] just like that? Regardless, we must now deal with the consequences of their knowledge."
 agot_events_bastard.0910.a:0 "You must pen [sharer.GetLadyLord] [sharer.GetFirstNameNoTooltip] a letter asking for [sharer.GetHerHis] discretion."
 agot_events_bastard.0910.a.flavor:0 "You will help [reveal_scope.GetFirstNameNoTooltip] write back asking [sharer.GetFirstNameNoTooltip] to keep quiet."
 agot_events_bastard.0910.b:0 "We must tell the realm now, come what may."
 agot_events_bastard.0910.c:0 "The Night's Watch is the only safe place for you now."
 agot_events_bastard.0911.t:0 "Lies In Marriage "
 agot_events_bastard.0911.desc:0 "I knew this moment was coming since the day I promised Lyanna, but it still stings to hear the words. \"Liar!\" I'm called by my beloved Cat, and I can do little but hang my head in shame. \"So much for the honor of Eddard Stark! Honorable to everyone but to your wife it seems! I am supposed to be your confidant Ned!\" she yells before trailing off \" No...\" she laughs mirthfully \"No, you are more honorable in your vows to me than the world thought apparently.\" she trails off, her justified outburst calming, and I can think of nothing to say.\n\nShe looks back to me, tears in in her eyes. \"Family, Duty, Honor,\" she says it like a mantra, \"I know why you did it, Ned. A part of me is relieved. But damn it, I am your family too! You should have told me. This was not right. What the world thought of us. Of you. What I thought of [secret_target.GetHerHim].\" She looks down, now looking ashamed. \"This was not right,\" she repeats finally."
 agot_events_bastard.0911.a:0 "\"I'm sorry Cat...\""
 agot_events_bastard.0912.t:0 "Questions of Parentage"
 agot_events_bastard.0912.desc:0 "Every time I look at [reveal_scope.GetFirstName], I think of the truth of [reveal_scope.GetHerHis] blood, and also the dangers present in such truths. It is very possible that [reveal_scope.GetSheHe] will live a long and carefree life without ever learning that [reveal_scope.GetHerHis] whole life is built upon a lie. Is it fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood? Perhaps I should tell [reveal_scope.GetHerHim] the truth. Besides, there may be advantage in it..."
 agot_events_bastard.0912.a:0 "[reveal_scope.GetFirstNameNoTooltip], your true parents are..."
 agot_events_bastard.0912.b:0 "No, now is not the time for this revelation."
 agot_events_bastard.0913.t:0 "A Shocking Truth"
 agot_events_bastard.0913.desc:0 "[employer.GetFullName] asks that I join [employer.GetHerHim] in [employer.GetHerHis] study late one night, and though we have spoken a few times before, I am still nervous when I open the door. [employer.GetSheHe|U] looks strangely awkward as I step in, but nothing prepares me for what [employer.GetSheHe] says next.\n\n\"[ROOT.Char.GetFirstName], it is time you knew the truth. Your true parents are [real_mother.GetName] and [real_father.GetName]. This secret was kept hidden from you for some time, and once I found out I believed it only proper that you know.\"\n\nI want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0913.a:0 "I will not hide from it. The whole world must know."
 agot_events_bastard.0913.b:0 "This is all too much! I need time to think."
 agot_events_bastard.0913.b.flavor:0 "You will be able to reveal the truth yourself later if you wish."
 agot_events_bastard.0914.t:0 "A Truth...Known?"
 agot_events_bastard.0914.desc:0 "I ask that [reveal_scope.GetFirstName] joins me in my study late one night, and though we have spoken a few times before, I am still somewhat apprehensive about their reaction when I open the door to invite them in.\n\nI confirmed that we would not be overheard before I begin to speak, yet as I begin to weave my tale [reveal_scope.GetFirstNameNoTooltip] puts a hand up to stop me. \"[ROOT.Char.GetFirstNameNoTooltip]\" [reveal_scope.GetSheHe] begins to say, addressing me by my first name \"I already know. I've known for some time. I haven't yet revealed it but...I know.\" [reveal_scope.GetSheHe] says with a sigh."
 agot_events_bastard.0914.a:0 "I shall give you land regardless, in honor of our kinship."
 agot_events_bastard.0914.a.flavor:0 "[reveal_scope.GetFirstName] may decide to reveal themselves at a later date..."
 agot_events_bastard.0914.b:0 "Then we must tell the realm!"
 agot_events_bastard.0914.c:0 "Then you know that the Night's Watch is the only safe place for you."
 agot_events_bastard.0914.d:0 "It is enough that you know. What to do with it is up to you."
 agot_events_bastard.0915.t:0 "A Truth Revealed"
 agot_events_bastard.0915.desc:0 "[reveal_scope.GetName] is silent for a long time. I can see [reveal_scope.GetHerHis] thoughts dancing across [reveal_scope.GetHerHis] face. Confusion. Happiness. Fear. \"So...\" [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says \"This will change things, won't it?\".\n\nWith that, there were plans to be made. [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know, and consequences to face."
 agot_events_bastard.0916.t:0 "A Request From Lessers"
 agot_events_bastard.0916.desc:0 "[reveal_scope.GetName] is silent for a long time. I can see [reveal_scope.GetHerHis] thoughts dancing across [reveal_scope.GetHerHis] face. Confusion. Happiness. Fear. \"So...\" [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says \"This changes nothing. I am simply [reveal_scope.GetNameNoTooltip], whatever my birth.\".\n\nI study [reveal_scope.GetHerHis] face, and [reveal_scope.GetSheHe] seems resolute in [reveal_scope.GetHerHis] answer. Fascinating. Still, I am [reveal_scope.GetHerHis] host, and privy to the secret besides. If I wanted, I could choose how we respond."
 agot_events_bastard.0916.a:0 "I shall give you land regardless, in honor of our kinship."
 agot_events_bastard.0916.a.flavor:0 "[reveal_scope.GetFirstName] may decide to reveal themselves at a later date..."
 agot_events_bastard.0916.b:0 "No, we must tell the realm!"
 agot_events_bastard.0916.c:0 "The Night's Watch is the only safe place for you. You shall depart tomorrow."
 agot_events_bastard.0916.d:0 "It is enough that you know. What to do with it is up to you."
 agot_events_bastard.0917.t:0 "Questions of Parentage"
 agot_events_bastard.0917.desc:0 "Truthfully, I do not think on [reveal_scope.GetFirstNamePossessive] bloodline all that often. Now that we are both at [ROOT.Char.GetCurrentLocation.GetCounty.GetName] though, seeing [reveal_scope.GetHerHim] in person, I cannot get it out of my mind.\n\n[reveal_scope.GetHerHis|U] face does so look like them. Is it fair to [reveal_scope.GetHerHim] that [reveal_scope.GetSheHe] should live and die without ever knowing the truth of [reveal_scope.GetHerHis] royal blood? Perhaps I should tell [reveal_scope.GetHerHim] the truth. Besides, there may be advantage in it..."
 agot_events_bastard.0917.a:0 "[reveal_scope.GetFirstName], I need to talk to you."
 agot_events_bastard.0917.a_tt:0 "You will tell [reveal_scope.GetName] the truth about [reveal_scope.GetHerHis] heritage. As a guest here, you will not be able to influence [reveal_scope.GetFirstNamePossessiveNoTooltip] use of this information."
 agot_events_bastard.0917.b:0 "No, now is not the time for this revelation."
 agot_events_bastard.0918.t:0 "A Shocking Truth"
 agot_events_bastard.0918.desc:0 "[sharer.GetFullName], currently visiting [ROOT.Char.GetCurrentLocation.GetCounty.GetName], discretely asks that I join [sharer.GetHerHim] on a walk later this evening. Failing to see any reason to decline, I accept [sharer.GetHerHis] invitation.\n\nAs I watch [sharer.GetHerHim] approach, something in [sharer.GetHerHis] baring makes me strangely nervous. [sharer.GetSheHe|U] seems strangely tense, yet steps beside me without issue. We make small talk for a time, but as we fall out of earshot of the keep [sharer.GetSheHe] grows serious.\n\n\"[ROOT.Char.GetFirstName], it is time you knew the truth. Your true parents are [real_mother.GetName] and [real_father.GetName]. I do not know how many people know of this, but seeing you earlier I felt compelled to share it.\"\n\nI want to reject this revelation, scream into the wind that it isn't true, but in my heart I know it is. The only question is what to do with it."
 agot_events_bastard.0918.a:0 "I will not hide from it. The whole world must know."
 agot_events_bastard.0918.b:0 "This is all too much! I need time to think."
 agot_events_bastard.0918.b.flavor:0 "You will be able to reveal the truth yourself later if you wish."
 agot_events_bastard.0919.t:0 "A Truth...Known?"
 agot_events_bastard.0919.desc:0 "I ask that [reveal_scope.GetFirstName] joins me on a walk later that evening, and though nothing compared to what I'm sure will be a great shock to [reveal_scope.GetHerHim], I am still somewhat apprehensive about [reveal_scope.GetHerHis] reaction when I see [reveal_scope.GetHerHim] waiting for me.\n\nI looked over my shoulder to confirm that we would not be overheard before I began to speak, yet as I begin to weave my tale [reveal_scope.GetFirstNameNoTooltip] puts a hand up to stop me. \"[ROOT.Char.GetFirstName]\" [reveal_scope.GetSheHe] begins to say \"I already know. I've known for some time. I haven't yet revealed it but...I know.\" [reveal_scope.GetSheHe] says with a sigh. \"For my own reasons, I request that you keep this secret to yourself\"."
 agot_events_bastard.0919.a:0 "This will not do! I shall tell the realm."
 agot_events_bastard.0919.a.flavor:0 "You sneak away to send letters of to every court in Westeros.\n@warning_icon!#warning This may have major implications for yourself and the realm.#!."
 agot_events_bastard.0919.b:0 "It is enough that you know. What to do with it is up to you."
 agot_events_bastard.0920.t:0 "A Shocking Truth"
 agot_events_bastard.0920.desc:0 "I am working later than usual when I receive a short knock at my study door. \"Enter,\" I say simply, expecting the maids to be checking in on me, but instead [learned_person.GetFirstName] steps through the door. \"Forgive me my [ROOT.Char.GetLadyLord|U] I... wanted to find you at a time when we would not be disturbed.\" [learned_person.GetSheHe|U] says nervously as I put down my quill to give [learned_person.GetHerHim] my full attention.\n\nWith a sigh [learned_person.GetSheHe] begins \"Facts have come up in my research. Facts that... have some rather drastic implications for you... and for the realm.\" [learned_person.GetSheHe] continues, and as [learned_person.GetHerHis] story unfolds I find myself stunned into silence, whatever previous matter I was writing on completely forgotten. [learned_person.GetNameNoTooltip] says that previously undiscovered documents reveal that my true parents are in fact [real_mother.GetName] and [real_father.GetName]!\n\nI do not believe it, and yet as [learned_person.GetFirstNameNoTooltip] lays out the evidence in front of me I am forced to accept that this is indeed reality."
 agot_events_bastard.0920.a:0 "If this is the truth, then I must tell the realm."
 agot_events_bastard.0920.b:0 "I don't want it. This knowledge must be kept secret."
 agot_events_bastard.0951.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0951.first_person:0 "I am writing to all the lords of Westeros to let them know the truth that has been hidden for too long. Despite what you may have thought, I was in fact born to the union of [real_mother.GetName] and [real_father.GetName]. I ask that you, and the rest of the realm, recognize this new reality and the implications it brings."
 agot_events_bastard.0951.third_person:0 "I am writing to all the lords of Westeros to let them know the truth that has been hidden for too long. Despite what you may have thought, [reveal_scope.GetName] was in fact born to the union of [real_mother.GetName] and [real_father.GetName]. I ask that you, and the rest of the realm, recognize this new reality and the implications it brings."
 agot_events_bastard.0951.a:0 "Well, that is certainly interesting."
 agot_events_bastard.0951.b:0 "I can't believe they would reveal this!"
 agot_events_bastard.0952.t:0 "A Truth Revealed"
 agot_events_bastard.0952.desc:0 "[reveal_scope.GetName] is silent for a long time. I can see [reveal_scope.GetHerHis] thoughts dancing across [reveal_scope.GetHerHis] face. Confusion. Happiness. Fear. \"So...\" [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says \"This will change things, won't it?\".\n\nThere were hugs, there were tears. The family was certainly shocked. But [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know."
 agot_events_bastard.0952.desc.jon:0 "[reveal_scope.GetName] is silent for a long time. I can see [reveal_scope.GetHerHis] thoughts dancing across [reveal_scope.GetHerHis] face. Confusion. Happiness. Fear. \"Lyanna...\" [reveal_scope.GetSheHe] exhales at last, but remains staring at the floor.\n\nI search [reveal_scope.GetHerHis] face for what feels like a day before [reveal_scope.GetSheHe] turns to me and says \"This will change things, won't it?\".\n\nThere were hugs, there were tears. The family was certainly shocked. But [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know."
 agot_events_bastard.0953.t:0 "A Truth Revealed"
 agot_events_bastard.0953.desc:0 "[reveal_scope.GetName] is silent for a long time after handing me the letter from [sharer.GetFullName]. It tells of the truth. That [reveal_scope.GetFirstNameNoTooltip] was born of [real_mother.GetName] and [real_father.GetName]. Such a secret I held close for so long that it was not even I who could tell it to them.\n\nThere were hugs, there were tears. The family was certainly shocked. But [reveal_scope.GetFirstNameNoTooltip] has made [reveal_scope.GetHerHis] decision. The realm is to know."
 agot_events_bastard.0954.t:0 "A Truth Revealed"
 agot_events_bastard.0954.desc:0 "[reveal_scope.GetName] is silent for a long time after handing me the letter from [sharer.GetFullName]. It tells of the truth. That [reveal_scope.GetFirstNameNoTooltip] was born of [real_mother.GetName] and [real_father.GetName]. What's worse, copies have been sent to all the realm!\n\nSuch a secret I held close for so long that it was not even I who could reveal it.\n\nThere were hugs, there were tears. This should rightfully have been [reveal_scope.GetHerHis] decision, but [sharer.GetFirstNameNoTooltip] has robbed us of that option. Regardless, it has been done. Though it was neither I nor [reveal_scope.GetFirstNamePossessiveNoTooltip] decision, the realm is to know."
 agot_events_bastard.0955.t:0 "A Truth Revealed"
 agot_events_bastard.0955.desc:0 "It has been some time since I sent a letter to [reveal_scope.GetFirstName], and though every day I have asked if I have received a reply, or notice sent to the realm, I have received no word as yet.\n\nAt last, after weeks of waiting, a page tells me that I have received a reply.\n\n\"Dear [ROOT.Char.GetFullNameNoTooltip],\" [reveal_scope.GetSheHe] begins \"I thank you for your candor, and I write to you in advance to let you know that I shall be writing to the realm in the coming days revealing that which you told me.\"\n\nIt seems [reveal_scope.GetNameNoTooltip] has made their choice, and I feel a weight leave my shoulders."
 agot_events_bastard.0955.a:0 "Now to see how they, and [ruler_scope.GetFirstNameOrMe], react..."
 agot_events_bastard.0956.t:0 "A Truth Revealed"
 agot_events_bastard.0956.desc:0 "After receiving [revealer.GetFirstNamePossessive] letter, my life has divided into two. Before this, and after. I am silent, unable to process that what is in front of me is now in front of the whole realm. It tells of the truth. That I was born of [real_mother.GetName] and [real_father.GetName]. What's worse, copies have been sent to all the realm!\n\nSuch a secret I held close for so long that it was not even I who could reveal it.\n\nThis should rightfully have been my decision, but [sharer.GetFirstNameNoTooltip] has robbed me of that option. Regardless, it has been done. Though it was not my desire, the realm is to know."
 agot_events_bastard.0956.a:0 "Now to see how they, and [ruler_scope.GetFirstName], react..."
 agot_events_bastard.0957.t:0 "A Truth Revealed"
 agot_events_bastard.0957.desc:0 "I look down into my hands and feel my life shatter to pieces. I cannot breathe and I feel my vision start to fade, barely retaining consciousness of what is in front of me. My life has divided into two. Before this, and after.\n\nThis letter tells of the truth. That I was born of [real_mother.GetName] and [real_father.GetName]. What's worse, copies have been sent to all the realm!\n\nMy entire life has been a lie. I should have been told! This was not right!"
 agot_events_bastard.0957.a:0 "Now to see how they, and [ruler_scope.GetFirstName], react..."
 agot_events_bastard.0958.t:0 "A Truth Revealed"
 agot_events_bastard.0958.desc.bastard:0 "The ravens are sent. The messages, delivered. The truth, known.\n\nThough many will curse me for revealing such a grand secret, for better or worse the truth is out there. Perhaps I may play a great role in the days to come. Perhaps all of this will come to naught. Whatever the case, my true bloodline is now acknowledged by all, for good or ill."
 agot_events_bastard.0958.desc.host:0 "The ravens are sent. The messages, delivered. The truth, known.\n\nThough many will curse me for revealing such a grand secret, for better or worse the truth is out there. Perhaps I may play a great role in the days to come. Perhaps all of this will come to naught. Whatever the case, [reveal_scope.GetFirstNamePossessive] true bloodline is now acknowledged by all, for good or ill."
 agot_events_bastard.0958.desc.else:0 "The ravens are sent. The messages, delivered. The truth, known.\n\nThough many will curse me for revealing such a grand secret, for better or worse the truth is out there. Perhaps I may play a great role in the days to come. Perhaps this is where my part ends. Whatever the case, [reveal_scope.GetFirstNamePossessive] true bloodline is now acknowledged by all, for good or ill."
 agot_events_bastard.0959.t:0 "A Bastard of Royal Blood"
 agot_events_bastard.0959.desc_opening:0 "I am sitting on the Iron Throne, court assembled before me, ruling on a trivial dispute between minor lords when [courtier.GetFullName] bursts through the door with a yell of \"Your Grace!\".\n\n\"What is the meaning of this interruption?!\""
 agot_events_bastard.0959.desc_opening_wrathful:0 "I yell as the court turns to the panting [courtier.GetFirstNameNoTooltip]. [courtier.GetSheHe|U] quickly steps before the throne and kneels.\n\n"
 agot_events_bastard.0959.desc_opening_not_wrathful:0 "[council.GetName] yells as the court turns to the panting [courtier.GetFirstNameNoTooltip]. [courtier.GetSheHe|U] quickly steps before the throne and kneels.\n\n"
 agot_events_bastard.0959.desc_opening_end:0 "\"I'm terribly sorry for the intrusion your Grace, but you must read this immediately!\" [courtier.GetSheHe] says, offering a parchment with the seal of House [revealer.GetHouse.GetBaseName].\n\n"
 agot_events_bastard.0959.desc.landed:0 "As the Grand Maester reads out the letter, I cannot contain my surprise. It claims that [reveal_scope.GetFullName] is in fact the [reveal_scope.Custom('GetDaughterSon')] of [real_father.GetFullName] and [real_mother.GetFullName]! What's more, it's like to have been sent to all the realm!"
 agot_events_bastard.0959.desc.courtier:0 "As the Grand Maester reads out the letter, I cannot contain my surprise. It claims that [reveal_scope.GetName], presently at the court of [reveal_employer.GetFullName], is in fact the [reveal_scope.Custom('GetDaughterSon')] of [real_father.GetFullName] and [real_mother.GetFullName]! What's more, it's like to have been sent to all the realm!"
 agot_events_bastard.0959.desc.ned_revealer:0 "As the Grand Maester reads out the letter, I cannot contain my surprise. It claims that [reveal_scope.GetName], presently at the court of [reveal_employer.GetFullName], is in fact the [reveal_scope.Custom('GetDaughterSon')] of [real_father.GetFullName] and [real_mother.GetFullName]! What's more, it's like to have been sent to all the realm!\n\n\"There is more your Grace.\" [courtier.GetFirstNameNoTooltip] says, as though any other news could compare, and offers a second parchment. \"It addressed to you specifically.\""
 agot_events_bastard.0959.desc.robert:0 "As the Grand Maester reads out the letter, I cannot contain my surprise. It claims that [reveal_scope.GetName], presently at the court of [reveal_employer.GetFullName], is in fact the [reveal_scope.Custom('GetDaughterSon')] of [real_father.GetFullName] and [real_mother.GetFullName]! What's more, it's like to have been sent to all the realm!\n\n\"There is more your Grace.\" [courtier.GetFirstNameNoTooltip] says, as though any other news could compare, and offers a second parchment. \"It is from Lord Eddard Stark.\""
 agot_events_bastard.0959.desc.king_revealer:0 "The ravens have been sent, the realm notified, and as expected, it is the first point I am asked to rule on when I sit the Iron Throne in the morning. Though the revelation that [reveal_scope.GetName] is in fact the child of [real_father.GetFullName] and [real_mother.GetFullName] was indeed shared by me, all eyes are waiting on my next word. \n\nNamely, how am I going to rule on this revelation?"
 agot_events_bastard.0959.robert:0 "Give it here then!"
 agot_events_bastard.0959.a:0 "I must respond to this claimant with force!"
 agot_events_bastard.0959.a.flavor:0 "You will rule harshly on this matter."
 agot_events_bastard.0959.b:0 "I must respond, but let's not be rash."
 agot_events_bastard.0959.b.flavor:0 "You will rule lightly on this matter."
 agot_events_bastard.0959.c:0 "It is of no consequence. I shall say naught on this."
 agot_events_bastard.0959.c.flavor:0 "You will not respond to this development."
 agot_events_bastard.0960.t:0 "A Plea from a Friend"
 agot_events_bastard.0960.desc.ned_revealer:0 "I feel my heart sink as I am handed the second letter, peeling open the seal of House Stark with shaking fingers. \"Oldest Friend,\" it begins, and already I can feel my throat close with emotion.\n\n\"I know you better than anyone, and I know the rage, sorrow, and betrayal that this news has foisted on your heart. For this, I am sorry beyond words. I had long wished to tell you in better circumstances, but I could live with the lie no longer.\" I feel my fists clench as I continue to read, trying and failing to not bare my heart in front of the court.\n\n\"Despite this, I hope that I may still reach out to and regard you as a friend. Perhaps I do not deserve to entreat you as such anymore, but for the love I bear both you and my sister's child I must try. I know you Robert, and I know well your wrath. Well did we both love Lyanna, and it is in her name I ask you to show mercy. This is not the last of the dragonspawn, but the last of a woman we both loved. For the sake of her memory, please show mercy to her child.\nEver your friend, Eddard Stark.\"\n\nI blink the tears nearly formed in my eyes away and the court comes into focus. They are waiting for my answer."
 agot_events_bastard.0960.desc:0 "I feel my heart sink as I am handed the second letter, peeling open the seal of House Stark with shaking fingers. \"Oldest Friend,\" it begins, and already I can feel my throat close with emotion.\n\n\"I know you better than anyone, and I know the rage, sorrow, and betrayal that this news has foisted on your heart. For this, I am sorry beyond words. I had long wished to tell you in better circumstances, but circumstances have moved beyond my control.\" I feel my fists clench as I continue to read, trying and failing to not bare my heart in front of the court.\n\n\"Despite this, I hope that I may still reach out to and regard you as a friend. Perhaps I do not deserve to entreat you as such anymore, but for the love I bear both you and my sister's child I must try. I know you Robert, and I know well your wrath. Well did we both love Lyanna, and it is in her name I ask you to show mercy. This is not the last of the dragonspawn, but the last of a woman we both loved. For the sake of her memory, please show mercy to her child.\nEver your friend, Eddard Stark.\"\n\nI blink the tears nearly formed in my eyes away and the court comes into focus. They are waiting for my answer."
 agot_events_bastard.0960.a:0 "No other man has ever known such a betrayal!"
 agot_events_bastard.0960.b.son:0 "My rage is immense, but I will not butcher Lyanna's babe."
 agot_events_bastard.0960.b.daughter:0 "My rage is immense, but I will not butcher the daughter of Lyanna."
 agot_events_bastard.0960.c:0 "It was so many years ago now...I will not act against those I love."
 agot_events_bastard.0960.c.flavor:0 "You will not respond to this development."
 agot_events_bastard.0961.t:0 "A Harsh Response"
 agot_events_bastard.0961.desc:0 "I look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond, how I rule. Such blatant assertion of a claim to the throne warrants a response even to the most moderate of rulers — and that, I am not.\n\nHow, then, should I answer this implicit challenge?"
 agot_events_bastard.0961.a:0 "I shall have both of their heads on a spike!"
 agot_events_bastard.0961.a.flavor:0 "You will demand both [reveal_scope.GetFirstName] and [reveal_employer.GetFirstNamePossessive] heads!"
 agot_events_bastard.0961.b:0 "I shall have [reveal_scope.GetHerHis] head!"
 agot_events_bastard.0961.c.nw:0 "He shall join the Night's Watch! Only then may he live!"
 agot_events_bastard.0961.c.ss:0 "She must join the Sisterhood! Only then may she live!"
 agot_events_bastard.0961.d:0 "The only safe place for such blood is in my dungeon!"
 agot_events_bastard.0962.t:0 "A Moderate Response"
 agot_events_bastard.0962.desc:0 "I look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond, how I rule. Though such a claim doubtless represents a threat, [reveal_scope.GetName] has not acted against me yet, and does not deserve to be punished as though they have. How, then, should I answer this news?"
 agot_events_bastard.0962.a.nw:0 "He shall be allowed to live out his days at the Wall."
 agot_events_bastard.0962.a.ss:0 "She shall be allowed to join the Silent Sisters."
 agot_events_bastard.0962.b:0 "[reveal_scope.GetSheHe|U] must be placed under arrest."
 agot_events_bastard.0962.c:0 "[reveal_scope.GetName] may join court, to note their new station."
 agot_events_bastard.0962.d:0 "[reveal_scope.GetName] must state [reveal_scope.GetSheHe] has no claim, that is enough."
 agot_events_bastard.0963.t:0 "A New [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]?"
 agot_events_bastard.0963.desc.jon:0 "I am seated on the throne, ruling as I do, when a queer piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen with shock.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, of [reveal_scope.GetDynasty.GetBaseName] blood like me! Born to a union of [real_father.GetFullName] and [real_mother.GetFullName] during the War of the Usurper, [reveal_scope.GetSheHe] is now known to be of royal descent!\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though such a claim doubtless represents a threat, [reveal_scope.GetNameNoTooltip] has not acted against me, and is in fact my kin, baseborn or no. How, then, should I answer this news?"
 agot_events_bastard.0963.desc.my_son:0 "I am seated on the throne, ruling as I do, when a shocking piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen and my mouth nearly drops to the floor.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, my very own child! Born from my union with [real_mother.GetFullName], [reveal_scope.GetSheHe] is now known to be of royal descent to all the realm.\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though the emergence of an unknown son doubtless represents a threat to my power, [reveal_scope.GetNameNoTooltip] has not acted against me. How, then, should I answer this news?"
 agot_events_bastard.0963.desc.my_daughter:0 "I am seated on the throne, ruling as I do, when a shocking piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen and my mouth nearly drops to the floor.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, my very own child! Born from my union with [real_mother.GetFullName], [reveal_scope.GetSheHe] is now known to be of royal descent to all the realm.\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though the emergence of an unknown daughter doubtless represents a threat to my power, [reveal_scope.GetNameNoTooltip] has not acted against me, and is a woman besides. How, then, should I answer this news?"
 agot_events_bastard.0963.desc:0 "I am seated on the throne, ruling as I do, when a queer piece of news is offered to me in the seal of House [revealer.GetHouse.GetBaseName]. As I read, my eyes widen with shock.\n\nIt appears that [reveal_scope.GetFullName] is, in fact, of [reveal_scope.GetDynasty.GetBaseName] blood like me! Born to a union of [real_father.GetFullName] and [real_mother.GetFullName], [reveal_scope.GetSheHe] is now known to be of royal descent.\n\nI look up from the parchment I was handed to a sea of expectant faces. They're waiting to see how I respond to this bit of family drama. Though such a claim doubtless represents a threat, [reveal_scope.GetNameNoTooltip] has not acted against me, and is in fact my kin, baseborn or no. How, then, should I answer this news?"
 agot_events_bastard.0963.a.nw:0 "He shall be allowed to live out his days at the Wall."
 agot_events_bastard.0963.a.ss:0 "She shall be allowed to join the Silent Sisters."
 agot_events_bastard.0963.b:0 "[reveal_scope.GetSheHe|U] must be placed under arrest."
 agot_events_bastard.0963.c:0 "[reveal_scope.GetNameNoTooltip] may join court, to note [reveal_scope.GetHerHis] new station."
 agot_events_bastard.0963.c.flavor:0 "You may confer additional honors to them if they accept."
 agot_events_bastard.0963.d:0 "[reveal_scope.GetNameNoTooltip] must state [reveal_scope.GetSheHe] has no claim, that is enough."
 agot_events_bastard.0970.t_execution_both:0 "A Tyrannous Demand"
 agot_events_bastard.0970.t_execution_bastard:0 "A Mortal Demand"
 agot_events_bastard.0970.t_send_to_order:0 "A Harsh Demand"
 agot_events_bastard.0970.t_imprison:0 "A Dark Demand"
 agot_events_bastard.0970.t_bring_to_court:0 "A Custody Demand"
 agot_events_bastard.0970.t_give_up_claims:0 "A Clear Demand"
 agot_events_bastard.0970.t_nothing:0 "No News is Good News?"
 agot_events_bastard.0970.desc_execution_both:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has not just demanded [reveal_scope.GetFirstNamePossessive] head, but my own as well!\n\nThis incredible demand has echoed across the realm as evidence of [ruler_scope.GetTitledFirstNamePossessiveNoTooltip] tyranny, yet the fact remains that it is a royal decree. I could not possibly acquiesce to this demand, could I? And yet, if I do not, the realm will surely bleed.\n\nWhat shall it be, two heads, or thousands?"
 agot_events_bastard.0970.desc_execution_bastard:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded [reveal_scope.GetFirstNamePossessive] head, to be taken immediately in the name of the crown.\n\nThis harsh demand has echoed across the realm, its severity disturbing many, yet the fact remains that it is a royal decree. Do I acquiesce to this demand? Could I? And yet, if I do not, the realm will surely bleed.\n\nWhat shall it be, one head, or thousands?"
 agot_events_bastard.0970.desc_send_to_nw:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded [reveal_scope.GetFirstName] be sent to the Night's Watch, to live out [reveal_scope.GetHerHis] days in the frozen north.\n\nThis demand has echoed across the realm, its severity disquieting many, yet the fact remains that it is a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, one life, or thousands?"
 agot_events_bastard.0970.desc_send_to_ss:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded [reveal_scope.GetFirstName] be sent to the Silent Sisters, to live out [reveal_scope.GetHerHis] days in religious service.\n\nThis demand has echoed across the realm, its severity disquieting many, yet the fact remains that it is a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, one life, or thousands?"
 agot_events_bastard.0970.desc_imprison:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded [reveal_scope.GetFirstName] be sent to [ruler_scope.GetHerHis] dungeon, to live out [reveal_scope.GetHerHis] days in chains until [ruler_scope.GetSheHe] rules otherwise.\n\nThis demand has echoed across the realm, and it holds the force of a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, one life, or thousands?"
 agot_events_bastard.0970.desc_bring_to_court:0 "A letter has arrived, bearing the seal of House [ruler_scope.GetHouse.GetBaseName]. The letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded [reveal_scope.GetFirstName] be moved from my own keep to live at the capital under [ruler_scope.GetHerHis] watch, to live out [reveal_scope.GetHerHis] days as a courtier.\n\nThis demand has echoed across the realm, and it holds the force of a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, one courtier, or peace?"
 agot_events_bastard.0970.desc_give_up_claims:0 "A letter has arrived, bearing the seal of House [ruler_scope.GetHouse.GetBaseName]. The letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetName] has demanded, in [ruler_scope.GetHerHis] mercy, for [reveal_scope.GetFirstName] to make a public and legal declaration absconding any claim [reveal_scope.GetHerHis] revealed heritage may represent.\n\nThis demand has been sent across the realm, and many believe that it is a just answer to recent developments. Still, it is a stain on one's honor to give up claims rightfully theirs should the wheels of fate turn.\n\nWhat shall it be then, pride or peace?"
 agot_events_bastard.0970.desc_nothing:0 "For days and nights I have stressed and strained over what [ruler_scope.GetName] may do in response to these revelations, yet it has been weeks now since the truth of [reveal_scope.GetNamePossessive] birth was sent to the realm. Surely [ruler_scope.GetSheHe] must have heard by now?\n\nI am forced to conclude that [ruler_scope.GetTitledFirstNameNoTooltip] has simply decided to let this matter rest. Whether simply beneath [ruler_scope.GetHerHis] notice at this moment or [ruler_scope.GetSheHe] just does not care, it seems that there will be no demands coming from King's Landing."
 agot_events_bastard.0971.t_execution_bastard:0 "$agot_events_bastard.0970.t_execution_bastard$"
 agot_events_bastard.0971.t_send_to_order:0 "$agot_events_bastard.0970.t_send_to_order$"
 agot_events_bastard.0971.t_imprison:0 "$agot_events_bastard.0970.t_imprison$"
 agot_events_bastard.0971.t_bring_to_court:0 "$agot_events_bastard.0970.t_bring_to_court$"
 agot_events_bastard.0971.t_give_up_claims:0 "$agot_events_bastard.0970.t_give_up_claims$"
 agot_events_bastard.0971.t_nothing:0 "$agot_events_bastard.0970.t_nothing$"
 agot_events_bastard.0971.desc_execution_bastard:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded my head, to be taken immediately in the name of the crown.\n\nThis harsh demand has echoed across the realm, its severity disturbing many, yet the fact remains that it is a royal decree. Could I possibly acquiesce to this demand? Give up my own life? And yet, if I do not, the realm will surely bleed.\n\nWhat shall it be then, my life, or thousands of others?"
 agot_events_bastard.0971.desc_send_to_nw:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded I join the Night's Watch, to live out my days in the frozen north.\n\nThis demand has echoed across the realm, its severity disquieting many, yet the fact remains that it is a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, my life, or thousands?"
 agot_events_bastard.0971.desc_send_to_ss:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded that I be sent to the Silent Sisters, to live out my days in religious service.\n\nThis demand has echoed across the realm, its severity disquieting many, yet the fact remains that it is a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, my life, or thousands?"
 agot_events_bastard.0971.desc_imprison:0 "Dark wings bear dark words, covered in the seal of House [ruler_scope.GetHouse.GetBaseName]. A letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded that I submit to imprisonment in [ruler_scope.GetHerHis] dungeon, to live out my days in chains until [ruler_scope.GetSheHe] rules otherwise.\n\nThis demand has echoed across the realm, and it holds the force of a royal decree. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, my freedom, or peace?"
 agot_events_bastard.0971.desc_bring_to_court:0 "A letter has arrived, bearing the seal of House [ruler_scope.GetHouse.GetBaseName]. The letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe|U] has demanded that I give up my lands and titles to join [ruler_scope.GetHerHis] court, where I will live my life as a courtier.\n\nThis demand has echoed across the realm, and though it spares me, I am a landed [ROOT.Char.GetLadyLord] of the realm, and this demand has not been without controversy. Do I acquiesce to this demand? If I do not, the realm will surely bleed.\n\nWhat shall it be then, my lands, or peace?"
 agot_events_bastard.0971.desc_give_up_claims:0 "A letter has arrived, bearing the seal of House [ruler_scope.GetHouse.GetBaseName]. The letter from [ruler_scope.GetName] bears no misunderstanding or misinterpretation. [ruler_scope.GetSheHe] has demanded, in [ruler_scope.GetHerHis] mercy, for me to make a public and legal declaration absconding any claim my revealed heritage may represent.\n\nThis demand has been sent across the realm, and many believe that it is a just answer to recent developments. Still, it is a stain on one's honor to give up claims rightfully theirs should the wheels of fate turn.\n\nWhat shall it be then, my pride, or peace in the realm?"
 agot_events_bastard.0971.desc_nothing:0 "For days and nights I have stressed and strained over what [ruler_scope.GetName] may do in response to recent revelations, yet it has been weeks now since the truth of my birth was sent to the realm. Surely [ruler_scope.GetSheHe] must have heard by now?\n\nI am forced to conclude that [ruler_scope.GetName] has simply decided to let this matter rest. Whether simply beneath [ruler_scope.GetHerHis] notice at this moment or [ruler_scope.GetSheHe] just does not care, it seems that there will be no demands coming from King's Landing."
 agot_events_bastard.0971.nw_army_for_claim:0 "The Commander's Men"
 agot_events_bastard.0980.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0980.desc:0 "Let it be known to all that [reveal_scope.GetName] and [reveal_employer.GetName] are, by their failure to present themselves to the throne when accounting for [reveal_scope.GetFirstNamePossessiveNoTooltip] heritage, deemed traitors to the realm and hereby sentenced to death.\n\nAny who assists [reveal_scope.GetHerHim] shall share the same fate."
 agot_events_bastard.0980.a:0 "Such a vicious demand!"
 agot_events_bastard.0981.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0981.desc:0 "Let it be known to all that [reveal_scope.GetName] is, by [reveal_scope.GetHerHis] failure to present [reveal_scope.GetHerselfHimself] to the throne when accounting for [reveal_scope.GetHerHis] heritage, hereby deemed a traitor to the realm and sentenced to death.\n\nAnyone who assists [reveal_scope.GetHerHim] shall share the same fate."
 agot_events_bastard.0981.desc_resolved:0 "Let it be known to all that [reveal_scope.GetName] has, by the threat of their emergence, been deemed a traitor to the realm and sentenced to death.\n\nLet [reveal_scope.GetHerHis] fate be a reminder of the fate that awaits all who would threaten the security of my realm."
 agot_events_bastard.0981.a:0 "Such a harsh ruling!"
 agot_events_bastard.0982.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0982.desc.male:0 "Let it be known to all that [reveal_scope.GetName] has been ordered to take the black with the Night's Watch due to the threat [reveal_scope.GetHerHis] heritage represents to the realm."
 agot_events_bastard.0982.desc.female:0 "Let it be known to all that [reveal_scope.GetName] has been ordered to join the Silent Sisterhood due to the threat [reveal_scope.GetHerHis] heritage represents to the realm."
 agot_events_bastard.0982.desc_pending:0 "Any lord or lady found aiding [reveal_scope.GetHerHim] to escape this demand shall be deemed a traitor to the realm and treated accordingly."
 agot_events_bastard.0982.desc_resolved:0 "The court thanks [reveal_scope.GetHerHim] for [reveal_scope.GetHerHis] service and hopes that [reveal_scope.GetSheHe] will serve equally well in [reveal_scope.GetHerHis] new station."
 agot_events_bastard.0982.a:0 "Punished just for being born? Doesn't seem right."
 agot_events_bastard.0983.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0983.desc:0 "Let it be known to all that [reveal_scope.GetName] has been summoned to be imprisoned until such a time as [reveal_scope.GetHerHis] heritage is demonstrated not to be a threat to the realm. Any lord or lady found aiding [reveal_scope.GetHerHim] to escape this summons shall be deemed a traitor to the realm and treated accordingly."
 agot_events_bastard.0983.desc_resolved:0 "Let it be known to all that [reveal_scope.GetName] has been imprisoned until such a time as the court is satisfied that [reveal_scope.GetHerHis] heritage is not a threat to the realm. Any lord or lady found conspiring to aid [reveal_scope.GetHerHim] in escape shall be deemed a traitor to the realm and treated accordingly."
 agot_events_bastard.0983.a:0 "Imprisoned for being born? Doesn't seem right."
 agot_events_bastard.0984.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0984.desc:0 "Let it be known to all that [reveal_scope.GetName] has been summoned to court under the protection of [ruler_scope.GetHerHis|U] Grace until such a time as [reveal_scope.GetHerHis] heritage is demonstrated not to be a threat to the realm. Any lord or lady found aiding [reveal_scope.GetHerHim] to escape this summons shall be deemed a traitor to the realm and treated accordingly."
 agot_events_bastard.0984.a.courtier:0 "Seems a fair response."
 agot_events_bastard.0984.a.landed:0 "Forced to give up their holdings? Harsh."
 agot_events_bastard.0985.opening:0 "To [ROOT.Char.GetFullNameNoTooltip],"
 agot_events_bastard.0985.desc:0 "Let it be known to all that [reveal_scope.GetName] has been instructed to make a public and legally binding statement, renouncing any and all claims to the throne or related titles."
 agot_events_bastard.0985.desc_pending:0 "Any lord or lady found aiding [reveal_scope.GetHerHim] to avoid or otherwise argue their way out of this demand shall be deemed a traitor to the realm and treated accordingly."
 agot_events_bastard.0985.desc_resolved:0 "This threat shall be resolved without bloodshed, such is my mercy and wish. The statement should reach your rookeries in the coming days, and I expect all to recognize it as fact."
 agot_events_bastard.0985.a:0 "Seems a fair response."
 agot_events_bastard.0990.t:0 "Bedding Alliances"
 agot_events_bastard.0990.desc.landed:0 "It has long been common for the houses of Westeros to seek marriages for alliances in times of crisis. As an unmarried claimant to the [ruler_scope.GetPrimaryTitle.GetName] I now represent quite the catch for those who wish to tie themselves to the royal house.\n\nIn anticipation of the turbulent path I have embarked on, I have made subtle overtures to the more ambitious houses of the realm, seeking potential marriage offers. Given the dangers ahead and the boon an alliance could present, perhaps accepting one of them is the best course of action."
 agot_events_bastard.0990.desc.landed_singular:0 "It has long been common for the houses of Westeros to seek marriages for alliances in times of crisis. As an unmarried claimant to the [ruler_scope.GetPrimaryTitle.GetName] I now represent quite the catch for those who wish to tie themselves to the royal house.\n\nOne such offer has been made to me by House [potential_spouse_1.GetHouse.GetBaseName], promising aid in the war to come. Given the dangers ahead and the boon an alliance could present, perhaps accepting this offer is the best course of action."
 agot_events_bastard.0990.desc.courtier:0 "It has long been common for the houses of Westeros to seek marriages for alliances in times of crisis. As an unmarried claimant to the [ruler_scope.GetPrimaryTitle.GetName] [reveal_scope.GetName] now represents quite the catch for those who wish to tie themselves to the future ruler.\n\nIn anticipation of the turbulent path we have embarked on, I have made subtle overtures to the more ambitious houses of the realm, seeking potential marriage offers. Given the dangers ahead and the boon an alliance could present, perhaps accepting one of them is the best course of action."
 agot_events_bastard.0990.desc.courtier_singular:0 "It has long been common for the houses of Westeros to seek marriages for alliances in times of crisis. As an unmarried claimant to the [ruler_scope.GetPrimaryTitle.GetName] [reveal_scope.GetName] now represents quite the catch for those who wish to tie themselves to the future ruler.\n\nOne such offer has been made to me by House [potential_spouse_1.GetHouse.GetBaseName], promising aid in the war to come. Given the dangers ahead and the boon an alliance could present, perhaps accepting this offer is the best course of action."
 agot_events_bastard.0990.a:0 "I shall marry [potential_spouse_1.GetName]!"
 agot_events_bastard.0990.b:0 "I shall marry [potential_spouse_2.GetName]!"
 agot_events_bastard.0990.c:0 "I shall marry [potential_spouse_3.GetName]!"
 agot_events_bastard.0990.d:0 "I'll not marry some social climber!"
 agot_events_bastard.0990.a.they:0 "[reveal_scope.GetSheHe|U] shall marry [potential_spouse_1.GetName]!"
 agot_events_bastard.0990.b.they:0 "[reveal_scope.GetSheHe|U] shall marry [potential_spouse_2.GetName]!"
 agot_events_bastard.0990.c.they:0 "[reveal_scope.GetSheHe|U] shall marry [potential_spouse_3.GetName]!"
 agot_events_bastard.0990.d.they:0 "[reveal_scope.GetSheHe|U]'ll not marry some social climber!"
 agot_events_bastard.0992.t:0 "The Line, Crossed"
 agot_events_bastard.0992.desc:0 "So it has come to this.\n\nToo much time has passed to claim that I haven't received [ruler_scope.GetFirstNamePossessive] notice, and to mobilize the troops necessary I have sent the ravens calling the banners for war. The line is crossed, the die is cast, and either [reveal_scope.GetHouse.GetBaseName] or [ruler_scope.GetHouse.GetBaseName] will reign victorious when this is over.\n\nI survey the banners assembled before me, seeing the many that have flocked to defy the unjust demands of the tyrant [ruler_scope.GetName]."
 agot_events_bastard.0992.desc.same:0 "So it has come to this.\n\nToo much time has passed to claim that I haven't received [ruler_scope.GetFirstNamePossessive] notice, and to mobilize the troops necessary I have sent the ravens calling the banners for war. The line is crossed, the die is cast, and the legitimate [ruler_scope.GetHouse.GetBaseName] is to be decided with blood.\n\nI survey the banners assembled before me, seeing the many that have flocked to defy the unjust demands of the tyrant [ruler_scope.GetNameNoTooltip]."
 agot_events_bastard.0992.desc.ned:0 "So it has come to this.\n\nToo much time has passed to claim that I haven't received [ruler_scope.GetFirstNamePossessive] notice, and to mobilize the troops necessary I have sent the ravens calling the banners for war. The line is crossed, the die is cast, and either [reveal_scope.GetHouse.GetBaseName] or [ruler_scope.GetHouse.GetBaseName] will reign victorious when this is over.\n\nI survey the banners assembled before me, and though my heart aches to march south against my one-time friend, I know that I owe it to Lyanna and to [reveal_scope.GetFirstName] to do what is right. For the mercy of men and myself both, I wish this to be a swift war."
 agot_events_bastard.0992.a:0 "Together we march for justice!"
 agot_events_bastard.0993.t:0 "Demands Rejected"
 agot_events_bastard.0993.desc:0 "So it has come to this.\n\nRejecting my demands, the bastard [reveal_scope.GetName] has declared [reveal_scope.GetHerHis] intent to rule the [ruler_scope.GetPrimaryTitle.GetName] and called to [reveal_scope.GetHerHis] allies to uphold their claim. What manner of promises [reveal_scope.GetSheHe] must have made to assemble such a host is unknown, but the line is crossed, the die is cast, and either [reveal_scope.GetHouse.GetBaseName] or [ruler_scope.GetHouse.GetBaseName] will reign victorious when this is over.\n\nI survey the banners assembled before me, seeing the many that have flocked to defend my just rulership."
 agot_events_bastard.0993.desc.same:0 "So it has come to this.\n\nRejecting my demands, the bastard [reveal_scope.GetName] has declared [reveal_scope.GetHerHis] intent to rule the [ruler_scope.GetPrimaryTitle.GetName] and called to [reveal_scope.GetHerHis] allies to uphold their claim. What manner of promises [reveal_scope.GetSheHe] must have made to assemble such a host is unknown, but the line is crossed, the die is cast, and either a true [reveal_scope.GetHouse.GetBaseName] or a false one will reign victorious when this is over.\n\nI survey the banners assembled before me, seeing the many that have flocked to defend my just rulership."
 agot_events_bastard.0993.desc.robert:0 "The events of the last few weeks have shocked me to my core, and none moreso than where I find myself now.\n\nMy one-time friend Eddard Stark has declared my demands unjust and raised his banners to install [reveal_scope.GetName] as ruler of the [ruler_scope.GetPrimaryTitle.GetName]. He has called his many allies and vassals to uphold this claim, and said that my demand proves me no better than the Mad King we deposed together.\n\nWhatever friendship once existed between us is now over. The line is crossed, the die is cast, and either Stark or Baratheon will reign victorious when this is over.\n\nI will crush the rebels, I will crush the Starks, and I will crush the little dragonspawn just as I crushed [reveal_scope.GetHerHis] father and grandfather!"
 agot_events_bastard.0993.a:0 "I shall destroy these pretender rebels!"
 agot_events_bastard.0994.t:0 "Order Restored"
 agot_events_bastard.0994.desc:0 "The bastard's revolt has been crushed.\n\n[claimant.GetName] sits in my dungeons as well as [claimant.GetHerHis] treasonous allies. Historians will argue over whether this could have been avoided or if such secrecy was always doomed to end in failure, but regardless, the outcome is certain.\n\nHouse [ROOT.Char.GetHouse.GetBaseName] still rules, and I still reign!"
 agot_events_bastard.0994.a:0 "Peace returns at last."
 agot_events_bastard.0995.t:0 "Proclaiming Your Birthright"
 agot_events_bastard.0995.desc:0 "I step through the grand doors of the throne room, the Iron Throne's immense form dominating the space, towering over the court assembled on either side. I can feel it calling to me, and with a decisive step, I answer.\n\nEach step brings more to their knees as I pass by, bowing before their new liege. Though many may have questioned it not months ago, none now dare challenge my legitimacy.\n\nAs I take those first steps up the throne I feel the stain of my birth washing away, and once I reach the top I turn and raise my sword high to proclaim a new age!"
 agot_events_bastard.0995.a.king:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip], and I am your King!\""
 agot_events_bastard.0995.b.king:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip], and I am your King!\""
 agot_events_bastard.0995.a.queen:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [father_house.GetBaseNameNoTooltip], and I am your Queen!\""
 agot_events_bastard.0995.b.queen:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [mother_house.GetBaseNameNoTooltip], and I am your Queen!\""
 agot_events_bastard.0995.flavor:0 "May your rule be long and prosperous!"
 agot_events_bastard.0996.t:0 "A New Day Dawns"
 agot_events_bastard.0996.desc:0 "I watch on as [claimant.GetFirstName] steps through the gates of the throne room, crown adorning [claimant.GetHerHis] head. Confident eyes survey a new age, and with each step more, including myself, bend the knee before our new liege.\n\nPart of me still does not believe this is the world we now live in; it was not so long ago that [claimant.GetSheHe] did not even know the truth of [claimant.GetHerHis] parentage. Yet due to the path I set us down, a new day is dawning in the [claimant.GetPrimaryTitle.GetName]."
 agot_events_bastard.0996.a:0 "I wonder how [claimant.GetSheHe] is feeling right now..."
 agot_events_bastard.0996.b:0 "All hail [claimant.GetNameNoTooltip]!"
 agot_events_bastard.1001.t:0 "Demands Accepted"
 agot_events_bastard.1001.desc.jon:0 "I watch as [reveal_scope.GetFirstName] and Eddard are brought before me. The coward won't even meet my eyes as he is brought before the throne next to the despicable dragonspawn.\n\n\"For the crimes of harboring a Targaryen, a known threat to the realm—\" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave Eddard Stark's head clean from his body, the swordpoint cracking the stonework beneath. [reveal_scope.GetFirstNameNoTooltip] cries out in horror before I silence [reveal_scope.GetHerHim] too with an upwards swing, blood and stonework arching in a glorious crimson and marble display.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. Looking down at my one-time friend's lifeless eyes, I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."
 agot_events_bastard.1001.desc:0 "I watch as [reveal_scope.GetFirstName] and [reveal_employer.GetFirstName] are brought before me and the whole court. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n\"For the crimes of harboring a known threat to the realm, and for proclaiming false claims to the throne—\" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute two for no direct action? What must be going through their minds in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with a clean swing, removes the head of one, then the next. I may have private doubts, and the realm will react how it may."
 agot_events_bastard.1001.a:0 "Regardless, this matter is settled."
 agot_events_bastard.1002.t:0 "Demands Accepted"
 agot_events_bastard.1002.desc.jon:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains. The despicable dragonspawn stares right toward me, as though looking through and past my eyes. Now that I know the truth, I wonder how I ever didn't see Rhaegar's features in [reveal_scope.GetHerHim].\n\n\"For the crimes of proclaiming false claims to the throne—\" As the charges and decrees are read I find myself unable to hear the words. My heart is pounding in my head. Rage boiling inside. I feel an inferno building in my body, my skin buzzing and alive with wrath. I don't notice myself standing, only realizing I am descending from the throne when I am halfway down it.\n\nWithout waiting for the judgment to finish, I take one of the Kingsguard's swords from their sheaths as I pass, and with a swing and a yell, I cleave the bastard's head clean from [reveal_scope.GetHerHis] body, the swordpoint cracking the stonework beneath. The court cries out in horror, but I cannot hear it over the sound of my own blood rushing through my head.\n\nI stand there amidst the gore, Targaryen blood once again coating the ground of the court. I look down at [reveal_scope.GetFirstNamePossessiveNoTooltip] lifeless eyes, and I find no peace. The rage has not abated. Lyanna is still not here. The looks in my courtiers' eyes are the same I saw in the Mad King's court, and I wonder how it came to this."
 agot_events_bastard.1002.desc:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains. My Justice begins to read the charges, and I find myself wondering why they agreed to this, given what's about to happen.\n\n\"For the crimes of proclaiming false claims to the throne—\" As the charges and decrees are read I find myself unable to focus on the words. Was it right to execute a baseborn for no directly treasonous action? What must be going through [reveal_scope.GetHerHis] mind in this moment? Yet as I am considering this, the proclamation is finished. The executioner steps up, and with one clean swing, removes the head of [reveal_scope.GetFullName]. I may have private doubts, and the realm will react how it may."
 agot_events_bastard.1002.a:0 "Regardless, this matter is settled."
 agot_events_bastard.1003.t:0 "Demands Accepted"
 agot_events_bastard.1003.desc.male:0 "Dark wings for once do not bear dark words, but instead bear words of peace. I am barely out of my bedchambers when I am made aware of the raven from Castle Black. It seems that [reveal_scope.GetFullName] has presented himself as instructed, and has sworn to uphold the duties of the Night's Watch. Most importantly, to hold not lands and father no children.\n\nI breathe a sigh of relief that this surprising issue was resolved without bloodshed, and in the frozen north, he is unlikely to cause any trouble. The realm can rest easy, [reveal_scope.GetFirstName] can live without fear of me, and I rule without this thorn in my side."
 agot_events_bastard.1003.desc.female:0 "Dark wings for once do not bear dark words, but instead bear words of peace. I am barely out of my bedchambers when I am made aware of the raven from the motherhouse of Oldtown. It seems that [reveal_scope.GetFullName] has presented herself as instructed, and has sworn to uphold the sacred and morbid duties of a silent sister. Most importantly, to serve in silence and take no husband.\n\nI breathe a sigh of relief that this surprising issue was resolved without bloodshed, and in the arms of the Sisterhood, she is unlikely to cause any trouble. The realm can rest easy, [reveal_scope.GetFirstName] can live without fear of me, and I rule without this thorn in my side."
 agot_events_bastard.1003.a:0 "That's this matter settled then."
 agot_events_bastard.1004.t:0 "Demands Accepted"
 agot_events_bastard.1004.desc.jon:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains and shoved onto the cold marble of the throne room. The dragonspawn stares right toward me, as though looking through and past my eyes. Now that I know the truth, I wonder how I never saw Rhaegar's features in [reveal_scope.GetHerHim].\n\n\"For the crimes of proclaiming false claims to the throne—\" As the charges and decrees are read I find myself unable to hear the words. Those eyes though....they look just like Lyanna's. For years I couldn't remember what she looked like, and just now I remember a piece for the first time in over a decade. Those are Lyanna's eyes. I hear my heart beat in my head, and only by the silence do I realize that the proclamation is over.\n\nWithout word from me, the guards begin to usher [reveal_scope.GetHerHim] towards the dungeon, and as [reveal_scope.GetSheHe] rises I find my memory stolen again. Lyanna's eyes perhaps, but that bearing is Targaryen. What I do with [reveal_scope.GetHerHim] is up to me now."
 agot_events_bastard.1004.desc:0 "I watch as [reveal_scope.GetFirstName] is brought before me in chains and shoved onto the cold marble of the throne room. My Justice begins to read the charges, and I find myself wondering why they agreed to this.\n\n\"For the crimes of proclaiming false claims to the throne—\" As the charges and decrees are read I find myself unable to hear the words. I'm searching [reveal_scope.GetHerHis] eyes, seeking the motive behind [reveal_scope.GetHerHis] surrender. Was it cowardice, or a desire for peace? Perhaps this is part of some larger ploy? Only by the silence do I realize that the proclamation is over.\n\nWithout word from me, the guards begin to usher [reveal_scope.GetHerHim] towards the dungeon, and as [reveal_scope.GetSheHe] rises I find myself thinking on more practical concerns. What I do with [reveal_scope.GetHerHim] is up to me now."
 agot_events_bastard.1004.a:0 "At least I now know what [reveal_scope.GetSheHe] is doing."
 agot_events_bastard.1005.t:0 "Demands Accepted"
 agot_events_bastard.1005.desc.jon:0 "I watch as [reveal_scope.GetFirstName] is brought before me in full view of the court, kneeling on the cold marble of the throne room as I preside above [reveal_scope.GetHerHim]. The offspring of my beloved Lyanna and my foe Rhaegar performs the perfect recital of vows, and now that I know the truth, I wonder how I never saw Rhaegar's features in [reveal_scope.GetHerHim].\n\n\"- do so swear fealty to you and your heirs as rulers of the [ROOT.Char.GetPrimaryTitle.GetName].\" As [reveal_scope.GetHerHis] oaths are finished and [reveal_scope.GetSheHe] rises I find myself shocked. Those eyes look just like Lyanna's. For years I couldn't remember what she looked like, and just now I remember a piece for the first time in over a decade. Those are Lyanna's eyes.\n\nWithout word from me, [reveal_scope.GetSheHe] steps out of the procession and into the thrum of court. Lyanna's eyes perhaps, but that bearing is Targaryen. What I do with [reveal_scope.GetHerHim] is up to me now."
 agot_events_bastard.1005.desc:0 "I watch as [reveal_scope.GetFirstName] is brought before me in full view of the court, kneeling on the cold marble of the throne room as I preside above [reveal_scope.GetHerHim].\n\n\"- do so swear fealty and loyalty to you and your heirs as the just rulers of the [ROOT.Char.GetPrimaryTitle.GetName].\" As the oaths are finished and [reveal_scope.GetSheHe] rises I find myself searching [reveal_scope.GetHerHis] eyes, seeking the motive behind [reveal_scope.GetHerHis] surrender. Was it cowardice, or a desire for peace? Perhaps this is part of some larger ploy? Only by the silence do I realize that the swearing is over.\n\nWithout word from me, [reveal_scope.GetSheHe] steps out of the procession and into the thrum of court, joining their fellow courtiers."
 agot_events_bastard.1005.a:0 "To honor, to ignore, or to use as I see fit."
 agot_events_bastard.1005.b:0 "[reveal_scope.GetFirstNameNoTooltip] is a renowned warrior; why not invite [reveal_scope.GetHerHim] to my Kingsguard?"
 agot_events_bastard.1005.c:0 "To the dungeon with them then!"
 agot_events_bastard.1005.d:0 "I shall welcome them as a true member of House [reveal_scope.GetHouse.GetBaseName]"
 agot_events_bastard.1006.opening:0 "To all the Lords and Ladies of Westeros,"
 agot_events_bastard.1006.desc:0 "I, [reveal_scope.GetFullName], do by the Old Gods and the New, forswear any and all claims to the [ruler_scope.GetPrimaryTitle.GetName] and its associated titles. My birth may be fact, but it changes nothing of my station or rights, and never have I claimed elsewise. [ruler_scope.GetFullName] is the only lawful and legitimate ruler, and I am naught but [ruler_scope.GetHerHis] loyal subject."
 agot_events_bastard.1006.a:0 "Peace it is then."
 agot_events_bastard.reveal_warning_cadet:0 "You and your children will form a new [bastard_house|E]."
 agot_events_bastard.0995.c.king:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [checking_house.GetBaseNameNoTooltip], and I am your King!\""
 agot_events_bastard.0995.c.queen:0 "\"I am [ROOT.Char.GetFirstNameNoTooltip] [checking_house.GetBaseNameNoTooltip], and I am your Queen!\""
 agot_events_bastard.0995.stay_house:0 "You and your heirs will remain a part of [house|E] [checking_house.GetName]"
 become_father_house_head:0 "[king.GetShortUIName|U] will become the [father_house.GetBaseName|V] [house_head|E]"
 become_mother_house_head:0 "[king.GetShortUIName|U] will become the [mother_house.GetBaseName|V] [house_head|E]"