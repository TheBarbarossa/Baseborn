 nick_agot_historical_the_keg_o_ale:0 "le Fût-De-Bière"
 nick_agot_historical_the_king_who_flew:0 "le Roi qui Vola"
 nick_agot_historical_the_king_who_flew_desc:0 "Par trois fois, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] fait le tour du sommet de la Lance du Géant, sur le dos de Vhagar. Le petit roi qui tutoya les cieux revint sur terre en tant que petit seigneur."
 nick_agot_historical_the_king_who_knelt:0 "le Roi qui s'agenouilla"
 nick_agot_historical_the_king_who_knelt_desc:0 "Ne souhaitant pas voir le Nord partager le même sort qu'Harrenhal et le Champ de Feu, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] choisi de sacrifier [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] titre de roi et de ployer le genou devant le Conquérant."
 nick_agot_historical_the_kingmaker:0 "[CHARACTER.Custom('FR_LeLa')] Faiseu[CHARACTER.Custom('FR_RSe')]-de-Rois"
 nick_agot_historical_the_kingslayer:0 "[CHARACTER.Custom('FR_LeLa')] Régicide"
 nick_agot_historical_the_kinslayer:0 "[CHARACTER.Custom('FR_LeLa')] Parricide"
 nick_agot_historical_the_kinslayer_desc:0 "[Select_CString(CHARACTER.IsLocalPlayer,'Vous','Se')] présentant comme le Roi de la Montagne et du Val, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] jeté [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] frère à travers la porte de la lune après que les seigneurs du Val aient exigé la libération de leur seigneur suzerain légitime."
 nick_agot_historical_the_knight:0 "le Chevalier"
 nick_agot_historical_the_knight_of_flowers:0 "le Chevalier des Fleurs"
 nick_agot_historical_the_knight_of_kisses:0 "le Chevalier des Baisers"
 nick_agot_historical_the_knight_of_the_flame:0 "le Chevalier de la Flamme"
 nick_agot_historical_the_knight_of_the_fountains:0 "le Chevalier des Fontaines"
 nick_agot_historical_the_knight_of_the_fountains_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] un chevalier de grande réputation dans les tournois."
 nick_agot_historical_the_knight_of_the_twilight:0 "le Chevalier du Crépuscule"
 nick_agot_historical_the_knight_of_the_twilight_desc:0 "Otage au Donjon Rouge lors de la Conquête de Dorne, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] l'un des membres fondateurs des Fils de la Lance."
 nick_agot_historical_the_krakens_daughter:0 "la Fille du Kraken"
 nick_agot_historical_the_lace_serpent:0 "le Serpent de Dentelle"
 nick_agot_historical_the_lackwit:0 "[CHARACTER.Custom('FR_LeLa')] Simpl[CHARACTER.Custom('FR_EtEtte')]"
 nick_agot_historical_the_lame:0 "[CHARACTER.Custom('FR_LeLa')] Bancroche"
 nick_agot_historical_the_last:0 "[CHARACTER.Custom('FR_LeLa')] Derni[CHARACTER.Custom('FR_ErEre')]"
 nick_agot_historical_the_last_loren:0 "l'Ultime"
 nick_agot_historical_the_last_loren_desc:0 "Ultime Roi du Roc, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] ployé le genoux devant Aegon le Conquérant après avoir réchappé à la bataille du Champ de Feu."
 nick_agot_historical_the_last_reaver:0 "[CHARACTER.Custom('FR_LeLa')] Derni[CHARACTER.Custom('FR_ErEre')] Pillard[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_last_reaver_desc:0 "Souhaitant [Select_CString(CHARACTER.IsLocalPlayer,'vous emparer des','faire siennes les')] Mers du Crépuscule, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] harcelé les côtes des Terres de l'Ouest. [Select_CString(CHARACTER.IsLocalPlayer,'Votre','Sa')] défaite mit un terme aux razzias des fer-nés pendant de très longues années."
 nick_agot_historical_the_last_valyrian:0 "[CHARACTER.Custom('FR_LeLa')] Derni[CHARACTER.Custom('FR_ErEre')] Valyrie[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_last_valyrian_desc:0 "Pillard[CHARACTER.Custom('FR_E')] de renom, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] issu[CHARACTER.Custom('FR_E')] d'une lignée de seigneurs pirates lysiens descendants des valyriens."
 nick_agot_historical_the_late_lord:0 "[CHARACTER.Custom('FR_LeLa')] Tardi[CHARACTER.Custom('FR_FVe')]"
 nick_agot_historical_the_late_lord_desc:0 "Lors de la Rébellion de Robert, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] arrivé à la Bataille du Trident lorsqu'elle fut déjà terminée."
 nick_agot_historical_the_latecomer:0 "[CHARACTER.Custom('FR_LeLa')] Tardi[CHARACTER.Custom('FR_FVe')]"
 nick_agot_historical_the_latecomer_desc:0 "When his father died, [CHARACTER.GetShortUINameNoTooltipNoFormat] had been raiding along the Mander, and [CharWereWas(CHARACTER)] not sent word of the Kingsmoot. Upon [CharYourHerHis(CHARACTER)] return, [CharYouSheHe(CHARACTER)] denounced the Kingsmoot as unlawful, and successfully revolted against Urrathon IV Goodbrother, thereby taking [CharYourHerHis(CHARACTER)] throne — and this name."
 nick_agot_historical_the_laughing_lion:0 "[CHARACTER.Custom('FR_LeLa')] Lio[CHARACTER.Custom('FR_NNne')] Éjoui[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_laughing_storm:0 "l'Orage Moqueur"
 nick_agot_historical_the_laughing_storm_desc:0 "Riant aux éclats face à [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] adversaires, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] considéré comme l'un des plus grands guerriers de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] époque."
 nick_agot_historical_the_laughing_wolf:0 "le Loup Rieur"
 nick_agot_historical_the_laughing_wolf_desc:0 "Connu pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] réputation d'homme jovial, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] conquis le Neck, alors entre les mains du Roi des Paluds, puis [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] ensuite épousé la fille de ce dernier."
 nick_agot_historical_the_learned:0 "l'Érudit[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_leech_lord:0 "le Seigneur Sangsue"
 nick_agot_historical_the_leech_lord_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'pensez','pense')] que les sangsues sont la clé d'une longue vie, ce qui [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] a valu de gagner un surnom à ce sujet — que nul n'ose utiliser en face."
 nick_agot_historical_the_leopard:0 "le Léopard"
 nick_agot_historical_the_liar:0 "[CHARACTER.Custom('FR_LeLa')] Menteu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_limp:0 "[CHARACTER.Custom('FR_LeLa')] Boiteu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_limper:0 "[CHARACTER.Custom('FR_LeLa')] Boiteu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_lion:0 "le Lion"
 nick_agot_historical_the_lion_king:0 "le Roi Lion"
 nick_agot_historical_the_lion_king_desc:0 "Roi du Roc ayant acquis ce sobriquet dans une chronique volantaine contant le récit de la flotte dorée et de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] expédition à Valyria, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] disparu dans ce périple duquel n'est jamais revenu non plus la légendaire épée Rugissante."
 nick_agot_historical_the_lion_of_braavos:0 "le Lion de Braavos"
 nick_agot_historical_the_lionslayer:0 "[CHARACTER.Custom('FR_LeLa')] Tueu[CHARACTER.Custom('FR_RSe')] de Lion"
 nick_agot_historical_the_lionslayer_desc:0 "Pour avoir infligé une blessure mortelle à Lord Jason Lannister lors de la Bataille de la Ruffurque, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] s'est vu[CHARACTER.Custom('FR_E')] surnommé[CHARACTER.Custom('FR_E')] « Longfeuille [CHARACTER.Custom('FR_LeLa')] Tueu[CHARACTER.Custom('FR_RSe')] de Lion »."
 nick_agot_historical_the_little:0 "[CHARACTER.Custom('FR_LeLa')] Petit[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_little_bear:0 "la Petite Ourse"
 nick_agot_historical_the_little_bee:0 "Avette"
 nick_agot_historical_the_little_lemon:0 "le Petit Citron"
 nick_agot_historical_the_little_lion:0 "le Petit Lion"
 nick_agot_historical_the_little_pussy:0 "la Petite Chatte"
 nick_agot_historical_the_little_witch:0 "[CHARACTER.Custom('FR_LeLa')] Petit[CHARACTER.Custom('FR_E')] Sorci[CHARACTER.Custom('FR_ErEre')]"
 nick_agot_historical_the_long_prefix:0 "[Select_CString(CHARACTER.IsFemale,'Longue','Long')]"
 nick_agot_historical_the_longknife:0 "le Long Couteau"
 nick_agot_historical_the_lord_lamprey:0 "Lord Lamproie"
 nick_agot_historical_the_lord_lamprey_desc:0 "Raillé par [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] propres sujets en raison de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] appétit vorace, il n'en demeure pas moins que derrière cette bedaine proéminente, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'cachez','cache')] un esprit des plus rusés."
 nick_agot_historical_the_loud:0 "[CHARACTER.Custom('FR_LeLa')] Bruyant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_lusty:0 "[CHARACTER.Custom('FR_LeLa')] Gaillard[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_lusty_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] n’[Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] cure de ses vœux de garde royale, comme en témoigne les trois femmes qu[Select_CString(CHARACTER.IsLocalPlayer,'e vous avez','’il a')] épousé et les seize enfants engendrés."
 nick_agot_historical_the_mad:0 "[Select_CString(CHARACTER.IsFemale,'la Démente','le Fou')]"
 nick_agot_historical_the_mad_bard:0 "[Select_CString(CHARACTER.IsFemale,'la Ménestrelle Démente','le Barde Fou')]"
 nick_agot_historical_the_mad_huntsman:0 "[Select_CString(CHARACTER.IsFemale,'la Chasseuse Démente','le Chasseur Dément')]"
 nick_agot_historical_the_mad_king:0 "le Roi Fou"
 nick_agot_historical_the_mad_king_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] [Select_CString(CHARACTER.IsFemale,'sujette','sujet')] à des accès de paranoïa, de cruauté gratuite et de démence, témoignant ainsi de [Select_CString(CHARACTER.IsLocalPlayer,'votre folie','sa folie')] aux yeux du royaume."
 nick_agot_historical_the_mad_maid:0 "la Vierge Folle"
 nick_agot_historical_the_mad_maid_desc:0 "The unwed eldest daughter of the Lord of Oldtown, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] known to consult books of spells."
 nick_agot_historical_the_mad_mouse:0 "la Souris Démente"
 nick_agot_historical_the_madling:0 "[CHARACTER.Custom('FR_LeLa')] Folle[CHARACTER.Custom('FR_TTte')]"
 nick_agot_historical_the_mage:0 "[CHARACTER.Custom('FR_LeLa')] Mage"
 nick_agot_historical_the_mage_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] travelled east to study the higher mysteries, and [CharWereWas(CHARACTER)] so-named after [CharYourHerHis(CHARACTER)] return — a moniker that quickly spread, much to the annoyance of the grey sheep."
 nick_agot_historical_the_magnificent:0 "[CHARACTER.Custom('FR_LeLa')] Magnifique"
 nick_agot_historical_the_magnificent_desc:0 "Les récits de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] exploits sont racontés depuis le Mur jusqu'aux Contrées de l'Ombre au-delà d'Asshaï."
 nick_agot_historical_the_maid:0 "la Jouvencelle"
