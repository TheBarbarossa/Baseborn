 nick_agot_historical_short:0 "Courtaud"
 nick_agot_historical_shortfoot:0 "Pied-Court"
 nick_agot_historical_shortfoot_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] perdu la moitié de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] pied durant [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] jeunesse, lors d'une rencontre avec un lynx-de-fumée."
