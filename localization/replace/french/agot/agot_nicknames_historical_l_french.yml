 nick_agot_historical_the_eagle:0 "l'Aigle"
 nick_agot_historical_the_eagle_desc:0 "En dépit de la victoire du Loup Affamé face à Ravos le Violeur, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] continué de piller les côtes ouest du Nord."
