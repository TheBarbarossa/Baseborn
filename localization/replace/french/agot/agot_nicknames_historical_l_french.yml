 nick_agot_historical_stoneheart:0 "Cœurdepierre"
 nick_agot_historical_stonesnake:0 "Vipre"
 nick_agot_historical_stormborn:0 "du Typhon"
 nick_agot_historical_stormborn_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] durant une violente tempête qui a causé maintes destructions."
 nick_agot_historical_stormsword:0 "Trombe-Lame"
 nick_agot_historical_strong_prefix:0 "Fort[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_strongboar:0 "le Sanglier"
 nick_agot_historical_strongboar_desc:0 "De grande taille et pourvu d'une grande vigueur, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] considéré par beaucoup comme l'homme le plus fort de tout Westeros."
 nick_agot_historical_stump_hand:0 "Bout-de-Main"
 nick_agot_historical_stump_hand_desc:0 "La légende raconte que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] remporté [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] couronne lors d'une danse du doigt, qui [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] en aurait coûté deux."
 nick_agot_historical_sweetberry:0 "Tendrebaie"
 nick_agot_historical_sweetberry_desc:0 "Surnom donnée par la Princesse Saera, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'étiez','était')] son favori — du moins l'un d'entre eux."
