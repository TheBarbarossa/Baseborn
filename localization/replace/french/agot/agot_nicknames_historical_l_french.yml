 nick_agot_historical_the_glorious:0 "[CHARACTER.Custom('FR_LeLa')] Glorieu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_glorious_desc:0 "Que ce soit dans la sagesse ou dans la guerre, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] acquis énormément de gloire."
