 nick_agot_historical_the_half_year_queen:0 "la Reine d'une Demi-Année"
 nick_agot_historical_the_half_year_queen_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'n’avez','n’a')] siégé qu'une demi-année sur le trône [Select_CString(CHARACTER.IsLocalPlayer,'que vous revendiquiez','qu’elle revendiquait')] avant d'être contrainte de fuir."
 nick_agot_historical_the_halfwild:0 "[CHARACTER.Custom('FR_LeLa')] Demi-Sauvage"
