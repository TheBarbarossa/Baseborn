 nick_agot_historical_the_exile_desc:0 "Pour avoir réchappé au Fléau de Valyria, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] en tant que « l'Exilé[CHARACTER.Custom('FR_E')] »."
