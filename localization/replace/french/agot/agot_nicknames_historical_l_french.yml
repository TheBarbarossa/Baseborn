 nick_agot_historical_the_black_centaur:0 "le Centaure Noir"
 nick_agot_historical_the_black_dragon:0 "[Select_CString(CHARACTER.IsFemale,'la Dragonne Noire','le Dragon Noir')]"
 nick_agot_historical_the_black_dragon_desc:0 "[Select_CString(CHARACTER.IsFemale,'Fille','Fils')] nature[CHARACTER.Custom('FR_LLle')] d'Aegon IV, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] pris pour emblème un dragon noir sur champ rouge."
 nick_agot_historical_the_black_harren:0 "le Noir"
 nick_agot_historical_the_black_harren_desc:0 "Tyran vaniteux et sanguinaire méprisé par ceux [Select_CString(CHARACTER.IsLocalPlayer,'que vous gouvernez','qu’il gouverne')], [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] supervisé l'achèvement d'Harrenhal, quel que soit le prix à payer pour le Conflans et les Îles de Fer."
 nick_agot_historical_the_black_lion:0 "[CHARACTER.Custom('FR_LeLa')] Lio[CHARACTER.Custom('FR_NNne')] Noir[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_black_prefix:0 "Noir[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_black_priest:0 "le Prêtre Noir"
