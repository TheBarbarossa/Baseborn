 nick_agot_historical_the_bad_apple:0 "la Pomme Gâtée"
 nick_agot_historical_the_bad_apple_desc:0 "Membre de la tristement célèbre Bande des Neuf, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] un chevalier exilé de sinistre réputation."
