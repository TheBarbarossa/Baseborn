 nick_agot_historical_the_beggar_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] may be a king by rights, but the reality leaves much to be desired."
 nick_agot_historical_the_belly:0 "la Bedaine"
 nick_agot_historical_the_belly_lorimer:0 "la Bedaine"
 nick_agot_historical_the_belly_lorimer_desc:0 "Corpulent[CHARACTER.Custom('FR_E')] et bedonnant[CHARACTER.Custom('FR_E')], [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] ne [Select_CString(CHARACTER.IsLocalPlayer,'lésinez','lésine')] pas sur les coups de fourchette."
