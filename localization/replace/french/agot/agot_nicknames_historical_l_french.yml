 nick_agot_historical_the_ebon_prince:0 "le Prince d'Ébène"
 nick_agot_historical_the_elder:0 "[CHARACTER.Custom('FR_LeLa')] Doye[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_elder_desc:0 "[CHARACTER.GetFirstName] n'était pas l'unique membre de sa famille à l'époque, mais il était le plus ancien."
