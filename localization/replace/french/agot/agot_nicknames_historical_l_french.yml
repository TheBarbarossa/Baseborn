 nick_agot_historical_silverhair_sigfryd:0 "Poil d'Argent"
 nick_agot_historical_silverhair_sigfryd_desc:0 "Homme grisonnant, certains disent [CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] [Select_CString(CHARACTER.IsLocalPlayer,'que vous avez','qu’il a')] l'intention de vivre éternellement."
 nick_agot_historical_silverhorn:0 "Corne d'Argent"
 nick_agot_historical_silvertongue:0 "Langue d'Argent"
 nick_agot_historical_sixskins:0 "Sixpeaux"
 nick_agot_historical_sixskins_desc:0 "Change-peau de grand talent, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] revêtu la peau de trois loups, un ours des neiges, un lynx-de-fumée et un aigle."
 nick_agot_historical_sly:0 "[CHARACTER.Custom('FR_LeLa')] Sournois[CHARACTER.Custom('FR_LeLa')]"
 nick_agot_historical_small:0 "Petit[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_smalljon:0 "P'tit-Jon"
 nick_agot_historical_smalljon_desc:0 "Bien que [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] surnom laisse suggérer le contraire, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] bâti aussi solidement que [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] paternel, et il n'est pas exclu que vienne le jour où [Select_CString(CHARACTER.IsLocalPlayer,'vous','il')] le dépassera."
 nick_agot_historical_snowbeard:0 "Barbeneige"
 nick_agot_historical_snowbeard_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] gouverné le Nord durant près d'un siècle — un règne marqué par les ennemis venant de l'intérieur des frontières autant qu'au-delà."
 nick_agot_historical_softspear:0 "Mollepique"
 nick_agot_historical_softspear_desc:0 "Dernier roi de la Maison Massey, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été tué par le Roi de l'Orage Qarlton II Durrandon lors de sa conquête du Bec de Massey."
 nick_agot_historical_sourmouth:0 "Aigre-bec"
 nick_agot_historical_speardancer:0 "Danse d'Hast"
 nick_agot_historical_spearlover:0 "Épris[CHARACTER.Custom('FR_E')]-de-la-Lance"
 nick_agot_historical_spotted:0 "[Select_CString(CHARACTER.IsFemale,'Mouchette','Moucheté')]"
 nick_agot_historical_spotted_butcher:0 "[Select_CString(CHARACTER.IsFemale,'Mouchette','Moucheté')]"
 nick_agot_historical_spotted_butcher_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] en tant que « le Tisonné », tout simplement."
 nick_agot_historical_squire:0 "l'Écuyer"
 nick_agot_historical_stammerer:0 "[CHARACTER.Custom('FR_LeLa')] Bègue"
 nick_agot_historical_star_eyes:0 "Prunelles Étoilées"
 nick_agot_historical_star_eyes_desc:0 "Les vieilles chansons disent [CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] [Select_CString(CHARACTER.IsLocalPlayer,'que vous','qu’il')] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] remplacé [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] yeux perdus par des saphirs étoilés."
 nick_agot_historical_starfire_samwell:0 "l'Étoile Ardente"
 nick_agot_historical_starfire_samwell_desc:0 "En tant que roi de la Torrentine et seigneur des Météores, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] mis à sac Villevieille."
 nick_agot_historical_steelshanks:0 "Jarret d'Acier"
 nick_agot_historical_steelshanks_desc:0 "Homme grand et brutal, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour les jambières d'acier [Select_CString(CHARACTER.IsLocalPlayer,'que vous portez sur vos','qu’il porte sur ses')] longues jambes."
 nick_agot_historical_steelsong:0 "Chant d'Acier"
