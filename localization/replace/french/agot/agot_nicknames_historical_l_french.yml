 nick_agot_historical_the_merling_queen:0 "la Reine des Tritons"
 nick_agot_historical_the_merry:0 "[CHARACTER.Custom('FR_LeLa')] Joyeu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_mighty:0 "[CHARACTER.Custom('FR_LeLa')] Puissant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_mistress_of_swords:0 "la Maîtresse des Épées"
 nick_agot_historical_the_monstrous:0 "[CHARACTER.Custom('FR_LeLa')] Monstrueu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_moon_king:0 "le Roi de la Lune"
 nick_agot_historical_the_moonshadow:0 "l'Ombrelune"
 nick_agot_historical_the_mordant:0 "[CHARACTER.Custom('FR_LeLa')] Mordant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_morningstar:0 "l'Étoile du Matin"
 nick_agot_historical_the_mother:0 "la Mère"
 nick_agot_historical_the_mother_hen:0 "la Mère Poule"
 nick_agot_historical_the_mountain_that_rides:0 "la Montagne"
 nick_agot_historical_the_mountain_that_rides_desc:0 "Si quelqu'un se demande d'où vient [Select_CString(CHARACTER.IsLocalPlayer,'votre','ce')] surnom, il lui suffit de se tenir à côté [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] pour le comprendre."
 nick_agot_historical_the_mouse:0 "la Souris"
 nick_agot_historical_the_mummer:0 "[CHARACTER.Custom('FR_LeLa')] Saltimbanque"
 nick_agot_historical_the_mummer_desc:0 "Famed for [CharYourHerHis(CHARACTER)] prowess with sword and shield, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] known for being quick, strong, and observant."
 nick_agot_historical_the_musician:0 "[CHARACTER.Custom('FR_LeLa')] Musicie[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_nail:0 "le Clou"
 nick_agot_historical_the_necromancer:0 "[CHARACTER.Custom('FR_LeLa')] Nécromancie[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_necromancer_desc:0 "A legendary ironborn raider during the Age of Heroes, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] so-named for the black art [CharYouSheHe(CHARACTER)] practice[_s(CHARACTER)]."
 nick_agot_historical_the_neveryield:0 "Ne-te-rends-jamais"
 nick_agot_historical_the_niggardly:0 "[CHARACTER.Custom('FR_LeLa')] Ladre"
 nick_agot_historical_the_niggardly_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] known for [CharYourHerHis(CHARACTER)] pettiness."
 nick_agot_historical_the_nightingale:0 "le Rossignol"
 nick_agot_historical_the_nights_king:0 "le Roi de la Nuit"
 nick_agot_historical_the_nimble:0 "l'Agile"
 nick_agot_historical_the_nocturnal:0 "[CHARACTER.Custom('FR_LeLa')] Nocturne"
 nick_agot_historical_the_northman:0 "[CHARACTER.Custom('FR_LeLa')] Nordie[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_oak:0 "le Chêne"
 nick_agot_historical_the_oak_desc:0 "The legendary founder of House Oakheart, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] said to be eight (ten or twelve in some tales) feet tall."
 nick_agot_historical_the_old:0 "l'Ancie[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_the_old_bear:0 "[Select_CString(CHARACTER.IsFemale,'la Vieille Ourse','le Vieil Ours')]"
 nick_agot_historical_the_old_bear_desc:0 "Named for the sigil of [CharYourHerHis(CHARACTER)] house, [CHARACTER.GetShortUINameNoTooltipNoFormat] remain[_s(CHARACTER)] strong even in [CharYourHerHis(CHARACTER)] advanced age."
 nick_agot_historical_the_old_falcon:0 "[Select_CString(CHARACTER.IsFemale,'la Vieille Fauconne','le Vieux Faucon')]"
 nick_agot_historical_the_old_grey_gull:0 "le Vieux Goéland Gris"
 nick_agot_historical_the_old_grey_gull_desc:0 "A priest of the Drowned God, [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] true name is unknown."
 nick_agot_historical_the_old_king:0 "le Vieux Roi"
 nick_agot_historical_the_old_king_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] vécu de si nombreuses années que cela a éclipsé, pour le meilleur comme pour le pire, tous [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] autres hauts-faits."
 nick_agot_historical_the_old_kraken:0 "[CHARACTER.Custom('FR_LeLa')] V[CHARACTER.Custom('FR_IeuxIeille')] Kraken"
 nick_agot_historical_the_old_kraken_desc:0 "A King of the Iron Islands, [CHARACTER.GetShortUINameNoTooltipNoFormat] invaded the western shores of the north, taking Bear Island and Cape Kraken."
 nick_agot_historical_the_old_ox:0 "le Vieux Boeuf"
 nick_agot_historical_the_old_ox_desc:0 "An aged knight of some renown, [CHARACTER.GetShortUINameNoTooltipNoFormat] is clad in blood-red armor and a helm with black bull horns."
 nick_agot_historical_the_old_prefix:0 "V[CHARACTER.Custom('FR_IeuxIeille')]"
 nick_agot_historical_the_old_steelhand:0 "Vieille-Main-d'Acier"
 nick_agot_historical_the_oldfather:0 "le Vieux Père"
 nick_agot_historical_the_oldfather_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] célèbre pour avoir engendré pas moins d'une centaine de rejetons."
 nick_agot_historical_the_one_after_the_fat_one:0 "Celui qui vint après le Gros"
 nick_agot_historical_the_one_after_the_fat_one_desc:0 "Ce Grand Septon n'est connu que pour l'énormité de son prédécesseur."
 nick_agot_historical_the_onion_knight:0 "le Chevalier Oignon"
 nick_agot_historical_the_onion_knight_desc:0 "Lors du siège d'Accalmie, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] réussi à [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] faufiler à travers le blocus maritime, apportant oignons et poissons salés à la garnison affamée. En récompense de quoi, [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous', 'elle'), 'il')] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] obtenu un titre de noblesse et perdu quelques phalanges."
 nick_agot_historical_the_onion_lord:0 "le Seigneur Oignon"
 nick_agot_historical_the_openhanded:0 "[CHARACTER.Custom('FR_LeLa')] Munificent[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_openhanded_desc:0 "A disgraced knight of the Kingsguard, [CHARACTER.GetShortUINameNoTooltipNoFormat] shamed [CharYourHerHis(CHARACTER)] white cloak with [CharYourHerHis(CHARACTER)] cowardice."
 nick_agot_historical_the_orange:0 "l'Orange"
 nick_agot_historical_the_painter:0 "[CHARACTER.Custom('FR_LeLa')] Peintre"
 nick_agot_historical_the_pale:0 "[CHARACTER.Custom('FR_LeLa')] Blafard[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_pale_griffin:0 "le Griffon Pâle"
 nick_agot_historical_the_pale_griffin_desc:0 "Named for [CharYourHerHis(CHARACTER)] House's sigil, [CHARACTER.GetShortUINameNoTooltipNoFormat] serve[_s(CHARACTER)] as a knight of the Kingsguard."
 nick_agot_historical_the_pander:0 "le Pourvoyeur"
 nick_agot_historical_the_pander_desc:0 "On raconte que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] laissé Aegon l'Indigne coucher avec [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] femme et [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] fille — en même temps, selon certains."
 nick_agot_historical_the_patriarch:0 "le Patriarche"
 nick_agot_historical_the_patternmaker:0 "[CHARACTER.Custom('FR_LeLa')] Concept[CHARACTER.Custom('FR_EurRice')]"
 nick_agot_historical_the_penniless:0 "[CHARACTER.Custom('FR_LeLa')] Sans-le-Sol"
 nick_agot_historical_the_penniless_desc:0 "A practical but impoverished hedge knight, [CHARACTER.GetShortUINameNoTooltipNoFormat] wield[_s(CHARACTER)] a battered blade and ride[_s(CHARACTER)] a half-starved horse."
 nick_agot_historical_the_piglet:0 "[CHARACTER.Custom('FR_LeLa')] Porcele[CHARACTER.Custom('FR_TTte')]"
 nick_agot_historical_the_pious:0 "[CHARACTER.Custom('FR_LeLa')] Pieu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_pious_will:0 "[CHARACTER.Custom('FR_LeLa')] Pieu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_pirate:0 "[CHARACTER.Custom('FR_LeLa')] Pirate"
 nick_agot_historical_the_plowman:0 "[CHARACTER.Custom('FR_LeLa')] Laboureu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_plowman_desc:0 "Fondateur de la Maison Moreland, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] une figure légendaire ayant vécu durant l'Âge des Héros."
 nick_agot_historical_the_poet:0 "[CHARACTER.Custom('FR_LeLa')] Poèt[CHARACTER.Custom('FR_EEsse')]"
 nick_agot_historical_the_poetess:0 "la Poète"
 nick_agot_historical_the_proud_perwyn:0 "l'Altier"
 nick_agot_historical_the_proud_perwyn_desc:0 "En tant que seigneur de la Maison Osgris, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] bâti le plus grand château de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison : Froide-Douve."
 nick_agot_historical_the_puppeteer:0 "[CHARACTER.Custom('FR_LeLa')] Marionnettiste"
 nick_agot_historical_the_purple:0 "[CHARACTER.Custom('FR_LeLa')] Pourpre"
 nick_agot_historical_the_queen_of_thorns:0 "la Reine des Épines"
 nick_agot_historical_the_queen_of_thorns_desc:0 "[Select_CString(CHARACTER.IsLocalPlayer,'Votre','Sa')] langue acérée combinée à [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] caractère épineux font[CHARACTER.LocalPlayerString(' de vous', '')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] une femme célèbre pour ses épigrammes."
 nick_agot_historical_the_queen_who_never_was:0 "la Reine qui Jamais ne le Fut"
 nick_agot_historical_the_queen_who_never_was_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'étiez','était')] à deux doigts de devenir [Select_CString(CHARACTER.IsFemale,'reine','roi')], mais le grand conseil en a décidé autrement."
 nick_agot_historical_the_queer:0 "l'Étrange"
 nick_agot_historical_the_quick:0 "[CHARACTER.Custom('FR_LeLa')] Vi[CHARACTER.Custom('FR_FVe')]"
 nick_agot_historical_the_quickfinger:0 "Mainleste"
 nick_agot_historical_the_quiver:0 "la Tremblote"
 nick_agot_historical_the_raper:0 "[CHARACTER.Custom('FR_LeLa')] Violeu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_raper_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat] gouvernait l'Île-aux-Ours en tant que pillard fer-né, avant d'être tué lors d'une bataille par le Loup Affamé en personne."
 nick_agot_historical_the_raven:0 "[Select_CString(CHARACTER.IsFemale,'la Corneille','le Corbeau')]"
 nick_agot_historical_the_reader:0 "[CHARACTER.Custom('FR_LeLa')] Bouquineu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_reader_desc:0 "Chose atypique — et mal vu — dans la culture fer-née, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'préférez','préfère')] avoir un livre à la main qu'une épée."
 nick_agot_historical_the_realms_delight:0 "la Joie du Royaume"
 nick_agot_historical_the_reaper:0 "[Select_CString(CHARACTER.IsFemale,'la Faucheuse','le Faucheur')]"
 nick_agot_historical_the_reaver:0 "[CHARACTER.Custom('FR_LeLa')] Pillard[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_red:0 "[CHARACTER.Custom('FR_LeLa')] Rouge"
 nick_agot_historical_the_red_crab:0 "le Crabe Rouge"
 nick_agot_historical_the_red_dog:0 "[Select_CString(CHARACTER.IsFemale,'la Chienne Rouge','le Chien Rouge')] des Collines"
 nick_agot_historical_the_red_dog_desc:0 "En tant que Grand Capitaine des Fils du Guerrier, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'gouvernez','gouverne')] les contrées montagneuses au nord de la Dent d'Or, en pratique si non en titre."
 nick_agot_historical_the_red_kraken:0 "le Kraken Rouge"
 nick_agot_historical_the_red_kraken_desc:0 "Après avoir combattu dans les Degrés de Pierre en tant que mercenaire, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] ressorti d'une bataille, vivant mais recouvert d'une douzaine de blessures, desquelles coulaient abondamment le sang."
 nick_agot_historical_the_red_lion:0 "[CHARACTER.Custom('FR_LeLa')] Lio[CHARACTER.Custom('FR_NNne')] Rouge"
 nick_agot_historical_the_red_lion_desc:0 "Un surnom autant mérité pour l'emblème de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison que pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] réputation d'homme sanguinaire, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] un sire bouffi de fierté qui affirme que fourré d'or ou de rouge, un lion a toujours des griffes, longues et acérées."
 nick_agot_historical_the_red_viper:0 "la Vipère Rouge"
 nick_agot_historical_the_red_viper_desc:0 "Dans [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] jeunesse, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été surpris au lit avec l'amante de cœur d'Edgar Ferboys. Un duel judiciaire au premier sang s'ensuivit ; duel qui se termina sur une égalité — à ceci près que Lord Ferboys mourut d'une infection, que d'aucun attribut à du poison."
 nick_agot_historical_the_red_widow:0 "la Veuve Rouge"
 nick_agot_historical_the_red_widow_desc:0 "Durant [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] jeunesse, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'vous êtes','s’est')] mariée quatre fois, et aucun de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] époux et enfants ne [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] a survécu."
 nick_agot_historical_the_redsmile:0 "le Sourire Rouge"
 nick_agot_historical_the_regent:0 "[CHARACTER.Custom('FR_LeLa')] Régent[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_rhoynar:0 "[CHARACTER.Custom('FR_LeLa')] Rhoynar"
 nick_agot_historical_the_rhymer:0 "[CHARACTER.Custom('FR_LeLa')] Rimeu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_riverman:0 "[CHARACTER.Custom('FR_LeLa')] Riverain[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_rodent:0 "[CHARACTER.Custom('FR_LeLa')] Rongeu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_rogue_prince:0 "le Prince Vaurien"
 nick_agot_historical_the_rogue_prince_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] notoirement connu[CHARACTER.Custom('FR_E')] pour avoir une personnalité aventureuse et une moralité incertaine, ayant à la fois inspiré du dégoût et de l'admiration auprès de beaucoup."
 nick_agot_historical_the_rook:0 "[Select_CString(CHARACTER.IsFemale,'la Corneille','le Freux')]"
 nick_agot_historical_the_ruin:0 "la Ruine"
 nick_agot_historical_the_ruin_desc:0 "A savage combatant, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharHaveHas(CHARACTER)] been known to be so drunk in the frenzy of battle that [CharYouSheHe(CHARACTER)] do[_es(CHARACTER)] not feel [CharYourHerHis(CHARACTER)] wounds."
 nick_agot_historical_the_ruined:0 "[CHARACTER.Custom('FR_LeLa')] Ruiné[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_rune:0 "la Rune"
 nick_agot_historical_the_saddlesore:0 "le Mal Scellé"
 nick_agot_historical_the_saddlesore_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] passé tout [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] règne à cheval, à écraser des rebelles et à pendre des otages à travers le Conflans."
 nick_agot_historical_the_sailmaker:0 "[CHARACTER.Custom('FR_LeLa')] Voili[CHARACTER.Custom('FR_ErEre')]"
 nick_agot_historical_the_sailmaker_desc:0 "As Storm King, [CHARACTER.GetShortUINameNoTooltipNoFormat] sailed south to claim Estermont and its nearby isles for the Kingdom of the Storm."
 nick_agot_historical_the_salt_rat:0 "le Rat de Sel"
 nick_agot_historical_the_sand_dog:0 "le Chien des Sables"
 nick_agot_historical_the_savage:0 "[CHARACTER.Custom('FR_LeLa')] Sauvage"
 nick_agot_historical_the_scaly_prefix:0 "Écailles"
 nick_agot_historical_the_scrapesword:0 "Râpe-Épée"
 nick_agot_historical_the_scribe:0 "[CHARACTER.Custom('FR_LeLa')] Scribe"
 nick_agot_historical_the_sculptor:0 "[CHARACTER.Custom('FR_LeLa')] Sculpteu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_sea_dragon:0 "le Dragon des Mers"
 nick_agot_historical_the_sea_lion_leo:0 "le Lion de Mer"
 nick_agot_historical_the_sea_lion_leo_desc:0 "A grizzled seafarer, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] adept in commanding the fleets of the Reach."
 nick_agot_historical_the_sea_lion_lymond:0 "le Lion de Mer"
 nick_agot_historical_the_sea_lion_lymond_desc:0 "After swearing fealty to the Reach, [CHARACTER.GetShortUINameNoTooltipNoFormat] turned [CharYourHerHis(CHARACTER)] attention to [CharYourHerHis(CHARACTER)] 'great purpose' — the building of ships and conquest by sea."
 nick_agot_historical_the_sea_snake:0 "le Serpent de Mer"
 nick_agot_historical_the_sea_snake_desc:0 "Après avoir navigué par monts et par vaux, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'portez','porte')] désormais le nom de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] propre navire comme si c'était le [Select_CString(CHARACTER.IsLocalPlayer,'vôtre','sien')]."
 nick_agot_historical_the_seeker:0 "[CHARACTER.Custom('FR_LeLa')] Chercheu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_shade_of_ghost_hill:0 "l'Ombre de Spectremont"
 nick_agot_historical_the_shadow_sandoq:0 "l'Ombre"
 nick_agot_historical_the_shadow_sandoq_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] face is horribly disfigured — an affliction [CharYouSheHe(CHARACTER)] hide[_s(CHARACTER)] beneath a black silk veil."
 nick_agot_historical_the_shaker:0 "l'Ébranleu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_shebear:0 "l'Ourse"
 nick_agot_historical_the_shepherd:0 "[CHARACTER.Custom('FR_LeLa')] Berg[CHARACTER.Custom('FR_ErEre')]"
 nick_agot_historical_the_shieldsmasher:0 "Fend-l'Écu"
 nick_agot_historical_the_shipwright:0 "[CHARACTER.Custom('FR_LeLa')] Caréneu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_shipwright_desc:0 "Connu pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] amour de la mer, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] disparu durant sa traversée dans les Mers du Crépuscule."
 nick_agot_historical_the_silver_lion:0 "[CHARACTER.Custom('FR_LeLa')] Lio[CHARACTER.Custom('FR_NNne')] Argenté[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_silver_prefix:0 "l'Argenté[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_silver_rose:0 "la Rose Argentée"
 nick_agot_historical_the_simple_vaella:0 "[CHARACTER.Custom('FR_LeLa')] Simple[CHARACTER.Custom('FR_TTte')]"
 nick_agot_historical_the_simple_vaella_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] sweet, but simple-minded."
 nick_agot_historical_the_sisterman:0 "des Sœurs"
 nick_agot_historical_the_sisterman_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] originaire des Trois Sœurs."
 nick_agot_historical_the_sleepy:0 "[CHARACTER.Custom('FR_LeLa')] Somnolent[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_sleepy_jack:0 "l'Endormi[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_sleepy_jack_desc:0 "En tant que Lord Commandant, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] non seulement laissé une armée de sauvageons passer le Mur, mais [Select_CString(CHARACTER.IsLocalPlayer,'vous êtes','il est')] également arrivé trop tard pour [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] joindre à la bataille."
 nick_agot_historical_the_small:0 "[CHARACTER.Custom('FR_LeLa')] Petit[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_smiling_knight:0 "le Chevalier Badin"
 nick_agot_historical_the_smith:0 "le Ferrant"
 nick_agot_historical_the_snail:0 "l'Escargot"
 nick_agot_historical_the_snail_desc:0 "Some say [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] deserving of this moniker not only due to [CharYourHerHis(CHARACTER)] personal emblem, but because of [CharYourHerHis(CHARACTER)] propensity of 'hiding in [CharYourHerHis(CHARACTER)] shell'."
 nick_agot_historical_the_sneaky:0 "[CHARACTER.Custom('FR_LeLa')] Sournois[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_snowman:0 "[Select_CString(CHARACTER.IsFemale,'la Femme','l’Homme')] de Neige"
 nick_agot_historical_the_soulless:0 "[CHARACTER.Custom('FR_LeLa')] Sans-Âme"
 nick_agot_historical_the_sour:0 "l'Amer"
 nick_agot_historical_the_sparrow:0 "le Moineau"
 nick_agot_historical_the_spring_king:0 "le Roi du Printemps"
 nick_agot_historical_the_spring_prince:0 "le Prince du Printemps"
 nick_agot_historical_the_spring_prince_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] deux jours seulement après que les corbeaux blancs se soient envolés de la Citadelle, annonçant l'arrivée du printemps."
 nick_agot_historical_the_stargazer:0 "Yeux-lès-Astres"
 nick_agot_historical_the_stargazer_desc:0 "As an Archmaester of the Citadel, [CHARACTER.GetShortUINameNoTooltipNoFormat] teach[_es(CHARACTER)] and judge[_s(CHARACTER)] the subject of the heavens."
 nick_agot_historical_the_starvling:0 "l'Affamé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_starvling_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] a prominent member of the order of the Poor Fellows."
 nick_agot_historical_the_steelhand:0 "Main-d'Acier"
 nick_agot_historical_the_stinger:0 "le Dard"
 nick_agot_historical_the_stinger_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] habile au combat — même plus encore, car [Select_CString(CHARACTER.IsLocalPlayer,'vous êtes','il est')] considéré comme la plus fine lame du Bief."
 nick_agot_historical_the_stonemason:0 "Le Tailleur de Pierre"
 nick_agot_historical_the_stonemason_desc:0 "Ce Grand Septon est connu pour son aptitude dans le travail de la pierre, certains affirment même qu'il est le Ferrant en chair et en os."
 nick_agot_historical_the_stormbreaker:0 "Brise-Orage"
 nick_agot_historical_the_stormbreaker_desc:0 "A famed knight, [CHARACTER.GetShortUINameNoTooltipNoFormat] earned [CharYourHerHis(CHARACTER)] name by besting two 'Storms' in a tourney."
 nick_agot_historical_the_storyteller:0 "[CHARACTER.Custom('FR_LeLa')] Conteu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_stray:0 "l'Errant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_strong:0 "[CHARACTER.Custom('FR_LeLa')] Puissant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_strummer:0 "le Baladin"
 nick_agot_historical_the_strummer_desc:0 "À la fois chevalier et barde, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour brocarder [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] adversaires à l'aide de chants grivois avant chaque combat."
 nick_agot_historical_the_survivor:0 "[CHARACTER.Custom('FR_LeLa')] Survivant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_sweet:0 "[CHARACTER.Custom('FR_LeLa')] Dou[CHARACTER.Custom('FR_XCe')]"
 nick_agot_historical_the_sweet_prefix:0 "[Select_CString(CHARACTER.IsFemale,'Douce','Tendre')]"
 nick_agot_historical_the_sweetling:0 "Tout-Miel"
 nick_agot_historical_the_sweetling_desc:0 "Soft-spoken and handsome, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] nonetheless a cruel and sadistic member of the Mountain's men."
 nick_agot_historical_the_sword_of_the_evening:0 "l'Épée du Soir"
 nick_agot_historical_the_sword_of_the_evening_desc:0 "Renowned as the greatest knight in all of Dorne, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharWereWas(CHARACTER)] defeated by Nymeria, and thereafter sent to the Wall in golden fetters — a Sword of the Morning clad in black."
 nick_agot_historical_the_sybarite:0 "[CHARACTER.Custom('FR_LeLa')] Sybarite"
 nick_agot_historical_the_tall_duncan:0 "[CHARACTER.Custom('FR_LeLa')] Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_tall_duncan_desc:0 "Grand d'un peu moins de sept pieds de haut, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'dominez','domine')] la majeure partie des gens."
 nick_agot_historical_the_tall_gerhard:0 "[CHARACTER.Custom('FR_LeLa')] Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_tall_gerhard_desc:0 "Tall of stature, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] the founder of House Forrester."
 nick_agot_historical_the_tall_john:0 "[CHARACTER.Custom('FR_LeLa')] Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_tall_john_desc:0 "As King of the Reach, [CHARACTER.GetShortUINameNoTooltipNoFormat] sailed [CharYourHerHis(CHARACTER)] barge up the Mander to its very headwaters and received homage from those whose lands lined the river's banks."
 nick_agot_historical_the_tall_tallad:0 "[CHARACTER.Custom('FR_LeLa')] Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_tall_tallad_desc:0 "Big and strapping, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] a promising knight despite [CharYourHerHis(CHARACTER)] common origin."
 nick_agot_historical_the_tall_toregg:0 "[CHARACTER.Custom('FR_LeLa')] Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_tall_toregg_desc:0 "The eldest son of Tormund Giantsbane, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] a foot taller than [CharYourHerHis(CHARACTER)] already enormous father."
 nick_agot_historical_the_talon:0 "la Serre"
 nick_agot_historical_the_talon_desc:0 "A fierce King of Mountain and Vale, [CHARACTER.GetShortUINameNoTooltipNoFormat] captured and burned the castle of the Wolf's Den during the wars between the North and the Vale."
 nick_agot_historical_the_tame:0 "[CHARACTER.Custom('FR_LeLa')] Docile"
 nick_agot_historical_the_tame_desc:0 "Malade depuis [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] naissance, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'n’êtes','n’est')] pas ce qu'on peut appeler un[CHARACTER.Custom('FR_E')] combattant[CHARACTER.Custom('FR_E')]."
 nick_agot_historical_the_tanglebeard:0 "Barbe-en-Brouille"
 nick_agot_historical_the_tanglebeard_desc:0 "A simple man from Dragonstone, [CHARACTER.GetShortUINameNoTooltipNoFormat] bear[_s(CHARACTER)] an unkempt beard."
 nick_agot_historical_the_tangletongue:0 "Langue-en-Brouille"
 nick_agot_historical_the_tangletongue_desc:0 "Atteint de bégaiement, on dit[CHARACTER.LocalPlayerString('de vous', '')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] [Select_CString(CHARACTER.IsLocalPlayer,'que vous écoutez plus que vous ne déblatérez','qu’il écoute plus qu’il ne déblatère')]."
 nick_agot_historical_the_tattered_prince:0 "le Prince en Guenilles"
 nick_agot_historical_the_tattered_prince_desc:0 "Once chosen to be the Prince of Pentos, [CHARACTER.GetShortUINameNoTooltipNoFormat] fled to the Disputed Lands in fear of [CharYourHerHis(CHARACTER)] new station. As leader of the Windblown, [CharYouSheHe(CHARACTER)] wear[_s(CHARACTER)] a ragged cloak sewn of different colored twists of cloths."
 nick_agot_historical_the_terrible:0 "[CHARACTER.Custom('FR_LeLa')] Terrible"
 nick_agot_historical_the_terrible_togarion:0 "le Terrible"
 nick_agot_historical_the_terrible_togarion_desc:0 "A feared Andal warlord, [CHARACTER.GetShortUINameNoTooltipNoFormat] drove away the stormlanders and forged a new kingdom in Massey's Hook."
 nick_agot_historical_the_thrall:0 "[CHARACTER.Custom('FR_LeLa')] Ser[CHARACTER.Custom('FR_FVe')]"
 nick_agot_historical_the_thrall_desc:0 "Once a thrall [CharYourHerHimself(CHARACTER)], [CHARACTER.GetShortUINameNoTooltipNoFormat] now raid[_s(CHARACTER)] alongside the Ironborn."
 nick_agot_historical_the_threadbare:0 "l'Élimé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_threadbare_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] so-named for [CharYourHerHis(CHARACTER)] personal emblem — a frayed maunch, white on brown."
 nick_agot_historical_the_thrice_drowned:0 "[CHARACTER.Custom('FR_LeLa')] Triplenoyé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_thrice_drowned_desc:0 "A priest of the Drowned God, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] renowned for [CharYourHerHis(CHARACTER)] remarkable success in performing the kiss of life."
