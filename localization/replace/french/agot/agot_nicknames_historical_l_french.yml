 nick_agot_historical_the_hungry_wolf_desc:0 "Pour avoir férocement défendu [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] terres contre les envahisseurs Andals et Fer-nés, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] gagné un surnom qui reflète le caractère insatiable de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] désir de protéger le Nord."
