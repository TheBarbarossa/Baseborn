 nick_agot_historical_the_black_swan:0 "le Cygne Noir"
 nick_agot_historical_the_black_swan_historical_desc:0 "Esclave durant [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] jeunesse, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] devenu une courtisane de grand renom qui régna pendant un temps sur Lys en tout, sauf en titre."
 nick_agot_historical_the_black_tempest:0 "la Tempête Noire"
 nick_agot_historical_the_black_widow:0 "la Veuve Noire"
 nick_agot_historical_the_blackhand:0 "Mainnoire"
 nick_agot_historical_the_blackmane:0 "la Crinière Noire"
 nick_agot_historical_the_blessed:0 "[CHARACTER.Custom('FR_LeLa')] Bienheureu[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_blessed_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] obtenu le titre sacré de « Bienheureu[CHARACTER.Custom('FR_XSe')] » en témoignage d'une vie considérée comme bénie par les dieux."
 nick_agot_historical_the_blind:0 "l'Aveugle"
 nick_agot_historical_the_blind_bastard:0 "[CHARACTER.Custom('FR_LeLa')] Bâtard[CHARACTER.Custom('FR_E')] Aveugle"
 nick_agot_historical_the_blind_bowman:0 "l'Arch[CHARACTER.Custom('FR_ErEre')] Aveugle"
 nick_agot_historical_the_blind_king:0 "le Roi Aveugle"
 nick_agot_historical_the_bloody:0 "[CHARACTER.Custom('FR_LeLa')] Sanglant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_blue:0 "[CHARACTER.Custom('FR_LeLa')] Bleu[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_blue_bard:0 "le Barde Bleu"
 nick_agot_historical_the_blue_bard_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] vêtu tout de bleu, [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] les yeux bleus et [Select_CString(CHARACTER.IsLocalPlayer,'vous teignez','se teint')] les cheveux en bleu, à la mode de Tyrosh."
 nick_agot_historical_the_boar:0 "le Sanglier"
 nick_agot_historical_the_boarkiller:0 "[CHARACTER.Custom('FR_LeLa')] Tueu[CHARACTER.Custom('FR_RSe')] de Sangliers"
 nick_agot_historical_the_boarkiller_desc:0 "Fondateur de la Maison Crakehall, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] une figure légendaire de l'Âge des Héros."
 nick_agot_historical_the_boastful:0 "[CHARACTER.Custom('FR_LeLa')] Vantard[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_boisterous:0 "[CHARACTER.Custom('FR_LeLa')] Bruyant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_bold:0 "[CHARACTER.Custom('FR_LeLa')] Hardi[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_bold_desc:0 "Entré en lice en tant que chevalier mystère lors d'un tournoi à seulement dix ans, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] reçu cet épithète du Prince des Libellules en personne. [Select_CString(CHARACTER.IsLocalPlayer,'Vos','Ses')] actes ont par la suite montrés [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'que vous', 'qu’elle'), 'qu’il')] en [Select_CString(CHARACTER.IsLocalPlayer,'étiez','était')] digne."
 nick_agot_historical_the_boor:0 "[CHARACTER.Custom('FR_LeLa')] Rustre"
 nick_agot_historical_the_boy_king:0 "l'Enfant Roi"
 nick_agot_historical_the_boy_king_desc:0 "Arrivé[CHARACTER.Custom('FR_E')] au pouvoir à un âge précoce, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] en tant que « l'Enfant Roi »."
 nick_agot_historical_the_brave:0 "[CHARACTER.Custom('FR_LeLa')] Brave"
 nick_agot_historical_the_brave_baelor:0 "[CHARACTER.Custom('FR_LeLa')] Brave"
 nick_agot_historical_the_brave_baelor_desc:0 "Lors de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] première visite dans la Fossedragon, [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] tapé Balerion la Terreur noire sur le museau, gagnant ainsi [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] surnom."
 nick_agot_historical_the_breaker_bulwer:0 "[CHARACTER.Custom('FR_LeLa')] Fracasseu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_breaker_bulwer_desc:0 "La légende raconte que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] acquis la force de vingt hommes en buvant du sang de taureau, allant jusqu'à voir une paire de cornes [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] pousser sur la tête."
 nick_agot_historical_the_breaker_bulwer_line:0 "le Fracasseur"
 nick_agot_historical_the_breaker_bulwer_line_desc:0 "La lignée de Bors le Fracasseur, fils de Garth Mainverte et fondateur de la Maison Bulwer."
 nick_agot_historical_the_breaker_stark:0 "[CHARACTER.Custom('FR_LeLa')] Briseu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_breaker_stark_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] mis fin au règne de treize années du Roi de la Nuit et ainsi libéré la Garde de Nuit de son emprise."
 nick_agot_historical_the_breaker_stark_line:0 "le Briseur"
 nick_agot_historical_the_breaker_stark_line_desc:0 "La lignée de Brandon le Briseur, Roi de l'Hiver."
 nick_agot_historical_the_bridegroom:0 "le Fiancé"
 nick_agot_historical_the_bridegroom_garland:0 "l'Épou[CHARACTER.Custom('FR_XSe')]"
 nick_agot_historical_the_bridegroom_garland_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] écarté [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] épouses afin de [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] marier avec la fille de Lymond Hightower, dans le but d'intégrer Villevieille au Royaume du Bief."
 nick_agot_historical_the_bronzeman:0 "l'Homme de Bronze"
 nick_agot_historical_the_brown_dragon:0 "le Dragon Brun"
 nick_agot_historical_the_brown_dragon_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'vous','est')] tombé dans une flaque de boue suite à une joute, gagnant malgré [Select_CString( CHARACTER.IsLocalPlayer, 'vous', CHARACTER.Custom('FR_LuiElle'))] le surnom de « Dragon Brun » en moquerie de l'épithète de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] père."
 nick_agot_historical_the_brute:0 "la Brute"
 nick_agot_historical_the_builder:0 "[CHARACTER.Custom('FR_LeLa')] Bâtisseu[CHARACTER.Custom('FR_RSe')]"
 nick_agot_historical_the_bull:0 "le Taureau"
 nick_agot_historical_the_bull_of_blackcrown:0 "le Taureau de Noircouronne"
 nick_agot_historical_the_burner:0 "l'Incendiaire"
 nick_agot_historical_the_burner_desc:0 "Sous le coup du chagrin, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] incendié les navires que [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] père aimait, après que ce dernier ait disparu dans les Mers du Crépuscule."
 nick_agot_historical_the_butcher:0 "[CHARACTER.Custom('FR_LeLa')] Bouch[CHARACTER.Custom('FR_ErEre')]"
