 nick_agot_historical_the_giantslayer:0 "[CHARACTER.Custom('FR_LeLa')] Tueu[CHARACTER.Custom('FR_RSe')]-de-Géants"
 nick_agot_historical_the_giantslayer_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] gagné cet illustre surnom lors de la Bataille du Mur, durant laquelle [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous auriez', 'elle aurait'), 'il aurait')] tué un géant d'une lance dans le dos, avant de le déposséder de sa tête."
