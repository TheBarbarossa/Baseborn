 nick_agot_historical_the_barber_nute:0 "[CHARACTER.Custom('FR_LeLa')] Barbi[CHARACTER.Custom('FR_ErEre')]"
 nick_agot_historical_the_barber_nute_desc:0 "[CHARACTER.LocalPlayerString('Votre dextérité au lancer de haches', 'La dextérité au lancer de haches')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] est telle [Select_CString(CHARACTER.IsLocalPlayer,'que vous seriez','qu’il serait')] capable, selon les dires, de raser un homme à vingt pas de distance."
 nick_agot_historical_the_bard_bael:0 "le Barde"
 nick_agot_historical_the_bard_bael_desc:0 "A King-Beyond-the Wall and one of the greatest raiders of [CharYourHerHis(CHARACTER)] time, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharWereWas(CHARACTER)] also famed for [CharYourHerHis(CHARACTER)] skill in song — through which [CharYouSheHe(CHARACTER)] won the most beautiful flower that grew in the gardens of Winterfell."
 nick_agot_historical_the_bard_loron:0 "le Barde"
 nick_agot_historical_the_bard_loron_desc:0 "A lord of the ironborn, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] known for [CharYourHerHis(CHARACTER)] great and tragic friendship with a knight of the green lands."
