l_french:
 nick_agot_historical_ambercloak:0 "Cape d'Ambre"
 nick_agot_historical_anvil_of_hammerhal:0 "l'Enclume de Hammerhal"
 nick_agot_historical_anvilbreaker:0 "Brise-Enclumes"
 nick_agot_historical_anvilbreaker_desc:0 "Puissant[CHARACTER.Custom('FR_E')] guerri[CHARACTER.Custom('FR_ErEre')] parmi les fer-nés, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] tant écrasé de crânes sur [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] enclume que cela est devenu aussi banal qu'un menuisier qui use de son marteau."
 nick_agot_historical_apple_eater:0 "[CHARACTER.Custom('FR_LeLa')] Croqueu[CHARACTER.Custom('FR_RSe')] de Pommes"
 nick_agot_historical_apple_eater_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] gagné [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] surnom en [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] distinguant lors de la Bataille de la Néra, après avoir capturé un chevalier de la Maison Fossovoie, et tué deux autres."
 nick_agot_historical_appleseed:0 "Graine-de-Pommes"
 nick_agot_historical_badbrother:0 "Malfrère"
 nick_agot_historical_badbrother_desc:0 "Une fois couronné[CHARACTER.Custom('FR_E')], [CHARACTER.LocalPlayerString('votre premier acte', 'le premier acte')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUIName')] a été de passer au fil de l'épée tous les fils de votre prédécesseur, ce qui amena bon nombre de gens à [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous', 'la'), 'le')] considérer indigne du nom de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] Maison."
 nick_agot_historical_be_lucky:0 "Bonne-Chance"
 nick_agot_historical_be_lucky_desc:0 "N'ayant plus qu'un œil, bon nombre de gens commencent à jaser quant à la véracité de [CHARACTER.LocalPlayerString('votre', 'son')] surnom."
 nick_agot_historical_big:0 "Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_big_desc:0 "Pourvu[CHARACTER.Custom('FR_E')] d'une carrure imposante et de bras musculeux, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'dominez','domine')] aisément [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] semblables."
 nick_agot_historical_big_belly:0 "Gros-Bide"
 nick_agot_historical_big_liddle:0 "Grand Lideuil"
 nick_agot_historical_big_liddle_desc:0 "Nommé[CHARACTER.Custom('FR_E')] ainsi pour être le fils aîné des Lideuil, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] en réalité à peine plus grand que la moyenne."
 nick_agot_historical_big_walder_frey:0 "Grand[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_big_walder_frey_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] cinquante-deux jours avant [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] cousin « Petit Walder », même si [Select_CString(CHARACTER.IsLocalPlayer,'vos','leur')] surnom respectif semble mal choisi quand on regarde [Select_CString(CHARACTER.IsLocalPlayer,'vos','leur')] taille respective."
 nick_agot_historical_bittersteel:0 "Aigracier"
 nick_agot_historical_bittersteel_desc:0 "[Select_CString(CHARACTER.IsFemale,'Fille','Fils')] nature[CHARACTER.Custom('FR_LLle')] d'Aegon IV, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] aigreur au quotidien et [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] férocité au combat."
 nick_agot_historical_black:0 "Noir[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_black_bear:0 "Ours Noir"
 nick_agot_historical_black_pearl:0 "Perle Noire"
 nick_agot_historical_blackbean:0 "Flageolet [CHARACTER.Custom('FR_LeLa')] Noir[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_blackbolt:0 "Foudre-Noire"
 nick_agot_historical_blackcrown:0 "Noircouronne"
 nick_agot_historical_blackfish:0 "le Silure"
 nick_agot_historical_blackfish_desc:0 "Traité[CHARACTER.Custom('FR_E')] de « mouton noir » par [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] frère, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] choisi d'épouser pleinement l'idée d'être considéré[CHARACTER.Custom('FR_E')] comme un[CHARACTER.Custom('FR_E')] marginal[CHARACTER.Custom('FR_E')] au sein de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison, en arborant l'emblème d'un poisson noir et en acceptant [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] surnom de « Silure », poisson caractérisé par son cannibalisme."
 nick_agot_historical_blackheart:0 "Cœurnoir"
 nick_agot_historical_blackheart_desc:0 "Nommé[CHARACTER.Custom('FR_E')] ainsi en raison du blason de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison, la réputation redoutable [CHARACTER.LocalPlayerString('qui vous précède', 'qui précède')][CHARACTER.LocalPlayerString('', 'Loc_FR_le_GetShortUINameNoTooltipNoFormat')] cache en fait [Select_CString(CHARACTER.IsFemale,'une femme','un homme')] au grand cœur."
 nick_agot_historical_blacklance:0 "Lance Noire"
 nick_agot_historical_blackshield:0 "Noirécu"
 nick_agot_historical_blacksword:0 "Noire-Épée"
 nick_agot_historical_blackthumb:0 "Poucenoir"
 nick_agot_historical_bleak:0 "Sombre"
 nick_agot_historical_bloodaxe:0 "Hache-de-Sang"
 nick_agot_historical_bloodbeard:0 "Barbesang"
 nick_agot_historical_bloodbeard_desc:0 "Connu[CHARACTER.Custom('FR_E')] pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] grande barbe aux moustaches rouges flamboyantes ainsi que [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] longues tresses, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'vous délectez','se délecte')] à l'idée de rougir davantage [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] pilosité."
 nick_agot_historical_bloodborn:0 "Sang-né[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_bloodless:0 "Pas-de-Sang"
 nick_agot_historical_bloodraven:0 "Freuxsanglant"
 nick_agot_historical_bloodraven_desc:0 "[Select_CString(CHARACTER.IsFemale,'Fille','Fils')] nature[CHARACTER.Custom('FR_LLle')] d'Aegon IV, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] avec une tache de vin ayant la forme d'un corbeau et une peau d'un blanc laiteux."
 nick_agot_historical_bloody:0 "Sanglant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_bluespur:0 "Éperon Bleu"
 nick_agot_historical_bluetooth:0 "la Dent Bleue"
 nick_agot_historical_bonehand:0 "l'Osselet"
 nick_agot_historical_bonesuckled:0 "Tète-les-Os"
 nick_agot_historical_books:0 "Bouquine"
 nick_agot_historical_brave_bentbow:0 "la Flèche Fougueuse"
 nick_agot_historical_breakbones:0 "Brise-Os"
 nick_agot_historical_breakbones_desc:0 "Doté[CHARACTER.Custom('FR_E')] d'une silhouette massive et d'un corps robuste, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] considéré[CHARACTER.Custom('FR_E')] comme [Select_CString(CHARACTER.IsFemale,'la femme','l’homme')] [CHARACTER.Custom('FR_LeLa')] plus fort[CHARACTER.Custom('FR_E')] des Sept Couronnes."
 nick_agot_historical_breakspear:0 "Briselance"
 nick_agot_historical_breakspear_desc:0 "À l'âge de dix-sept ans, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] renversé l'illustre Ser Daemon Feunoyr lors d'une joute, gagnant ainsi le surnom de Briselance."
 nick_agot_historical_breaksword:0 "[CHARACTER.Custom('FR_LeLa')] Briseu[CHARACTER.Custom('FR_RSe')] d'Épée"
 nick_agot_historical_brightflame:0 "Viveflamme"
 nick_agot_historical_brightflame_desc:0 "Connu pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] comportement éclectique, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'préférez','préfère')] être [Select_CString(CHARACTER.IsLocalPlayer,'nommés','nommé')] « Viveflamme »."
 nick_agot_historical_brightmane:0 "Crinière Éclatante"
 nick_agot_historical_brightrune:0 "Rune Éclatante"
 nick_agot_historical_brightsmile:0 "Éclatant-Sourire"
 nick_agot_historical_bronze:0 "Bronze"
 nick_agot_historical_bronze_axe:0 "Hache-de-Bronze"
 nick_agot_historical_bronze_bitch:0 "la Garce de Bronze"
 nick_agot_historical_bronze_bitch_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été surnommé[CHARACTER.Custom('FR_E')] ainsi par [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] époux, Daemon, en référence dédaigneuse pour l'ancienne armure de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison."
 nick_agot_historical_brown:0 "[CHARACTER.Custom('FR_LeLa')] Bru[CHARACTER.Custom('FR_NNne')]"
 nick_agot_historical_browntooth:0 "Dent-Brune"
 nick_agot_historical_buckets:0 "Seaux"
 nick_agot_historical_cleftjaw:0 "Gueule-en-Deux"
 nick_agot_historical_cleftjaw_desc:0 "Porteu[CHARACTER.Custom('FR_RSe')] d'une affreuse cicatrice, [CHARACTER.LocalPlayerString('votre bouche', 'la bouche')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] a presque été coupée en deux suite à un violent coup de hache."
 nick_agot_historical_clubfoot:0 "[Select_CString(CHARACTER.IsFemale,'Pied-Bot','le Pied-Bot')]"
 nick_agot_historical_clubfoot_desc:0 "[CHARACTER.Custom('FR_le_Char_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] avec un pied tordu et déformé, une affliction qui [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous', 'la'), 'le')]  tourmentera jusqu'à [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] dernier souffle."
 nick_agot_historical_coldwind:0 "Heurtebise"
 nick_agot_historical_cornburner:0 "Brûlemaïs"
 nick_agot_historical_corpse:0 "Cadavre"
 nick_agot_historical_cotter:0 "Cotter"
 nick_agot_historical_crabfeeder:0 "[CHARACTER.Custom('FR_LeLa')] Gaveu[CHARACTER.Custom('FR_RSe')]-de-Crabes"
 nick_agot_historical_crabfeeder_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour abandonner [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] prisonniers sur les estrans des Degrés de Pierre, laissant les #italic autochtones#! se repaître de leur chair."
 nick_agot_historical_crowfood:0 "Freuxchère"
 nick_agot_historical_crowfood_desc:0 "S'étant fait arracher un œil à cause d'un corbeau qui [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous', 'la'), 'le')] croyait mort[CHARACTER.Custom('FR_E')], [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] lui [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] rendu la pareille en lui arrachant la tête."
 nick_agot_historical_crowkiller:0 "Freux-Buteur"
 nick_agot_historical_crowkiller_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] acquis une infâme notoriété pour avoir trucidé moult corbeaux — frères noirs — de la Garde de Nuit."
 nick_agot_historical_crows_eye:0 "l'Œil-de-Choucas"
 nick_agot_historical_crows_eye_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'portez','porte')] un bandeau en cuir noir sur [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] œil gauche, pour cacher ce que d'aucuns pensent être un orbe brillant d'une malicieuse noirceur."
 nick_agot_historical_dame_of_andalos:0 "la Dame d'Andalos"
 nick_agot_historical_damphair:0 "Tifs-Trempes"
 nick_agot_historical_damphair_desc:0 "Après avoir miraculeusement survécu à une tempête, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] décidé de consacrer [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] vie au Dieu Noyé, gardant [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] cheveux trempés depuis lors."
 nick_agot_historical_dance_for_me:0 "Danse-pour-Moi"
 nick_agot_historical_darkrobin:0 "[CHARACTER.Custom('FR_LeLa')] Sombre"
 nick_agot_historical_darkstar:0 "Sombre Astre"
 nick_agot_historical_darkstar_desc:0 "Les gens [Select_CString(CHARACTER.IsLocalPlayer,'vous ','l’')]appellent « Sombre Astre » en raison de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] nature très... nocturne."
 nick_agot_historical_dashing_prefix:0 "[CHARACTER.Custom('FR_LeLa')] Fringant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_deaf:0 "[Select_CString(CHARACTER.IsFemale,'la Sourde','le Sourd')]"
 nick_agot_historical_dim:0 "Sombre"
 nick_agot_historical_dolorous:0 "la Douleur"
 nick_agot_historical_dour_prefix:0 "[CHARACTER.Custom('FR_LeLa')] Lugubre"
 nick_agot_historical_dread_prefix:0 "La Terreur"
 nick_agot_historical_drunken_giant:0 "le Géant Ivre"
 nick_agot_historical_evenstar:0 "Étoile-du-Soir"
 nick_agot_historical_ever_sweet:0 "Tout-Sucre"
 nick_agot_historical_ever_sweet_desc:0 "La légende raconte que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'aimiez','aimait')] tant le miel [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'que vous', 'qu’elle'), 'qu’il')] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] conclu un pacte avec le Roi des Abeilles pour prendre soin de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] enfants, et des enfants de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] enfants, à jamais."
 nick_agot_historical_fair:0 "[Select_CString(CHARACTER.IsFemale,'la Belle','le Beau')]"
 nick_agot_historical_fairhands:0 "Belles-Mains"
 nick_agot_historical_falconhelm:0 "Heaume de Faucon"
 nick_agot_historical_fat:0 "Gro[CHARACTER.Custom('FR_SSse')]"
 nick_agot_historical_fighting_fool:0 "[Select_CString(CHARACTER.IsFemale,'la Folle des Batailles','le Fou des Batailles')]"
 nick_agot_historical_fireball:0 "Boulenfeu"
 nick_agot_historical_fireball_desc:0 "Nommé[CHARACTER.Custom('FR_E')] ainsi en raison de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] chevelure d'un roux flamboyant ainsi que pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] tempérament intrépide, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] considéré[CHARACTER.Custom('FR_E')] comme l'une des plus fines lames de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] époque."
 nick_agot_historical_first_goose:0 "Première Plume"
 nick_agot_historical_first_goose_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] l'aîné[CHARACTER.Custom('FR_E')] d'une fratrie de triplés."
 nick_agot_historical_flatnose:0 "Nez plat"
 nick_agot_historical_fletcher:0 "Fléchier"
 nick_agot_historical_four_groats:0 "Quatre-Liards"
 nick_agot_historical_fourskins:0 "Quatrepeaux"
 nick_agot_historical_fourskins_desc:0 "Change-peau de grand talent, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] revêtu la peau de quatre bêtes."
 nick_agot_historical_foxglove:0 "Digitale"
 nick_agot_historical_frostfinger:0 "Froidoigt"
 nick_agot_historical_frostfinger_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] perdu deux doigts à cause du froid alors [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'que vous étiez', 'qu’elle était'), 'qu’il était')] détenu dans une cage de glace."
 nick_agot_historical_gatehouse:0 "Corps-de-Garde"
 nick_agot_historical_gatehouse_desc:0 "On dit [CHARACTER.Custom('FR_du_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] que [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] herse est toujours ouverte aux chevaliers de passage."
 nick_agot_historical_giantsbane:0 "Fléau-d'Ogres"
 nick_agot_historical_giantsbane_desc:0 "Il est dit que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] tué un ogre, #italic un géant en d'autres termes#! — selon [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] version, [Select_CString(CHARACTER.IsLocalPlayer,'vous auriez','il aurait')] ouvert le ventre de la géante pour se tenir au chaud, après quoi [Select_CString(CHARACTER.IsLocalPlayer,'vous','le')] prenant pour son rejeton, elle  [Select_CString(CHARACTER.IsLocalPlayer,'vous aurez','l’aurait')] allaité durant trois mois à son réveil."
 nick_agot_historical_ginger:0 "[CHARACTER.Custom('FR_LeLa')] Rouquin[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_godsgrief:0 "Dieux-Deuil"
 nick_agot_historical_godsgrief_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] won the love of fair Elenei, daughter of gods, and took her to wife. For this, the sea god and the goddess of wind brought their wrath upon [CharYourHerHis(CHARACTER)] home, destroying each one until it was finally withstood by the seventh and final castle — Storm's End."
 nick_agot_historical_gold_tree:0 "Arbre-d'Or"
 nick_agot_historical_golden:0 "Doré[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_goldstag:0 "Bois Dorés"
 nick_agot_historical_great_axe:0 "Grande-Hache"
 nick_agot_historical_greatheart:0 "Grandcœur"
 nick_agot_historical_greatjon:0 "Lard-Jon"
 nick_agot_historical_greatjon_desc:0 "An enormous man, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] seven feet tall and twice as wide. A formidable warrior with fists as large as hams, many regard [CharYourHerHim(CHARACTER)] to be one of the strongest living men in Westeros."
 nick_agot_historical_greenbeard:0 "Barbeverte"
 nick_agot_historical_greenbeard_desc:0 "Le pigment de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] teinture est vraisemblablement la raison pour laquelle [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] obtenu ce surnom."
 nick_agot_historical_greenhand:0 "Mainverte"
 nick_agot_historical_greensail:0 "Voile Verte"
 nick_agot_historical_grey_eyes:0 "Yeux-Gris"
 nick_agot_historical_greybeard:0 "Barbe-Grise"
 nick_agot_historical_greycloak:0 "Manteaugris"
 nick_agot_historical_greysteel:0 "Grisacier"
 nick_agot_historical_greysteel_desc:0 "Chevalier réputé, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] pour l'habileté au combat [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'que vous êtes', 'qu’elle est'), 'qu’il est')] parvenu[CHARACTER.Custom('FR_E')] à transmettre aux autres."
 nick_agot_historical_grim:0 "Sombre"
 nick_agot_historical_half_hoare:0 "Mi-Chenu"
 nick_agot_historical_halfblood:0 "Sang-Mêlé"
 nick_agot_historical_halfdrowned:0 "Mi-Noyé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_halfhand:0 "Mimain"
 nick_agot_historical_halfhand_desc:0 "Au combat ou par accident, [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] vu [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] main s'écourter de moitié."
 nick_agot_historical_hard:0 "[CHARACTER.Custom('FR_LeLa')] Dur[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_hardhand:0 "la Poigne"
 nick_agot_historical_hardstone:0 "Durepierre"
 nick_agot_historical_hodor:0 "Hodor"
 nick_agot_historical_hodor_desc:0 "Hodor."
 nick_agot_historical_homeless:0 "Sans-Terre"
 nick_agot_historical_homeless_desc:0 "Né[CHARACTER.Custom('FR_E')] dans l'exil et élevé au sein de la Compagnie Dorée, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] continuellement vécu dans l'errance, n'ayant aucun véritable foyer."
 nick_agot_historical_honeyed:0 "Miel"
 nick_agot_historical_hot:0 "[Select_CString(CHARACTER.IsFemale,'la Bouillonnante','le Bouillonnant')]"
 nick_agot_historical_ice_eyes:0 "Yeux de Glace"
 nick_agot_historical_inkpots:0 "Pot-à-l’Encre"
 nick_agot_historical_iron:0 "en Fer"
 nick_agot_historical_iron_banger:0 "Choque-Fer"
 nick_agot_historical_ironfoot:0 "Pied-de-Fer"
 nick_agot_historical_ironhand:0 "Main de Fer"
 nick_agot_historical_ironhand_desc:0 "Adoubé[CHARACTER.Custom('FR_E')] pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] bravoure lors du siège de Pyk, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] perdu [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] main droite lors des combats, avant de finir par la remplacer par une autre, en fer."
 nick_agot_historical_ironrod:0 "Verge-De-Fer"
 nick_agot_historical_jingelbells:0 "Tintinnabul"
 nick_agot_historical_jingelbells_desc:0 "Simple d'esprit, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] affublé[CHARACTER.Custom('FR_E')] d'une couronne et d'un collet ornés de petites clochettes de laiton, comme il sied au fou des jumeaux."
 nick_agot_historical_kegs:0 "Muids"
 nick_agot_historical_kin_killer:0 "[CHARACTER.Custom('FR_LeLa')] Fratricide"
 nick_agot_historical_kin_killer_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] tué [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] propre frère, Durran, après que celui-ci tomba amoureux de sa nièce, [CHARACTER.LocalPlayerString('votre propre fille', 'la propre fille')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetFirstNameNoTooltipNoFormat')]."
 nick_agot_historical_knight_of_the_moon:0 "Chevalier de la Lune"
 nick_agot_historical_knight_of_the_pantry:0 "le Chevalier du Garde-Manger"
 nick_agot_historical_lame:0 "Bancroche"
 nick_agot_historical_lame_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] avec une jambe tordue."
 nick_agot_historical_lap_goose:0 "[CHARACTER.Custom('FR_LeLa')] Lèche-Plume"
 nick_agot_historical_lap_goose_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] loyauté par trop extrême qui [Select_CString(CHARACTER.IsLocalPlayer,'vous a','l’a')] poussé à rester fidèle au Roi Fou, même après tout ses crimes."
 nick_agot_historical_lazy:0 "la Flemme"
 nick_agot_historical_left_hand:0 "Main-Gauche"
 nick_agot_historical_lefthand:0 "Gaucher"
 nick_agot_historical_lemoncloak:0 "Limonbure"
 nick_agot_historical_lemoncloak_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'devez','doit')] [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] surnom à [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] cape couleur citron qui, de par son capuchon, [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] donne l'apparence d'un grand oiseau jaune."
 nick_agot_historical_lightheart:0 "Cœur Léger"
 nick_agot_historical_little:0 "Petit"
 nick_agot_historical_little_liddle:0 "Petit Lideuil"
 nick_agot_historical_little_liddle_desc:0 "Troisième [Select_CString(CHARACTER.IsFemale,'fille','fils')] des Lideuil, seul le temps dira si [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'donnerez','donnera')] raison à [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] sobriquet."
 nick_agot_historical_little_walder_frey:0 "Petit"
 nick_agot_historical_little_walder_frey_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] 52 jours après [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] cousin « Grand Walder », même si [Select_CString(CHARACTER.IsLocalPlayer,'vos','leur')] surnom respectif semble mal choisi quand on regarde [Select_CString(CHARACTER.IsLocalPlayer,'vos','leur')] taille respective."
 nick_agot_historical_littlefinger:0 "Littlefinger"
 nick_agot_historical_littlefinger_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] ainsi nommé[CHARACTER.Custom('FR_E')] en raison de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] apparence chétive — et parce que [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison réside sur le plus petit des Doigts."
 nick_agot_historical_littlefoot:0 "Petit Pied"
 nick_agot_historical_long:0 "[Select_CString(CHARACTER.IsFemale,'Longue','Long')]"
 nick_agot_historical_longaxe:0 "Longue-hache"
 nick_agot_historical_longinch:0 "Double-Flandrin"
 nick_agot_historical_longneck:0 "Loncol"
 nick_agot_historical_longneck_the_hanged:0 "Loncol le Pendu"
 nick_agot_historical_longneck_the_thrice_hanged:0 "Loncol Tripendu"
 nick_agot_historical_longneck_the_twice_hanged:0 "Loncol le Rependu"
 nick_agot_historical_longspear_ryk:0 "Échalas"
 nick_agot_historical_longspear_ryk_desc:0 "[CHARACTER.LocalPlayerString('Votre réputation', 'La réputation')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] ne vient pas de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] talent à [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] battre à coup de trique, mais de celle [Select_CString(CHARACTER.IsLocalPlayer,'que vous gardez','qu’il garde')] bien au chaud entre les jambes."
 nick_agot_historical_longthorn:0 "l'Épine"
 nick_agot_historical_lophand:0 "le Manchot"
 nick_agot_historical_lophand_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été arrêté pour vol et [Select_CString( CHARACTER.IsLocalPlayer, 'vous', CHARACTER.Custom('FR_IlElle'))] [Select_CString(CHARACTER.IsLocalPlayer,'ressentez','ressent')] toujours la sévérité du châtiment, au contraire de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] main."
 nick_agot_historical_lord_of_battles:0 "le Seigneur des Batailles"
 nick_agot_historical_lord_of_daughters:0 "le Seigneur des Filles"
 nick_agot_historical_mad:0 "F[CHARACTER.Custom('FR_OuOlle')]"
 nick_agot_historical_maidensbane:0 "la Terreur des Vierges"
 nick_agot_historical_maidensbane_desc:0 "En tant que Grand Roi des Îles de Fer, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] pillé la Treille et ravisé toutes les femmes de moins de trente ans."
 nick_agot_historical_merry:0 "Jolie"
 nick_agot_historical_middle_liddle:0 "Lideuil le Deux"
 nick_agot_historical_middle_liddle_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] ainsi nommé[CHARACTER.Custom('FR_E')] parce que de la fratrie Lideuil, [Select_CString(CHARACTER.IsLocalPlayer, Select_CString(CHARACTER.IsFemale, 'vous', 'elle'), 'il')] est [CHARACTER.Custom('FR_LeLa')] puîné[CHARACTER.Custom('FR_E')]."
 nick_agot_historical_milk_eye:0 "Œil-de-Lait"
 nick_agot_historical_milk_eye_desc:0 "Roi pirate tristement célèbre, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] combattu dans une guerre pour le Bec de Massey face au Roi de l'Orage Erich VII Durrandon, dit l'Impréparé."
 nick_agot_historical_mossdear:0 "Chère Mousse"
 nick_agot_historical_mudfoot:0 "Gadouilleux"
 nick_agot_historical_nine_eyes:0 "Neuf-z-Yeux"
 nick_agot_historical_nine_eyes_desc:0 "Redouté capitaine des « Joyeux Compagnons », [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] l'un des membres de la tristement célèbre Bande des Neuf."
 nick_agot_historical_noseless:0 "Sansnez"
 nick_agot_historical_noseless_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] perdu le bout de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] nez à cause d'une engelure."
 nick_agot_historical_oakenfist:0 "Poingdechêne"
 nick_agot_historical_oakenfist_desc:0 "À l'aide de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] navire amiral, la « Reine Rhaenys », [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'vous êtes','s’est')] illustré[CHARACTER.Custom('FR_E')] durant la Guerre des Filles en coulant un dromon braavien, le « Grand Défi », avec une efficacité fracassante."
 nick_agot_historical_oakenshield:0 "Écu-de-Chêne"
 nick_agot_historical_oakshanks:0 "Tiges de chêne"
 nick_agot_historical_of_many_honors:0 "aux Innombrables Horreurs"
 nick_agot_historical_of_oldstones:0 "de Vieilles-Pierres"
 nick_agot_historical_of_oldstones_desc:0 "[CHARACTER.LocalPlayerString('Vous', 'Une étrange fille coiffée de fleurs, ')][CHARACTER.LocalPlayerString('', 'Loc_FR_le_GetShortUINameNoTooltipNoFormat')] [Select_CString(CHARACTER.IsLocalPlayer,'revendiquez','revendique')] d'appartenir à la lignée des rois riverains de Vieilles-Pierres."
 nick_agot_historical_of_red_lake:0 "du Lac Rouge"
 nick_agot_historical_of_red_lake_desc:0 "Fille du légendaire Garth Mainverte, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] élu domicile aux abords du Lac Rouge, où [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] descendants ont continué de vivre. Selon la légende, les femmes de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] lignée aurait la capacité de se transformer en héron."
 nick_agot_historical_of_sour_hill:0 "de Mont-Amer"
 nick_agot_historical_of_sour_hill_desc:0 "Chevalier au grand âge ayant vécu presque autant d'années que de batailles, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'restez','reste')] néanmoins plus leste et vif que des hommes moitié moins âgé que [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')]."
 nick_agot_historical_of_the_black_hood:0 "à la Coule Noire"
 nick_agot_historical_of_the_black_hood_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] perpétué la sombre réputation de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] père en tant que seigneur d'Harrenhal."
 nick_agot_historical_of_the_bloody_blade:0 "à la Lame Sanglante"
 nick_agot_historical_of_the_bloody_blade_desc:0 "[CHARACTER.LocalPlayerString('Votre épée', 'L’épée')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] aurait tant fait couler le sang des enfants de la forêt que le Lac Bleue serait par la suite devenue le Lac Rouge."
 nick_agot_historical_of_the_brown_shield:0 "au Bouclier Brun"
 nick_agot_historical_of_the_brown_shield_desc:0 "Chevalier errant de mauvaise réputation, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] écu en amande, fait d'un bois sombre non peint et ceint de fer."
 nick_agot_historical_of_the_golden_bowl:0 "au Bol Doré"
 nick_agot_historical_of_the_high_tower:0 "de la Grand-Tour"
 nick_agot_historical_of_the_horn:0 "du Cor"
 nick_agot_historical_of_the_mirror_shield:0 "au Bouclier-Miroir"
 nick_agot_historical_of_the_mirror_shield_desc:0 "La légende raconte que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] trompé le dragon Urrax avec son propre reflet à l'aide d'un bouclier poli, avant de parvenir à occire la bête d'une lance dans l'œil."
 nick_agot_historical_of_the_red_smile:0 "au Rouge Sourire"
 nick_agot_historical_of_the_tower:0 "de la Tour"
 nick_agot_historical_of_the_vines:0 "des Vignes"
 nick_agot_historical_of_the_vines_desc:0 "Fils du légendaire Garth Mainverte, on dit [CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] [Select_CString(CHARACTER.IsLocalPlayer,'que vous auriez enseigné aux habitants de la Treille l’art de faire du vin','qu’il aurait enseigné aux habitants de Treille l’art de faire du vin')]."
 nick_agot_historical_of_the_woods:0 "des Forêts"
 nick_agot_historical_old_hawk:0 "Vieux Faucon"
 nick_agot_historical_old_tattersalt:0 "Vieilles Fripes-au-Sel"
 nick_agot_historical_old_tattersalt_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] known for the stained and faded black clothes [CharYouSheHe(CHARACTER)] wear[_s(CHARACTER)]."
 nick_agot_historical_one_ear:0 "qu'une-Oreille"
 nick_agot_historical_one_eye:0 "[CHARACTER.Custom('FR_LeLa')] Borgne"
 nick_agot_historical_one_eye_historical_aemond:0 "Un-Œil"
 nick_agot_historical_one_eye_historical_aemond_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'considérez','considère')] que la perte de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] œil pour gagner un dragon fut un juste échange."
 nick_agot_historical_one_eye_historical_jonnel:0 "[CHARACTER.Custom('FR_LeLa')] Borgne"
 nick_agot_historical_one_hand:0 "Une-Main"
 nick_agot_historical_one_hand_desc:0 "Capturé[CHARACTER.Custom('FR_E')] au combat lors de la Première Guerre Dornienne, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été dépossédé de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] main pour s'assurer qu'elle ne puisse plus jamais être levée contre Dorne."
 nick_agot_historical_palehair_gaemon:0 "Cheveux-Pâles"
 nick_agot_historical_palehair_gaemon_desc:0 "Bâtard[CHARACTER.Custom('FR_E')] d'Aegon II, selon les dires de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] mère, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'possédez','posséde')] les cheveux pâles distinctifs de la lignée de votre prétendu père."
 nick_agot_historical_pennylover:0 "Grippe-sou"
 nick_agot_historical_pimple:0 "Boutonneux"
 nick_agot_historical_pimple_desc:0 "[CHARACTER.LocalPlayerString('Votre visage', 'Le visage')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] est recouvert de pustules, et d'aucuns s'amusent à [Select_CString(CHARACTER.IsLocalPlayer,'vous','lui')] rappeler cette évidence."
 nick_agot_historical_pinchface:0 "Cul-de-Poule"
 nick_agot_historical_pinchpenny:0 "Grippe-sou"
 nick_agot_historical_preachfire:0 "[CHARACTER.Custom('FR_LeLa')] Prêcheu[CHARACTER.Custom('FR_RSe')] de Feu"
 nick_agot_historical_pretty:0 "Joli[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_priestkiller:0 "[CHARACTER.Custom('FR_LeLa')] Tueu[CHARACTER.Custom('FR_RSe')]-de-Prêtres"
 nick_agot_historical_priestkiller_desc:0 "Lorsque [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] fait bâtir un septuaire dans le Vieux Wyk, cela provoqua la colère des prêtres du Dieu Noyé, suite à quoi une révolte s'ensuivit, qui se termina dans le sang."
 nick_agot_historical_queen_lorea:0 "Reine Lorea"
 nick_agot_historical_queen_lorea_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'aimez','aime')] porter les vêtements de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] épouse afin de [Select_CString(CHARACTER.IsLocalPlayer,'vous','se')] promener sur les quais de Port-Lannis sous les traits d'une ribaude du commun."
 nick_agot_historical_ragged:0 "Guenilles"
 nick_agot_historical_ragged_desc:0 "Meneur des Pauvres Compagnons, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] et [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] acolytes ne [Select_CString(CHARACTER.IsLocalPlayer,'valaient','valent')] guère plus que des scélérats."
 nick_agot_historical_rattleshirt:0 "Clinquefrac"
 nick_agot_historical_raven_feeder:0 "Festin-des-Corbeaux"
 nick_agot_historical_raven_feeder_desc:0 "Après qu'Erich le Laid ait été renversé par Galon Blancbourdon, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] été choisi par les états généraux de la royauté pour devenir le nouveau Roi des Îles de Fer."
 nick_agot_historical_ravenfriend:0 "Ami-des-Freux"
 nick_agot_historical_reaversbane:0 "le Fléau des Ravageurs"
 nick_agot_historical_red:0 "Rouge"
 nick_agot_historical_red_oarsman:0 "Rameur Rouge"
 nick_agot_historical_red_spear:0 "Lance Rouge"
 nick_agot_historical_redarm_royce:0 "Bras-Rouge"
 nick_agot_historical_redarm_royce_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] tristement célèbre pour arracher les entrailles de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] prisonniers à mains nues."
 nick_agot_historical_redback:0 "Revers-Rouge"
 nick_agot_historical_redbeard:0 "Barberouge"
 nick_agot_historical_redhand_line:0 "Mainrouge"
 nick_agot_historical_redhand_line_desc:0 "La lignée d'Urron Greyfer, le premier Roi des Îles de Fer qui mit fin aux états généraux de la royauté et établit la royauté héréditaire."
 nick_agot_historical_redhand_urron:0 "Mainrouge"
 nick_agot_historical_redhand_urron_desc:0 "Accompagné[CHARACTER.Custom('FR_E')] de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] redoutables guerriers armés de hache, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] dévalé la Colline de Nagga et [Select_CString(CHARACTER.IsLocalPlayer,'massacrez','massacré')] tous [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] rivaux lors des états généraux de la royauté, mettant ainsi fin à l'ancienne tradition."
 nick_agot_historical_redraven:0 "Choucas Rouge"
 nick_agot_historical_redraven_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] ainsi nommé[CHARACTER.Custom('FR_E')] en raison de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] cheveux roux distinctifs — et accessoirement parce que les bardes avaient besoin d'une bonne musicalité avec « chocotter », pour écrire quelques balades moquant [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] lâcheté."
 nick_agot_historical_redsteel:0 "Rougeacier"
 nick_agot_historical_redtusk:0 "Rougeboutoir"
 nick_agot_historical_reek:0 "Schlingue"
 nick_agot_historical_reek_desc:0 "Schlingue, Schlingue, ça rime avec dingue."
 nick_agot_historical_salt_beard:0 "Barbe-Sel"
 nick_agot_historical_sealskinner:0 "Écorchephoque"
 nick_agot_historical_seaspray:0 "Embrun"
 nick_agot_historical_seastar:0 "Astre des Mers"
 nick_agot_historical_seastar_desc:0 "Surnommée « l'Astre des Mers » par [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] mère, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] considérée comme la plus belle femme des Sept Couronnes."
 nick_agot_historical_second_goose:0 "Seconde Plume"
 nick_agot_historical_second_goose_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] [CHARACTER.Custom('FR_LeLa')] puîné[CHARACTER.Custom('FR_E')] d'une fratrie de triplés."
 nick_agot_historical_sharpgrove:0 "Sharpgrove"
