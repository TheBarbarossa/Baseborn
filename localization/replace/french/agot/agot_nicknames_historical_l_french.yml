 nick_agot_historical_the_hammer:0 "le Marteau"
 nick_agot_historical_the_hammer_of_justice:0 "le Marteau de la Justice"
 nick_agot_historical_the_hammer_of_justice_desc:0 "Il est dit que [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] livré cent batailles et en [Select_CString(CHARACTER.IsLocalPlayer,'auriez','aurait')] gagné quatre-vingt-dix-neuf — la seule défaite ayant été face à une coalition de sept rois Andals."
