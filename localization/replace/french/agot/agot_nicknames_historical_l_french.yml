 nick_agot_historical_the_child:0 "l’Enfant"
 nick_agot_historical_the_child_desc:0 "Ce Grand Septon est connu pour avoir été élevé à sa positon durant son enfance, malgré les nombreuses protestations."
 nick_agot_historical_the_chopper:0 "le Hachoir"
 nick_agot_historical_the_clever:0 "[CHARACTER.Custom('FR_LeLa')] Futé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_cloakless:0 "le Sans-Manteau"
 nick_agot_historical_the_clubfoot:0 "[Select_CString(CHARACTER.IsFemale,'Pied-Bot','le Pied-Bot')]"
 nick_agot_historical_the_clubfoot_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] né[CHARACTER.Custom('FR_E')] avec un pied tordu et déformé, une affliction qui [Select_CString(CHARACTER.IsLocalPlayer,'vous ','l’')]a tourmenté toute [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] vie."
 nick_agot_historical_the_collector:0 "[Select_CString(CHARACTER.IsFemale,'la Collectionneuse','le Collectionneur')]"
 nick_agot_historical_the_conciliator:0 "[CHARACTER.Custom('FR_LeLa')] Conciliat[CHARACTER.Custom('FR_EurRice')]"
 nick_agot_historical_the_conciliator_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu à travers tout le royaume et au-delà pour [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] actions diplomatiques et [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] qualités d'orateurs."
 nick_agot_historical_the_conqueror:0 "[CHARACTER.Custom('FR_LeLa')] Conquérant[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_conqueror_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] conquis les Sept Couronnes par le feu et le sang, devenant ainsi une figure prédominante dans l'Histoire."
 nick_agot_historical_the_corpsekiller:0 "Tue-les-Morts"
 nick_agot_historical_the_corpsekiller_desc:0 "Lors du siège d'Astapor, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] abattu Cleon, le Roi Boucher. Glorieux exploit s'il en est — à ceci près qu'il s'agissait non du roi mais de son cadavre en armure, attaché à un cheval."
 nick_agot_historical_the_cousin:0 "[CHARACTER.Custom('FR_LeLa')] Cousin[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_crab:0 "le Crabe"
 nick_agot_historical_the_crackclaw:0 "Claquepince"
 nick_agot_historical_the_craftsman:0 "l'Artisan[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_creator:0 "[Select_CString(CHARACTER.IsFemale,'la Créatrice','le Créateur')]"
 nick_agot_historical_the_cruel:0 "[CHARACTER.Custom('FR_LeLa')] Crue[CHARACTER.Custom('FR_LLle')]"
 nick_agot_historical_the_cunning:0 "[CHARACTER.Custom('FR_LeLa')] Rusé[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_cunning_qhorwyn:0 "le Madré"
 nick_agot_historical_the_cunning_qhorwyn_desc:0 "Shrewd and avaricious, [CHARACTER.GetShortUINameNoTooltipNoFormat] avoided war and pursued trade. Believing that weakness invites attack, [CharYouSheHe(CHARACTER)] ordered the creation of additional armament — a decision that would greatly aid [CharYourHerHis(CHARACTER)] son's later conquest of the Riverlands."
 nick_agot_historical_the_curt:0 "[CHARACTER.Custom('FR_LeLa')] Brusque"
 nick_agot_historical_the_daring:0 "[CHARACTER.Custom('FR_LeLa')] Hardi[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_daring_daeron:0 "[CHARACTER.Custom('FR_LeLa')] Hardi[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_daring_daeron_desc:0 "Pour avoir sauvé l'armée de Lord Ormund Hightower avec [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] dragon Tessarion à seulement treize ans, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] reçu le surnom « le Hardi »."
 nick_agot_historical_the_darling_of_the_vale:0 "les Délices du Val"
 nick_agot_historical_the_darling_of_the_vale_desc:0 "En plus de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] extrême courtoisie, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] un jouteur de grand renom, au physique avenant et fort galant."
 nick_agot_historical_the_daughter_of_the_dusk:0 "la Fille du Crépuscule"
 nick_agot_historical_the_daughterless:0 "le Sans-Fille"
 nick_agot_historical_the_daughterless_desc:0 "[CHARACTER.LocalPlayerString('Votre fille', 'La fille')][CHARACTER.LocalPlayerString('', 'Loc_FR_du_GetShortUINameNoTooltipNoFormat')] a été enlevé par le Roi d'au-delà du Mur Baël le Barde, avant de rentrer chez elle, presque un an plus tard, enceinte d'un bâtard."
 nick_agot_historical_the_defiant_argrave:0 "le Belliqueux"
 nick_agot_historical_the_defiant_argrave_desc:0 "A knight from Nunny in service to Lord Butterwell, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharAreIs(CHARACTER)] often described to be a spare, hard man."
 nick_agot_historical_the_defiant_daena:0 "[Select_CString(CHARACTER.IsFemale,'la Rebelle','le Belliqueux')]"
 nick_agot_historical_the_defiant_daena_desc:0 "Continuellement obstiné[CHARACTER.Custom('FR_E')], [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connue pour avoir défié les tentatives continues de [Select_CString(CHARACTER.IsLocalPlayer,'votre','son')] frère Baelor de [Select_CString(CHARACTER.IsLocalPlayer,'vous ','l’')]emprisonner."
 nick_agot_historical_the_delayer:0 "[CHARACTER.Custom('FR_LeLa')] Tardi[CHARACTER.Custom('FR_FVe')]"
 nick_agot_historical_the_delayer_desc:0 "Ne souhaitant pas combattre la Foi Militante, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'avez','a')] fermé les portes de Villevieille afin de garder le Septon Lune et ses fidèles hors les murs."
 nick_agot_historical_the_demon:0 "[CHARACTER.Custom('FR_LeLa')] Démon[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_demon_of_darry:0 "le Démon de Darry"
 nick_agot_historical_the_demonlover:0 "le Démonolâtre"
 nick_agot_historical_the_devout:0 "[CHARACTER.Custom('FR_LeLa')] Dévot[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_dim:0 "[CHARACTER.Custom('FR_LeLa')] Niais[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_dogshead:0 "la Truffe"
 nick_agot_historical_the_dour_dorden:0 "[CHARACTER.Custom('FR_LeLa')] Sévère"
 nick_agot_historical_the_dour_durran:0 "[CHARACTER.Custom('FR_LeLa')] Lugubre"
 nick_agot_historical_the_dour_durran_desc:0 "[CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] célèbre pour avoir tué Lun le Dernier, Roi des Géants, lors de la Bataille des Eaux-Crosses."
 nick_agot_historical_the_dragonbane:0 "la Perte des Dragons"
 nick_agot_historical_the_dragonbane_desc:0 "Pour avoir régné durant la mort du dernier dragon, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] en tant que « la Perte des Dragons »."
 nick_agot_historical_the_dragonknight_historic:0 "le Chevalier-Dragon"
 nick_agot_historical_the_dragonknight_historic_desc:0 "Pour [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] noblesse, [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] valeur et [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] démonstration claire de l'héritage Targaryen, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu[CHARACTER.Custom('FR_E')] en tant que « Chevalier-Dragon »."
 nick_agot_historical_the_dragonless:0 "[CHARACTER.Custom('FR_LeLa')] Sans-Dragon"
 nick_agot_historical_the_dragonless_desc:0 "Malgré la coutume de [Select_CString(CHARACTER.IsLocalPlayer,'votre','sa')] maison, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'n’avez','n’a')] ni apprivoisé ni fait éclore de dragon."
