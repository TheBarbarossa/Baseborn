 nick_agot_historical_the_high_lickspittle:0 "Le Grand Lèche-Bottes"
 nick_agot_historical_the_high_lickspittle_desc:0 "Ce Grand Septon est connu pour sa loyauté irritante envers le Roi."
 nick_agot_historical_the_holy_fool:0 "[Select_CString(CHARACTER.IsFemale,'la Folle Sacrée','le Fou Sacré')]"
 nick_agot_historical_the_honorable:0 "l'Honorable"
 nick_agot_historical_the_hopeful:0 "l'Optimiste"
 nick_agot_historical_the_horsekiller:0 "le Fléau des Chevaux"
 nick_agot_historical_the_host:0 "l'Hôte"
 nick_agot_historical_the_host_desc:0 "Au contraire de [Select_CString(CHARACTER.IsLocalPlayer,'vos','ses')] prédécesseurs, [CHARACTER.Custom('FR_le_Char_U_Pi')][CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer,'êtes','est')] connu pour accueillir dans les Îles de Fer, les voyageurs et commerçants venus des quatre coins du monde."
 nick_agot_historical_the_hound:0 "le Limier"
 nick_agot_historical_the_humpback:0 "[CHARACTER.Custom('FR_LeLa')] Bossu[CHARACTER.Custom('FR_E')]"
 nick_agot_historical_the_hungry:0 "l'Affamé[CHARACTER.Custom('FR_E')]"
