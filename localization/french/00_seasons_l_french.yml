#Summer Seasons : 
seasons_dry_summer_phase:0 "Été sec"
seasons_hot_summer_phase:0 "Été chaud"
seasons_wet_summer_phase:0 "Été pluvieux"
seasons_dry_summer_phase_desc:0 "Les plantes se fanent, les puits se sont asséchés, là où le grain doré devrait être, il ne reste que de la poussière et du brun. Cet été est particulièrement dépourvu d'eau."
seasons_wet_summer_phase_desc:0 "Les cours d'eau s'écoulent avec intensité, la végétation s'épanouit et cet été connaît un excès d'eau comparativement à la norme."
seasons_hot_summer_phase_desc:0 "Les journées sont d'une longueur exceptionnelle, l'ombre est très recherchée et la chaleur étouffante. Cet été est incroyablement chaud."


#Autumn Seasons :

seasons_wet_autumn_phase:0 "Automne humide"
seasons_wet_autumn_phase_desc:0 "Cet automne est particulièrement humide."
seasons_dry_autumn_phase:0 "Automne sec"
seasons_dry_autumn_phase_desc:0 "Cet automne est particulièrement plus sec que d'habitude, ce qui entraîne une récolte plus faible."
seasons_cool_autumn_phase:0 "Automne frais"
seasons_cool_autumn_phase_desc:0 "Cet automne est plus frais que la normale, ce qui conduit à une production réduite et à des effets hivernales plus précoces."


#Winter is here Seasons :

seasons_winter_phase:0 "Hiver"
seasons_cold_winter_phase:0 "Hiver Glacial"
seasons_cold_winter_phase_desc:0 "La mer gèle, la neige recouvre le royaume, cet hiver est rigoureux, plus que d'habitude, beaucoup souffriront."
seasons_dornish_winter_phase:0 "Hiver du Sud"
seasons_dornish_winter_phase_desc:0 "Dans le sud, la neige et le gel sont rares. Les hivers ici sont doux en comparaison."
#Spring Seasons : 
seasons_wet_spring_phase:0 "Printemps Humide"
seasons_wet_spring_phase_desc:0 "Ce Printemps est particulièrement plus humide que la normale."
seasons_hot_spring_phase:0 "Printemps Chaud"
seasons_hot_spring_phase_desc:0 "Ce Printemps est nettement plus chaud que la normale, ce qui pourrait entraîner un été encore plus brûlant, ou un été extrêmement sec."
seasons_cool_spring_phase_desc:0 "Ce Printemps est presque assez froid pour être considéré comme une prolongation de l'hiver, c'est pourquoi la neige n'a pas entièrement fondu. En été, il peut être nettement plus humide ou plus sec que la normale."
seasons_cool_spring_phase:0 "Printemps frais"
seasons_dry_spring_phase_desc:0 "Ce Printemps présente un manque d'eau notable par rapport à la normale."
seasons_dry_spring_phase:0 "Printemps sec"
#Catalysts :

catalyst_dry_summer:0 "Été sec"
catalyst_dry_summer_desc:0 "Cet été sera plutôt sec..."
catalyst_hot_summer:0 "Été chaud"
catalyst_hot_summer_desc:0 "Cet été sera plutôt chaud.."
catalyst_wet_summer:0 "Été pluvieux"
catalyst_wet_summer_desc:0 "Cet été sera particulièrement humide."
catalyst_wet_spring_desc:0 "Ce Printemps pourrait être plus humide que d'habitude."
catalyst_hot_spring_desc:0 "Cette année, les fleurs bourgeonnent plus tôt et avec des journées longues et chaudes, on prévoit un Printemps étouffant pour cette saison."
catalyst_cool_spring_desc:0 "Peu de plantes fleurissent ce Printemps, et les étangs peu profonds restent gelés. On dirait que le Printemps sera plus froid cette saison."
catalyst_dry_spring_desc:0 "Peu de plantes fleurissent ce Printemps, et l'humidité habituelle du Printemps n'est pas encore arrivée."
