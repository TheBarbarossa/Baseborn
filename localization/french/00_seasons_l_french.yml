seasons_summer_phase_desc:0 "La saison est chaude et plus sèche, les fleurs ont éclos, et les cultures prospèrent, le royaume ressemble à un paradis."
seasons_winter_phase_desc:0 "La neige tombe sur tout le royaume, la glace pend aux fenêtres, et le froid atteint chaque recoin. L'hiver est là."
seasons_autumn_phase_desc:0 "Avec les feuilles qui tombent et deviennent rouges et oranges, l'automne est là. La fin de la récolte arrive."
seasons_spring_phase_desc:0 "Après si longtemps, l'hiver est enfin terminé. Et nous attendons maintenant le Printemps et l'été avec joie."
seasons_light_winter_phase_desc:0 "La neige tombe partout dans le royaume, la glace pend aux fenêtres, et le froid atteint chaque coin. L'hiver est là."
