##CREDIT TRANSLATION
##Lovojka, The Crack, Flo
season_events.001.t:0 "Les Vents de l'Hiver"
season_events.001.a.n:0 "L'hiver est arrivé."
season_events.001.desc:0 "Depuis des semaines, les jours raccourcissent et se refroidissent, les premiers flocons de neige tombent du ciel quand je vois un corbeau blanc de la Citadelle arriver ce matin, indiquant une seule chose. L'hiver est arrivé."

season_events.001.a.desc:0 "Un Corbeau Blanc est arrivé, nous informant de l'arrivée de l'hiver. Si mes yeux ne pouvaient pas voir la neige."

season_events.002.t:0 "Un rêve de Printemps"

season_events.002.desc:0 "Les premiers bourgeons de feuilles ont commencé à pousser sur les arbres, le sol est humide et détrempé à cause de la neige fondue, et le printemps arrivera bientôt."
season_events.003.desc:0 "Les journées sont désormais étendues et torrides, et les fleurs ont commencé à éclore et à s'épanouir. Il y en a qui peuvent implorer les dieux pour un été prolongé, mais plus cet été s'étend, plus l'hiver sera étendu. L'été a débuté..."
season_events.003.t:0 "Une chanson d'été"
season_events.003.a.n:0 "Toi, douce enfant d'été."
season_events.003.a.desc:0 "Avec l'arrivée de l'été, une période de prospérité commence, mais aussi celle de la guerre."
season_events.004.t:0 "Une danse d'automne"
season_events.004.a.n:0 "Et l'été aussi, est terminé."
season_events.004.a.desc:0 "L'hiver ne tardera pas à arriver."
season_events.004.desc:0 "Malgré la chaleur persistante durant la journée, les nuits se rafraîchissent et les feuilles commencent à adopter une couleur orange qui ne cesse de s'intensifier chaque jour qui s'écoule. L'automne s'est installé, l'été commence à se retirer et l'hiver vient rapidement. Il y a encore énormément à accomplir, la collecte doit débuter sans délai."


#season_events.001.a.desc.cynical:0 "One may have lost hope that the Winds of Winter would soon arrive."
season_events.002.a.n:0 "Finalement, l'hiver est passé."
season_events.002.a.desc:0 "Avec la fin de l'hiver et le Printemps à l'horizon"
agot_seasons_doctrine_seasons_name:0 "Saisons"
agot_seasons_doctrine_seasons:0 "Saisons"
agot_seasons_doctrine_winter_name:0 "Hiver"
agot_seasons_doctrine_winter_desc:0 "Lorsque les jours se réduisent et que l'atmosphère se refroidit, les brises se dirigent vers le sud, portant avec elles la désolation, l'hiver s'installe."
agot_seasons_doctrine_spring_name:0 "Printemps"
agot_seasons_doctrine_spring_desc:0 "La glace se dissipe lentement, les jours s'étirent et le chant des oiseaux commence à résonner. Le Printemps est arrivé."
agot_seasons_doctrine_autumn_name:0 "Automne"
agot_seasons_doctrine_autumn_desc:0 "Avec les feuilles qui tombent maintenant d'un orange vif, l'arrivée de l'hiver n'est plus qu'une question de temps. Pour le moment, nous sommes en automne."
agot_seasons_doctrine_summer_name:0 "Été"
agot_seasons_doctrine_summer_desc:0 "Avec les journées étendues et chaudes, et le vert vif du feuillage, on pourrait croire que ce paradis est destiné à durer éternellement."
rule_seasons_agot_game_rules:0 "AGOT : Saisons"
rule_seasons_agot_storm_rules:0 "Saisons : Règles de Tempête : WIP"
setting_seasons_storm_enabled:0 "Tempêtes d'automne activées"
setting_seasons_storm_enabled_desc:0 "Durant l'automne, on peut s'attendre à des tempêtes dans les Terres de l'Orage et les Pierres de l'Étape. Ce paramètre est actuellement en développement et n'a pas encore été entièrement testé. Les tempêtes ne sont pas mises au point et pourraient ne pas être efficaces. Si vous activez cette option et que vous êtes confronté à des tempêtes, merci de me tenir informé si vous avez des recommandations ou s'il y a des complications."
setting_seasons_storm_disabled:0 "Tempêtes d'automne désactivées"
setting_seasons_storm_disabled_desc:0 "Il n'y aura pas de tempêtes. Ceci est un paramètre par défaut temporaire, les tempêtes sont en cours de développement et ceci sert d'espace réservé. Activez cette option si vous souhaitez potentiellement vivre une tempête expérimentale. N'a pas encore été testé. Utilisez à vos propres risques."

#Nickname Rules
rule_seasons_nickname_frequency:0 "Fréquence de surnom saisonnier"
setting_normal_frequency_seasonal_nicks:0 "Normale"
setting_normal_frequency_seasonal_nicks_desc:0 "On constate l'apparition de surnoms saisonniers environ 10% du temps. Modifier cela actuellement n'a aucun effet, les surnoms apparaîtront toujours 10% du temps. Ceci sert de substitut. N'existe que pour garantir la compatibilité des nouvelles sauvegardes avec la prochaine grande mise à jour lorsqu'elle sera effectuée."
setting_very_rare_season_nick:0 "Très Rare"
setting_very_rare_season_nick_desc:0 "Les surnoms saisonniers apparaîtront environ 1% du temps."
setting_rare_season_nick:0 "Rare"
setting_rare_season_nick_desc:0 "Les surnoms saisonniers apparaîtront environ 5% du temps."
setting_common_season_nick:0 "Commun"
setting_common_season_nick_desc:0 "Les surnoms saisonniers apparaîtront environ 20% du temps."
setting_frequent_season_nick:0 "Fréquent"
setting_frequent_season_nick_desc:0 "Les surnoms saisonniers apparaîtront environ 35% du temps."
setting_excessive_season_nick:0 "Excessive"
setting_excessive_season_nick_desc:0 "Les surnoms saisonniers apparaîtront environ 50% du temps."
#eligiblity Rules
rule_seasons_nickname_eligiblity:0 "Éligibilité aux surnoms saisonniers"
setting_monarch_and_paramounts:0 "Trône de Fer et Seigneurs Suprêmes"
setting_monarch_and_paramounts_desc:0 "Seuls les enfants du Trône de Fer (ou d'autres titres impériaux) ou les Seigneurs Suprêmes peuvent obtenir un surnom saisonnier. Changer cela ne fait actuellement rien. Même raison que le réglage de fréquence."
setting_monarchs_only_seasons:0 "Trône de Fer et Empire Tier uniquement"
setting_monarchs_only_seasons_desc:0 "Seuls les enfants du Trône de Fer ou d'autres titres de niveau empire tels que Dorne indépendant peuvent recevoir un surnom saisonnier."
setting_all_high_lords_eligible_seasons:0 "Tous les Grands Seigneurs"
setting_all_high_lords_eligible_seasons_desc:0 "Les enfants de tout duc ou titre supérieur peuvent recevoir un Surnom de Saison."



#seasons_agot_game_rules_name:0 "AGOT : Seasons"
#agot_historical_seasons:0 "Historical Seasons"
setting_agot_historical_seasons:0 "Saisons Historiques"
setting_agot_historical_seasons_desc:0 "Suit le calendrier des Saisons fourni par la lore de 0 AC à 300 AC, semi-aléatoire après 300 AC."
setting_agot_sandbox_seasons:0 "Saisons non historiques"
#agot_sandbox_seasons:0 "Non-Historical Seasons"
setting_agot_sandbox_seasons_desc:0 "Toutes les longueurs de saison seront semi-aléatoirement définies, à des intervalles pondérés. Le jeu commencera au Printemps."
#setting_agot_semi_historical_seasons_desc:0 "Game will begin in the historical season, but will progress randomly"
#setting_agot_semi_historical_seasons:0 "Semi-Historical Seasons" #Temp Disabled as does nothing.
setting_agot_spring_war:0 "Guerres de Printemps"
setting_agot_spring_war_desc:0 "Les guerres telles que la Rébellion de Robert et la Rébellion de Peake auront lieu au Printemps dans le cadre des Saisons Historiques, et non en hiver."
setting_agot_winter_war:0 "Guerres d'hiver"
setting_agot_winter_war_desc:0 "Des guerres telles que la Rébellion de Robert et la Rébellion de Peake se dérouleront pendant l'hiver, suivant les Saisons du Canon des Saisons Historiques."
rule_seasons_agot_war_rules:0 "AGOT : Cadre de la Guerre des Saisons"
seasons_ending_decision:0 "Décision de fin de saison"
seasons_ending_decision_tooltip:0 "Ceci est pour le DEBUG des Saisons. Empêche les erreurs."
seasons_ending_decision_desc:0 "Pour le débogage du mod Seasons afin de prévenir les erreurs."
seasons_ending_decision_confirm:0 "Cela ne devrait pas être cliquable..."



catalyst_summer_desc:0 "L'été sera bientôt là..."
catalyst_autumn_desc:0 "L'automne approche, les brises se rafraîchissent."
catalyst_winter_desc:0 "L'hiver approche à grands pas, la première neige est déjà tombée."
catalyst_light_winter_desc:0 "L'hiver approche à grands pas, la première neige est déjà tombée."
catalyst_spring_desc:0 "Les premiers feuilles vertes indiquent que le Printemps est arrivé."


#Season Flavored Events yippee

season_flavor_events.001.t:0 "Une maison de fermier"
season_flavor_events.001.desc:0 "Alors que mon groupe et moi parcourons les terres, je tombe sur un petit fermier dans les collines. Je me dis que cela pourrait être le paradis ou l'enfer à sept niveaux. Le fermier ne pourra jamais récolter suffisamment avant l'arrivée de l'hiver. Lui et sa famille sont voués à mourir de faim."
season_flavor_events.001.a:0 "Eh bien... bonne chance..."
season_flavor_events.001.b:0 "Permettez-moi de vous aider"
season_flavor_events.001.c:0 "Ce qu'il ne remarquera pas ne lui fera pas de mal..." #Steal, try to find Sandor line

season_flavor_events.002.t:0 "Paysans dans le besoin"
season_flavor_events.002.desc:0 "Ce n'est pas un secret que cet hiver a été rigoureux et je ressens un désir d'abondance, lorsque le chef d'un village voisin vient me demander de l'aide. \n Le paysan me parle en ces termes : « Mon seigneur, nous vous prions humblement de bien vouloir nous donner un peu de nourriture, nous craignons de ne pas survivre à l'hiver... » Nous n'avons rien à proposer... Je suis désolé, mon seigneur. Mais s'il vous plaît, ne nous laissez pas mourir de faim."
season_flavor_events.002.a:0 "Je ferai tout ce qui est possible."
season_flavor_events.002.b:0 "Je suis vraiment désolé, il n'y a rien que je puisse faire."
season_flavor_events.002.c:0 "Je vais voir ce que je peux faire."
season_flavor_events.002.cruel:0 "Comment oses-tu me manquer de respect, misérable paysan ?" #Fucking kill them
season_flavor_events.002.cake:0 "Serveur, qu'ils mangent de la brioche."
season_flavor_events.002.callous:0 "Je m'en fiche profondément."
season_flavor_events.002.compassionate:0 "Oh, pauvres Paysans. Laissez-moi vous aider."
season_flavor_events.002.smart:0 "J'ai une idée."
season_flavor_events.002.stockpilehas:0 "Steward, donne-leur juste un peu des réserves."

season_flavor_events.003.t:0 "'Qu'ils mangent de la brioche, dirent-ils."
season_flavor_events.003.desc:0 "Les bénéfices de la seigneurie sont bien connus, tandis que mon royaume tout entier souffre de l'hiver rigoureux, ma cour et moi continuons à être submergés de nourriture. De nombreux membres de la cour ont commencé à proposer une Fête d'Hiver, nous pourrions demander à un pâtissier de confectionner un gâteau suffisamment grand pour alimenter l'ensemble du château. Par ailleurs, mon intendant me prévient que les paysans pourraient en vouloir à un seigneur qui fait la fête pendant qu'ils sont confrontés à la famine."
season_flavor_events.003.a:0 "Oh, être un Lord"
season_flavor_events.003.b:0 "Peut-être que cela pourrait être une folie..."
season_flavor_events.003.c:0 "Qu'ils mangent aussi du gâteau !"

season_flavor_events.004.t:0 "Souvenirs d'étés"
season_flavor_events.004.desc:0 "La joie et le sourire sont souvent associés aux années d'été, et aujourd'hui ne fait pas exception. Alors que je m'amuse dans les jardins avec mes amis, des éclats de rire résonnent partout, lorsque NAME_OF_SIB_OR_FRIEND_OR_PEER vient vers moi et me demande quel jeu nous allons jouer ensuite."
season_flavor_events.004.a:0 "Jouons !"
season_flavor_events.004.b:0 "Quel est l'intérêt ?"
season_flavor_events.004.c:0 "Lisons !"
#ADD DESC FOR SHY AND DEPRESSED AND GREGARIOUS

season_flavor_events.005.t:0 "Un enfant d'été doux ?"
season_flavor_events.005.desc:0 "Je suis né pendant l'été ! Oh, tellement adorable ! Hourra !"
season_flavor_events.005.a:0 "L'enfant doux été."
season_flavor_events.005.b:0 "Non merci."

season_flavor_events.006.t:0 "Fermiers, réjouissez-vous !"
season_flavor_events.006.desc:0 "Fermiers, réjouie."

season_flavor_events.060.t:0 "Une Taxe d'Hiver"
season_flavor_events.060.desc:0 "Je pourrais imposer une taxe de luxe supplémentaire aux nobles, ou bien instaurer un impôt général plus élevé sur les gens ordinaires pour équilibrer davantage mon budget. Néanmoins, aucun des deux groupes n'est susceptible d'être satisfait de ce choix."
season_flavor_events.060.a:0 "Imposer une taxe pour le bas peuple"
season_flavor_events.060.b:0 "Imposer une taxe aux Lords"
season_flavor_events.060.d:0 "Imposez-leur tous les deux !"
season_flavor_events.060.c:0 "J'ai changé d'avis."


seasons_noble_tax:0 "Taxe d'Hiver aux Lords"
seasons_noble_tax_desc:0 "Pour maintenir un bon niveau de liquidités durant l'hiver rigoureux, une taxe a été imposée aux seigneurs vassaux."
seasons_peasant_tax:0 "Taxe d'Hiver sur le peuple"
seasons_peasant_tax_desc:0 "Pour assurer un approvisionnement constant pendant l'hiver rigoureux, une taxe a été imposée au bas peuple, ce qui a suscité leur mécontentement."
seasons_levy_extra_tax:0 "Imposer une taxe d'Hiver"
seasons_levy_extra_tax_desc:0 "Face à cet hiver rigoureux, mes réserves commencent à s'épuiser. Il est donc de mon droit d'imposer une Taxe pour les renflouer. Mais à qui devrais-je imposer une taxe ? Les seigneurs ou les gens du peuple ?"
levy_winter_tax_tt:0 "Je peux imposer une taxe d'hiver pour maintenir l'équilibre budgétaire."
seasons_levy_extra_tax_confirm:0 "Imposer une Taxe"
seasons_levy_extra_tax_tooltip:0 "Je peux imposer une taxe d'hiver pour maintenir l'équilibre budgétaire."
seasons_all_tax:0 "Taxe d'Hiver"

rule_seasons_agot_winter_rules:0 "Force de l'hiver."
setting_normal_income_penalty:0 "Hiver Par défaut"
setting_light_income_penalty:0 "Hiver léger "
setting_normal_income_penalty_desc:0 "En général, les pénalités de revenus hivernaux entraînent une diminution d'environ 65% des revenus en moyenne pendant l'hiver. Il est probable que vous aurez soit un déficit, soit un revenu proche de zéro. Il est conseillé de diminuer les dépenses en hommes d'armes et en frais de cour."
setting_light_income_penalty_desc:0 "énalités de revenus légères en hiver, avec une réduction moyenne d'environ 30% des revenus pendant la saison hivernale. Votre revenu sera considérablement diminué, mais il est moins probable que vous soyez en déficit. Il est conseillé de réduire soit les hommes d'armes, soit les dépenses de la cour."

