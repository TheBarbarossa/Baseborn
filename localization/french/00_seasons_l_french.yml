seasons_cold_autumn_phase:0 "Un Automne Froid"
seasons_cold_autumn_phase_desc:0 "Le gel s'installe tôt, les jours semblent plus courts que d'habitude, et les feuilles sont d'un orange et d'un rouge éclatants. Cet automne est particulièrement plus froid que d'habitude."

agot_seasons_seasons_dornish_winter_phase_situation_phase:0 "Hiver du Sud"
agot_seasons_seasons_dornish_winter_phase_situation_phase_desc:0 "Dans le Grand Sud, il neige rarement, voire jamais. Ce sera un jour glacial aux Sept Enfers quand Dorne gèlera."

