 #Season Flavored Events yippee
 
 season_flavor_events.001.t:0 "El Hogar de un Campesino"
 season_flavor_events.001.desc:0 "Mientras mi campamento y yo atravesamos las tierras, me encuentro con un pequeño granjero en las colinas. Me digo a mí mismo que esto podría ser el cielo o los siete infiernos, el granjero nunca podrá cosechar lo suficiente antes de que llegue el invierno, él y su familia seguramente morirán de hambre."
 season_flavor_events.001.a:0 "Bueno... buena suerte..."
 season_flavor_events.001.b:0 "Déjame ayudarte"
 season_flavor_events.001.c:0 "Lo que no sepa no le hará daño..." #Steal, try to find Sandor line
 
 season_flavor_events.002.t:0 "Campesinos en Necesidad"
 season_flavor_events.002.desc:0 "No es ningún secreto que este invierno ha sido duro y me encuentro anhelando abundancia, cuando el líder de un pueblo local viene a hacerme una petición. \\n El campesino me habla diciendo ''M'lord, humildemente le pedimos que spare algo de comida, tememos que no sobreviviremos el invierno... No tenemos nada que ofrecer... Lo siento m'lord. Pero por favor, no nos deje morir de hambre."
 season_flavor_events.002.a:0 "Haré lo que pueda"
 season_flavor_events.002.b:0 "Lo siento mucho, no hay nada que pueda hacer."
 season_flavor_events.002.c:0 "Veré qué puedo hacer"
 season_flavor_events.002.cruel:0 "¿Cómo te atreves a faltarme el respeto, insolente campesino?" #Fucking kill them
 season_flavor_events.002.cake:0 "Mayordomo, que coman pasteles"
 season_flavor_events.002.callous:0 "Profundamente, me da igual."
 season_flavor_events.002.compassionate:0 "Oh pobrecillos. Dejadme ayudaros."
 season_flavor_events.002.smart:0 "Tengo una idea"
 season_flavor_events.002.stockpilehas:0 "Mayordomo, dales algo de las reservas"
 
 season_flavor_events.003.t:0 "'Que coman pasteles', dijeron"
 season_flavor_events.003.desc:0 "Los beneficios de ser un señor no son ningún secreto, con el resto de mi reino luchando en este invierno, mi corte y yo nos encontramos sufriendo de exceso de provisiones. Y muchos cortesanos han comenzado a sugerir una Celebración de Invierno, podríamos encargar a un panadero que hornee un pastel lo suficientemente grande como para alimentar a todo el castillo. Por otro lado, mi Castellano advierte que los campesinos pueden resentir a un señor que festeja mientras ellos mueren de hambre."
 season_flavor_events.003.a:0 "Oh, ser un Señor"
 season_flavor_events.003.b:0 "Quizás esto sea una locura..."
 season_flavor_events.003.c:0 "¡Que ellos también coman pastel!"
 
 season_flavor_events.004.t:0 "Memorias de Verano"
 season_flavor_events.004.desc:0 "La alegría y las sonrisas son frecuentemente sinónimos de los años de verano, y hoy no es la excepción. Mientras juego en los jardines con mis compañeros, las risas se escuchan por todos lados, cuando NOMBRE_DEL_HERM_O_AMIGO_O_COMPAÑERO se acerca a mí y pregunta a qué juego jugamos a continuación."
 season_flavor_events.004.a:0 "¡A jugar!"
 season_flavor_events.004.b:0 "¿Qué sentido tiene?"
 season_flavor_events.004.c:0 "¡A leer!"
 #ADD DESC FOR SHY AND DEPRESSED AND GREGARIOUS
 
 season_flavor_events.005.t:0 "¿Un Dulce Niño del Verano?"
 season_flavor_events.005.desc:0 "ARREGLAR... ¡Soy un niño del verano! ¡Oh qué dulce! ¡Yupi!"
 season_flavor_events.005.a:0 "El Dulce Niño del Verano."
 season_flavor_events.005.b:0 "No, gracias."
 
 season_flavor_events.006.t:0 "¡Los campesinos se regocijan!"
 season_flavor_events.006.desc:0 "Campesinos. Regocijaos."
 
 season_flavor_events.060.t:0 "Imponer un Impuesto Invernal"
 season_flavor_events.060.desc:0 "Podría imponer un impuesto adicional sobre lujos a los señores, o podría implementar un impuesto general más alto sobre la gente común para equilibrar mejor mi presupuesto. Sin embargo, es poco probable que ninguno de los dos grupos esté contento con esta decisión..."
 season_flavor_events.060.a:0 "Imponer un impuesto a la Gente Común"
 season_flavor_events.060.b:0 "Imponer un impuesto a los Señores"
 season_flavor_events.060.d:0 "¡Gravarlos a ambos!"
 season_flavor_events.060.c:0 "He cambiado de opinión..."
 
 
 seasons_noble_tax:0 "Impuesto de Invierno a los Señores"
 seasons_noble_tax_desc:0 "Para mantener las arcas llenas durante el duro invierno, se ha impuesto un impuesto a los señores vasallos"
 seasons_peasant_tax:0 "Impuesto de Invierno a la Gente Común"
 seasons_peasant_tax_desc:0 "Para mantener las arcas llenas durante el duro invierno, se ha impuesto un impuesto a la gente común, para su gran descontento."
 seasons_levy_extra_tax:0 "Imponer un Impuesto de Invierno"
 seasons_levy_extra_tax_desc:0 "Durante este duro invierno, mis arcas comienzan a vaciarse, es mi derecho imponer un impuesto para mantenerlas llenas. ¿Pero a quién grabaré? ¿A los señores o a la gente común?
 levy_winter_tax_tt:0 "Puedo imponer un impuesto de invierno para mantener el presupuesto equilibrado."
 seasons_levy_extra_tax_confirm:0 "Imponer el Impuesto"
 seasons_levy_extra_tax_tooltip:0 "Puedo imponer un impuesto de invierno para mantener el presupuesto equilibrado."
 seasons_all_tax:0 "Impuesto de Invierno"
 
