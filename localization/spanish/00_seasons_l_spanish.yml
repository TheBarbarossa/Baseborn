 setting_common_season_nick_desc:0 "Los apodos estacionales ocurrirán aproximadamente un 20% de las veces."
 setting_frequent_season_nick:0 "Frecuente"
 setting_frequent_season_nick_desc:0 "Los apodos estacionales ocurrirán aproximadamente un 35% de las veces."
 setting_excessive_season_nick:0 "Excesivo"
 setting_excessive_season_nick_desc:0 "Los apodos estacionales ocurrirán aproximadamente un 50% de las veces."
