l_spanish: 
 season_events.001.t:0 "Los Vientos de Invierno"
 season_events.001.a.n:0 "El invierno ha llegado."
 season_events.001.desc:0 "Durante semanas los días han ido acortándose y enfriándose, los primeros copos de nieve caen del cielo cuando veo que esta mañana ha llegado un Cuervo Blanco de la Ciudadela, anunciando una sola cosa. El invierno ha llegado."
 
 season_events.001.a.desc:0 "Ha llegado un Cuervo Blanco informándonos de la llegada del invierno. Como si mis ojos no pudieran ver la nieve."
 
 season_events.002.t:0 "Un Sueño de Primavera"
 
 season_events.002.desc:0 "Los primeros brotes de hojas han comenzado a crecer en los árboles, el suelo está húmedo y encharcado por la nieve derretida, y pronto llegará la Primavera."
 season_events.003.desc:0 "Los días son largos y calurosos ahora, y las flores han florecido y se multiplican. Algunos pueden rezar a los Dioses por un largo verano, pero cuanto más se prolonga el verano, más largo será el invierno. El verano ha comenzado."
 season_events.003.t:0 "Una Canción del Verano"
 season_events.003.a.n:0 "Dulce niño del verano."
 season_events.003.a.desc:0 "Con la llegada del verano, el tiempo de la prosperidad está aquí, y también el de la guerra."
 season_events.004.t:0 "Una Danza Otoñal"
 season_events.004.a.n:0 "Y el verano también ha terminado."
 season_events.004.a.desc:0 "No tardará mucho en llegar el invierno."
 season_events.004.desc:0 "Si bien los días siguen siendo cálidos, las noches se vuelven más frescas, y las hojas comienzan a tener un tinte anaranjado que crece con cada día que pasa. El otoño ha llegado, y el verano ha comenzado a terminar, con el invierno acercándose rápidamente. Queda mucho por hacer, la cosecha debe comenzar de inmediato."
 Seasonal_Variants:0 "Variantes Estacionales"
 
 #season_events.001.a.desc.cynical:0 "One may have lost hope that the Winds of Winter would soon arrive."
 season_events.002.a.n:0 "Por fin, el invierno ha pasado."
 season_events.002.a.desc:0 "Con el fin del invierno y la primavera en el horizonte, lo que una vez fue un sueño ahora ha llegado."
 agot_seasons_doctrine_seasons_name:0 "Las Estaciones"
 agot_seasons_doctrine_seasons:0 "Las Estaciones"
 agot_seasons_doctrine_winter_name:0 "Invierno"
 agot_seasons_doctrine_winter_desc:0 "Cuando los días se acortan y el aire se enfría cada vez más, los vientos soplan desde el sur trayendo desesperación, el invierno está sobre nosotros."
 agot_seasons_doctrine_spring_name:0 "Primavera"
 agot_seasons_doctrine_spring_desc:0 "Los días se alargan poco a poco, el hielo se derrite y los pájaros comienzan a cantar. La primavera está sobre nosotros."
 agot_seasons_doctrine_autumn_name:0 "Otoño"
 agot_seasons_doctrine_autumn_desc:0 "Con la caída de las ahora anaranjadas hojas, es solo cuestión de tiempo antes de que llegue el invierno. Pero por ahora, el otoño está sobre nosotros."
 agot_seasons_doctrine_summer_name:0 "Verano"
 agot_seasons_doctrine_summer_desc:0 "Con los largos y calurosos días, y el verde brillante del follaje, parece que este paraíso pudiera durar para siempre."
 rule_seasons_agot_game_rules:0 "AGOT: Estaciones"
 rule_seasons_agot_storm_rules:0 "Estaciones: Reglas de Tormentas: En Desarrollo"
 setting_seasons_storm_enabled:0 "Tormentas de Otoño Activadas"
 setting_seasons_storm_enabled_desc:0 "Las tormentas pueden ocurrir en las Tierras de la Tormenta y las Stepas durante el Otoño. Esta configuración está en desarrollo y no ha sido completamente probada. Las tormentas no están completamente desarrolladas y puede que no funcionen. Si usas esta configuración y experimentas tormentas, por favor hazme saber si tienes sugerencias o si hay problemas."
 setting_seasons_storm_disabled:0 "Tormentas de Otoño Desactivadas"
 setting_seasons_storm_disabled_desc:0 "Las tormentas no ocurrirán. Esta es una configuración predeterminada temporal, las tormentas están en desarrollo y esto es un marcador de posición. Actívala si quieres experimentar potencialmente tormentas experimentales. No ha sido probada aún. Úsala bajo tu propio riesgo."
 
 #Nickname Rules
 rule_seasons_nickname_frequency:0 "Frecuencia de Apodos Estacionales"
 setting_normal_frequency_seasonal_nicks:0 "Normal"
 setting_normal_frequency_seasonal_nicks_desc:0 "Los apodos estacionales ocurrirán aproximadamente un 10% de las veces. Cambiar esto actualmente no hace nada, los apodos siempre ocurrirán el 10% de las veces. Esto sirve como marcador de posición. Solo existe para que las nuevas partidas sean compatibles con la próxima actualización mayor cuando sí funcionará."
