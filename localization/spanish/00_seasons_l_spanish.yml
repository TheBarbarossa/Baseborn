 setting_light_income_penalty:0 "Invierno Suave"
 setting_normal_income_penalty_desc:0 "Penalizaciones de ingresos de invierno normales, aproximadamente un 65% de reducción de ingresos durante el invierno en promedio. Es probable que tengas déficit o ingresos cercanos a cero. Se recomienda reducir los Hombres de Armas y los Gastos de Corte."
 setting_light_income_penalty_desc:0 "Penalizaciones de ingresos de invierno suaves, aproximadamente un 30% de reducción de ingresos durante el invierno en promedio. Tus ingresos se reducirán considerablemente, pero es menos probable que tengas déficit. Se recomienda reducir los Hombres de Armas o los Gastos de Corte."
 
