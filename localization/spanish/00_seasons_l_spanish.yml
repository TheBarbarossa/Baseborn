 rule_seasons_nickname_eligiblity:0 "Elegibilidad de Apodos Estacionales"
 setting_monarch_and_paramounts:0 "Trono de Hierro y Lores Paramount"
 setting_monarch_and_paramounts_desc:0 "Solo los hijos del Trono de Hierro (u otros títulos de Imperio) o los Lores Paramount pueden obtener un apodo estacional. Cambiar esto actualmente no hace nada. Misma razón que la configuración de frecuencia."
