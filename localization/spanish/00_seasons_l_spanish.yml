 seasons_autumn_phase_desc:0 "Con las hojas cayendo y tornándose rojas y anaranjadas, el otoño está aquí. El fin de la cosecha se acerca."
 seasons_spring_phase_desc:0 "Después de tanto tiempo, el invierno finalmente ha terminado. Y ahora miramos hacia la primavera y el verano en busca de alegría."
