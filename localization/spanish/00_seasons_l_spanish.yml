 seasons_wet_summer_phase:0 "Verano Lluvioso"
 seasons_dry_summer_phase_desc:0 "Las plantas se marchitan, los pozos se han secado, donde debería haber grano dorado solo quedan polvo y marrón. Este verano es notablemente escaso en agua."
 seasons_wet_summer_phase_desc:0 "Los ríos fluyen profundos, las plantas florecen, este verano tiene una abundancia de agua en comparación con lo normal."
 seasons_hot_summer_phase_desc:0 "Los días son extraordinariamente largos, la sombra es muy deseada, y el calor sofocante. Este verano es excesivamente caluroso."
 
 
