 # Decisions
 baseborn_nights_watch_election:0 "#difficulty_easy Elect Jon Snow as Lord Commander"
 baseborn_nights_watch_election_desc:0 "The brothers of the Night’s Watch gather to choose a new Lord Commander. Each candidate’s service at Castle Black and their time beyond the Wall are well known to the Watch and are being considered. Some may look to a candidate’s experience, others to their resolve, or perhaps how reliable their loyalty might be. Jon Snow stands amongst his fellow candidates and could certainly be deemed more fit to lead than the rest, but that remains to be seen. Should the votes favor him, Jon Snow will be elected as the new Lord Commander of The Night’s Watch. \n\n#difficulty_easy By using this decision, Jon Snow will be elected as the new Lord Commander of the Night's Watch, as in canon."
 baseborn_nights_watch_election_confirm:0 "Elect him."
 baseborn_tyrion_patricide:0 "#difficulty_easy Let Tyrion Escape"
 baseborn_tyrion_patricide_desc:0 "By using this decision, Tyrion will escape imprisonment, kill Tywin, and vanish to Essos."
 baseborn_tyrion_patricide_confirm:0 "Do I shit gold?"

 baseborn_knight_glory_decision:0 "Increase the glory of your Accolades"
 baseborn_knight_glory_decision_desc:0 "Throw small tournies and feasts with the goal of spreading the word of your glorious and prestigious knights far and wide."
 baseborn_knight_glory_decision_tooltip:0 "Spend prestige to increase the glory of your Accolades"
 baseborn_knight_glory_decision_confirm:0 "Increase the glory of your Accolades"

# The brothers of the Night’s Watch gather to choose a new Lord Commander.

# Each candidate’s service at Castle Black and their time beyond the Wall are well known to the Watch and are being considered. Some may look to a candidate’s experience, others to their resolve, or perhaps how reliable their loyalty might be. 

# Jon Snow stands amongst his fellow candidates and could certainly be deemed more fit to lead than the rest, but that remains to be seen. Should the votes favor him, Jon Snow will be elected as the new Lord Commander of The Night’s Watch.

# By using this decision, Jon Snow will be elected as the new Lord Commander of the Night's Watch, as in canon.

# \n